<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nursing Ethics — TA SERIES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;color:#1c2b33;
background:linear-gradient(160deg,#eef7f0 0%,#e7f1ea 40%,#e6f2ee 75%,#fdf3e3 100%)}
/* soft floating plus signs instead of balls */
.plus{position:absolute;z-index:1;font-size:20px;color:rgba(14,154,92,.16);pointer-events:none;animation:orbFloat 5s ease-in-out infinite}
.p1{top:11%;left:6%}
.p2{top:36%;right:5%;animation-delay:1.5s;font-size:16px}
.p3{bottom:15%;left:8%;animation-delay:2.5s}
.p4{top:62%;right:8%;animation-delay:3.5s;font-size:15px;color:rgba(190,150,30,.18)}
/* liquid glass: blur + tint + border + shadow + specular highlight */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.28));
backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
border:1px solid rgba(255,255,255,.85);
box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),
9px 12px 28px rgba(90,110,150,.16),-6px -6px 18px rgba(255,255,255,.7);
border-radius:28px}
/* ---------- splash / intro ---------- */
#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
background:linear-gradient(180deg,#0d2b23,#0e523c 55%,#0a2e22);color:#fff;transition:opacity .6s,transform .6s}
#splash.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.cross{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:44px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.ecg{width:240px;height:56px;margin-top:26px}
.ecg path{stroke:#7cf2c8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.6s ease forwards .2s}
@keyframes draw{to{stroke-dashoffset:0}}
#splash h1{font-family:Georgia,serif;font-weight:400;font-size:38px;margin-top:22px;line-height:1.2}
#splash h1 span{color:#f2c94c}
#splash p{color:#cfe8d8;font-size:14px;line-height:1.7;margin-top:12px}
.enter{margin-top:30px;padding:15px 40px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);color:#fff;font-size:16px;font-weight:700;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flo{position:absolute;font-size:26px;pointer-events:none;animation:orbFloat 4s ease-in-out infinite}
.f1{top:13%;left:11%;color:rgba(14,154,92,.45)}
.f2{top:21%;right:12%;animation-delay:1.2s;color:rgba(190,150,30,.5)}
.f3{bottom:19%;left:17%;animation-delay:2.2s;color:rgba(14,154,92,.35)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.minibook{width:126px;height:88px;position:relative;margin-top:26px;perspective:700px}
.mb-cover{position:absolute;inset:-7px -9px;background:linear-gradient(135deg,#177a58,#0b3d2e);border:2px solid #d4af37;border-radius:10px;box-shadow:0 16px 34px rgba(0,0,0,.4)}
.mb-page{position:absolute;top:0;width:63px;height:88px;background:#fffdf4;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.mb-page.right{right:0;border-radius:3px 9px 9px 3px;background:#f4efdb}
.mb-page.left{left:0;border-radius:9px 3px 3px 9px;transform-origin:right center;animation:mbturn 2s ease-in-out infinite}
@keyframes mbturn{0%,30%{transform:rotateY(0)}60%,100%{transform:rotateY(-168deg)}}
.loadbar{width:150px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:22px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7cf2c8,#f2c94c);animation:load 1.8s ease forwards}
@keyframes load{to{width:100%}}
#splash h1{animation:fadeUp .8s ease both .1s}
#splash p{animation:fadeUp .8s ease both .25s}
#splash .enter{animation:fadeUp .8s ease both .45s,bob 1.6s ease-in-out .9s infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* ---------- clean top ---------- */
.cover{position:relative;z-index:2;padding:34px 22px 4px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:5px;color:#7a8a94;font-weight:700}
h1.big{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:42px;line-height:1.08;margin-top:12px;color:#16242c}
h1.big em{font-style:italic;background:linear-gradient(120deg,#0e9a5c,#14684c,#2f9e6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;color:#66788a;line-height:1.6;margin-top:10px}
.pills{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pill{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:#3c5566;
background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35));backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px rgba(90,110,150,.12)}
.pill b{color:#0b6e3f}
/* ---------- the shelf: one row of real books ---------- */
/* ---------- chapter cards grid (like the website) ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 16px 0;position:relative;z-index:2}
.gcard{position:relative;text-align:left;background:#dfe8e1;border:none;border-radius:22px;padding:16px 30px 16px 15px;cursor:pointer;box-shadow:7px 7px 14px rgba(120,145,130,.4),-7px -7px 14px rgba(255,255,255,.85);transition:transform .15s,box-shadow .25s;font-family:inherit}
.gcard:active{transform:scale(.97);box-shadow:inset 4px 4px 8px rgba(120,145,130,.35),inset -4px -4px 8px rgba(255,255,255,.8)}
.gcard.wide{grid-column:1/-1}
.gcard.kmu{background:linear-gradient(135deg,#0e7a4c,#0b3d2e);box-shadow:7px 7px 16px rgba(11,61,46,.4),-7px -7px 14px rgba(255,255,255,.7)}
.gcard.mock{background:linear-gradient(135deg,#d4af37,#8a6d1b);box-shadow:7px 7px 16px rgba(107,85,16,.4),-7px -7px 14px rgba(255,255,255,.7)}
.g-tag{display:block;font-size:10px;letter-spacing:2.5px;font-weight:800;color:#0b6e3f}
.gcard.kmu .g-tag{color:#7cf2c8}
.gcard.mock .g-tag{color:#fff}
.g-title{display:block;font-family:Georgia,serif;font-size:17px;line-height:1.3;color:#24332b;margin-top:6px}
.gcard.kmu .g-title,.gcard.mock .g-title{color:#fff}
.g-sub{display:block;font-size:12.5px;color:#5a6f63;margin-top:6px}
.gcard.kmu .g-sub{color:rgba(255,255,255,.78)}
.gcard.mock .g-sub{color:rgba(255,255,255,.88)}
.g-go{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:800;color:#0b6e3f}
.gcard.kmu .g-go,.gcard.mock .g-go{color:rgba(255,255,255,.9)}

.foot{text-align:center;color:#93a3ae;font-size:12px;padding:10px 22px 28px;line-height:1.6;position:relative;z-index:2}
.optrows{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#dfe8e1;border:none;border-radius:18px;padding:13px 15px;font-size:15px;font-weight:600;color:#3c4f45;cursor:pointer;box-shadow:6px 6px 12px rgba(120,145,130,.4),-6px -6px 12px rgba(255,255,255,.85);transition:box-shadow .25s,background .25s,transform .15s}
.optrow:active{transform:scale(.98)}
.optrow .radio{flex:0 0 24px;height:24px;border-radius:50%;background:#dfe8e1;box-shadow:inset 3px 3px 6px rgba(120,145,130,.45),inset -3px -3px 6px rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.optrow.on{background:#c9ecd6;box-shadow:inset 4px 4px 8px rgba(20,104,76,.22),inset -4px -4px 8px rgba(255,255,255,.6)}
.optrow.on .radio{background:linear-gradient(135deg,#0e9a5c,#14684c);box-shadow:0 3px 8px rgba(20,104,76,.4)}
.liquid{position:relative;overflow:hidden;isolation:isolate}
.liquid::before{content:"";position:absolute;left:0;top:-14%;width:100%;height:128%;z-index:-1;border-radius:48% 52% 0 0/28px 28px 0 0;background:linear-gradient(120deg,#0e9a5c,#14684c);transform:translateY(92%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
.liquid::after{content:"";position:absolute;left:14%;top:9px;width:40%;height:9px;z-index:-1;border-radius:99px;background:rgba(255,255,255,.4);opacity:0;transition:opacity .4s}
.liquid.on::before,.liquid.fill::before{transform:translateY(0)}
.liquid.on::after{opacity:1}
.liquid.fill::after{opacity:.28;left:auto;right:12%;top:50%;width:56px;height:22px;animation:liquidDrift 3.2s ease-in-out infinite}
@keyframes liquidDrift{0%,100%{transform:translate(0,-50%) scale(1)}50%{transform:translate(-16px,-50%) scale(1.3,.75)}}
.liquid:active{transform:scale(.97)}
.liquid:active::before{transform:translateY(0)}
.btn.outline{background:rgba(255,255,255,.7);border:1.5px solid #0e9a5c;color:#0b6e3f}
.optlabel{font-size:12px;letter-spacing:3px;color:#7a8a94;font-weight:700;margin-top:18px}
.setupinfo{font-size:13.5px;color:#66788a;margin-top:16px;line-height:1.6;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 14px}
.setupnote{font-size:12px;color:#93a3ae;margin-top:8px;line-height:1.5}
.topbar .scorepill{padding:7px 9px;font-size:12px}
.chrow{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:13px 15px;margin-top:9px;cursor:pointer;font-size:14.5px;line-height:1.45}
.chrow b{color:#16242c}
.chrow .weak{color:#b45309;font-weight:700}
.chdetail{text-align:left;margin-top:8px}
.revq{background:rgba(255,255,255,.8);border-radius:14px;padding:12px;margin-top:8px;font-size:14px;line-height:1.5}
.revq .rq{font-family:Georgia,serif;color:#16242c}
.revq .ry{color:#dc2626;margin-top:5px}
.revq .rc{color:#16a34a;margin-top:3px}
.revq .rr{color:#66788a;margin-top:5px;font-size:13.5px}
.statgrid{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.stat{padding:10px 13px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);font-size:12.5px;color:#66788a;line-height:1.5}
.stat b{display:block;font-size:16px;color:#16242c}
.wm{position:absolute;top:50%;z-index:1;writing-mode:vertical-rl;font-size:22px;letter-spacing:8px;font-weight:800;color:rgba(20,60,40,.07);pointer-events:none;white-space:nowrap}
.wm-l{left:3px;transform:translateY(-50%) rotate(180deg)}
.wm-r{right:3px;transform:translateY(-50%)}
#splash .wm{color:rgba(255,255,255,.09)}
/* ---------- book-opening overlay ---------- */
#opener{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.35);backdrop-filter:blur(6px)}
#opener.show{display:flex}
.openbook{width:250px;height:330px;position:relative;perspective:1200px;animation:zoomin .5s ease}
@keyframes zoomin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.openbook .pg{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:#fffdf4;box-shadow:0 24px 50px rgba(0,0,0,.45);transform-origin:left center;animation:pageturn 1s ease .35s forwards}
@keyframes pageturn{from{transform:rotateY(0)}to{transform:rotateY(-178deg)}}
.openbook .cov{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:linear-gradient(135deg,#14684c,#0b3d2e);border:2px solid #d4af37;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:18px}
.openbook .cov h3{font-family:Georgia,serif;font-size:21px;line-height:1.3;margin-top:10px}
.openbook .cov p{font-size:11px;letter-spacing:3px;color:#f2c94c;margin-top:10px}
/* ---------- chapter intro page ---------- */
.intro{margin:26px 16px;padding:34px 22px;text-align:center;position:relative;z-index:2;animation:pagein .5s ease}
.intro .big-no{font-family:Georgia,serif;font-size:74px;line-height:1;background:linear-gradient(120deg,#0e9a5c,#14684c,#2f9e6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h2{font-family:Georgia,serif;font-weight:400;font-size:26px;margin-top:12px;line-height:1.3;color:#16242c}
.intro p{color:#66788a;line-height:1.65;margin-top:10px;font-size:15px}
/* ---------- quiz: game feel ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:18px 16px 8px;position:relative;z-index:2}
.backbtn{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.4));backdrop-filter:blur(12px);color:#3c5566;border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,110,150,.14)}
.chip{flex:1;text-align:center;font-size:12.5px;color:#66788a;line-height:1.4}
.chip b{color:#16242c}
.scorepill{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.4));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);color:#3c5566;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,110,150,.14)}
.scorepill b{color:#0b6e3f}
.prog{height:6px;background:rgba(255,255,255,.65);border-radius:20px;margin:8px 20px 16px;overflow:hidden;position:relative;z-index:2;box-shadow:inset 0 1px 3px rgba(90,110,150,.2)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#0e9a5c,#14684c,#2f9e6e);border-radius:20px;transition:width .4s}
.qcard{margin:2px 16px 18px;padding:22px 18px;position:relative;z-index:2;animation:pagein .45s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.qtag{display:inline-block;background:rgba(20,122,76,.12);color:#0b6e3f;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;margin-bottom:13px}
.qtext{font-family:Georgia,serif;font-size:20px;line-height:1.55;color:#16242c}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border:1.5px solid rgba(255,255,255,.9);border-radius:20px;padding:14px;font-size:16px;line-height:1.45;cursor:pointer;color:#1c2b33;transition:transform .45s,opacity .45s,background .25s,border-color .25s,box-shadow .25s;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,110,150,.1);animation:optin .45s ease both}
@keyframes optin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.opt:active{transform:scale(.98)}
.opt .letter{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b6e3f;font-size:14px;box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(90,110,150,.15)}
.opt.correct{background:linear-gradient(135deg,#d9f7e3,#b8f0cd);border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25),0 12px 26px rgba(34,197,94,.3);animation:win .55s ease}
.opt.correct .letter{background:#22c55e;color:#fff}
.opt.wrong{background:linear-gradient(135deg,#fdecea,#fadbd8);border-color:#ef4444;animation:shake .35s ease}
.opt.wrong .letter{background:#ef4444;color:#fff}
.opt.dim{opacity:.35}
.opt.gone{opacity:0;transform:scale(.82) translateY(12px);pointer-events:none}
@keyframes win{0%{transform:scale(1)}35%{transform:scale(1.05)}60%{transform:scale(1.02)}100%{transform:scale(1.03)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mark{margin-left:auto;font-size:19px;font-weight:800}
.correct .mark{color:#16a34a}.wrong .mark{color:#dc2626}
.why{margin-top:16px;background:rgba(255,248,220,.8);border:1px solid rgba(220,190,90,.5);border-radius:18px;padding:14px;display:none}
.why.show{display:block;animation:pagein .35s ease}
.why b{color:#7a5c00;font-size:14px}
.why p{margin-top:6px;font-size:15px;line-height:1.6;color:#4a3f10}
.next{width:100%;margin-top:16px;padding:15px;border:none;border-radius:999px;background:linear-gradient(120deg,#0e9a5c,#14684c);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:none;box-shadow:0 10px 24px rgba(20,104,76,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.next.show{display:block}
.result{margin:22px 16px;padding:30px 22px;text-align:center;position:relative;z-index:2;animation:pagein .45s ease}
.result h2{font-family:Georgia,serif;font-weight:400;font-size:25px;margin-top:8px;line-height:1.35;color:#16242c}
.result .pct{font-size:46px;font-weight:800;margin-top:12px;background:linear-gradient(120deg,#0e9a5c,#14684c,#2f9e6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.result p{color:#66788a;line-height:1.65;margin-top:9px;font-size:15px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.grad{background:linear-gradient(120deg,#0e9a5c,#14684c);color:#fff;box-shadow:0 10px 24px rgba(20,104,76,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.plain{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.45));color:#3c5566;border:1px solid rgba(255,255,255,.85)}

/* ---------- TA SERIES Burgundy & Navy ---------- */
#app{color:#16213e;background:#eef1fa}
.plus{color:rgba(122,10,40,.14)}
.glass{background:#fff;border:1px solid #e6e9f5;border-radius:20px;box-shadow:0 8px 24px rgba(22,33,62,.08)}
.topbar2{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#8a002a,#54001e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.brand{font-size:20px;font-weight:900;color:#16213e;letter-spacing:.02em}
.brand-pill{margin-left:auto;background:#7a0a28;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:6px 10px;border-radius:999px}
.hero-badge{display:inline-block;background:#fff;border:1px solid #e6e9f5;color:#7a0a28;font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(22,33,62,.06)}
.hero-h{font-size:46px;line-height:1.02;font-weight:900;margin:14px 0 10px}
.hero-h .b{color:#7a0a28}
.hero-h .n{color:#16213e}
.hero p{color:#5b6478;font-size:15px;line-height:1.55}
.hero-btns{display:flex;gap:10px;margin-top:16px}
.hero-btns .b-cta{flex:1;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,#8a002a,#54001e);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(122,10,40,.35)}
.hero-btns .b-cta:active{transform:translateY(2px)}
.hero-btns .b-ghost{flex:1;padding:14px;border:1.5px solid #d9deef;background:#fff;color:#16213e;font-size:15px;font-weight:800;border-radius:999px;cursor:pointer}
.stats{display:flex;background:#fff;border:1px solid #e6e9f5;border-radius:18px;box-shadow:0 4px 14px rgba(22,33,62,.06);margin:18px 0 6px;padding:14px 6px}
.stat2{flex:1;text-align:center}
.stat2 b{display:block;font-size:22px;color:#16213e}
.stat2 span{font-size:11px;color:#5b6478;font-weight:700}
.stat2 + .stat2{border-left:1px solid #e6e9f5}

<script>
const DATA = {"book": "Nursing Ethics - TA SERIES", "total": 370, "chapters": [{"n": 1, "title": "Introduction to Nursing Ethics", "count": 24}, {"n": 2, "title": "Value Set", "count": 50}, {"n": 3, "title": "Ethical Principles and Theories", "count": 87}, {"n": 4, "title": "Confidentiality and Informed Consent", "count": 43}, {"n": 5, "title": "Bills of Rights", "count": 24}, {"n": 6, "title": "Code of Ethics", "count": 28}, {"n": 7, "title": "Professional Autonomy and Ethics", "count": 34}, {"n": 8, "title": "Ethical Dilemma in Professional Practice", "count": 55}, {"n": 9, "title": "International Health and Nursing Organizations", "count": 25}], "questions": [{"chapter": 1, "n": 1, "tag": "2017 · Q8", "q": "Nursing Ethics means which of the following?", "options": ["Study of ethical issues involved in nursing practice", "Study of moral aspect of nurses life", "Study of legal aspect of nurses life", "None of the above"], "answer": 0, "rationale": "Nursing ethics is defined as the study of ethical issues arising in nursing practice.", "diff": 3}, {"chapter": 1, "n": 2, "tag": "2017 · Q10", "q": "Ethics are code of principles and values that guide the action of people. These actions relate to issues that are in the domain of which of the following?", "options": ["Free choice", "Social standards", "Law", "Legal/ moral Right"], "answer": 3, "rationale": "Ethical questions concern what people ought to do, and that obligation is expressed through legal and moral rights and duties.", "diff": 3}, {"chapter": 1, "n": 3, "tag": "2017 · Q18", "q": "The personal conviction that something is absolutely right or wrong in all situations is called:", "options": ["Values", "Morals", "Ethics", "Standards of practice"], "answer": 1, "rationale": "A fixed personal conviction of absolute right/wrong is a moral, not a value or ethic.", "diff": 1}, {"chapter": 1, "n": 4, "tag": "2017 · Q21", "q": "Which of the following is a definition of morality?", "options": ["What is considered as correct within a society", "Making the right decision's where there is a chance to do wrong", "Defining what is right and wrong for an individual or a community", "None"], "answer": 2, "rationale": "Morality defines what is right and wrong for an individual or a community.", "diff": 1}, {"chapter": 1, "n": 5, "tag": "2018 · Q1", "q": "When does a moral issue become an ethical issue?", "options": ["When the choices are clearly denoting which is right and wrong.", "When values of a person develops and changes over time.", "When there is no acceptable reason for the wrong choice once it is done.", "When the choice is no longer clear between rights and wrong."], "answer": 3, "rationale": "A moral issue becomes an ethical issue/dilemma once the right-versus-wrong choice is no longer clear-cut.", "diff": 3}, {"chapter": 1, "n": 6, "tag": "2018 · Q10", "q": "Nursing ethics provides the standards for professional behavior and is the study of principles of right and wrong for nurses. This set of standards states the duties and obligations of nurses to:", "options": ["Client", "Other health professionals", "Community", "All of these"], "answer": 3, "rationale": "Nursing ethics defines duties owed to clients, colleagues and the community alike.", "diff": 4}, {"chapter": 1, "n": 7, "tag": "2018 · Q11", "q": "The one that promotes the philosophical and theological study of morality, moral judgments and moral problems is called:", "options": ["Value", "Morals", "Ethics", "Standards of practice"], "answer": 2, "rationale": "Ethics is the philosophical study of morality, moral judgements and moral problems, whereas morals are the beliefs and standards people actually live by.", "diff": 4}, {"chapter": 1, "n": 8, "tag": "2018 · Q14", "q": "The personal conviction that something is absolutely right or wrong in all situations is called:", "options": ["Values", "Morals", "Ethics", "Standards of practice"], "answer": 1, "rationale": "A fixed personal conviction of absolute right/wrong is a moral.", "diff": 1}, {"chapter": 1, "n": 9, "tag": "2018 · Q56", "q": "A term that is sometimes used interchangeably with health care ethics is:", "options": ["Social ethics", "Bioethics", "Normative Ethics", "Descriptive Ethics"], "answer": 1, "rationale": "Bioethics is the term commonly used interchangeably with health care ethics.", "diff": 3}, {"chapter": 1, "n": 10, "tag": "2022 · Q11", "q": "All of the statement are true Except:", "options": ["Ethical dilemmas arise when it is thought that serious good and bad are bound together in the same activity", "Ethics uses the instrument of coercion to oblige its subjects", "Ethical behavior is dependent on the conditions and circumstances under which an action/event takes place", "Codes of Conduct form a part of ethical training"], "answer": 1, "rationale": "Ethics relies on internalized values, not coercion, so this is the false statement.", "diff": 1}, {"chapter": 1, "n": 11, "tag": "2022 · Q13", "q": "The word 'Ethics' comes from:", "options": ["Ethos", "Eternity", "Elementary", "Essentiality"], "answer": 0, "rationale": "'Ethics' derives from the Greek word 'ethos', meaning character or custom.", "diff": 2}, {"chapter": 1, "n": 12, "tag": "2022 · Q15", "q": "An occupation which requires specific knowledge, training and skills:", "options": ["Occupation", "Profession", "Socialism", "Politician"], "answer": 1, "rationale": "An occupation requiring specific knowledge, training and skills is defined as a profession.", "diff": 1}, {"chapter": 1, "n": 13, "tag": "2022 · Q37", "q": "Which of the following are prominent examples of 'ethical issues' that fall under the domain of 'applied ethics'?", "options": ["Euthanasia", "Protection of human and animal subjects in research", "Affirmative action", "All of above"], "answer": 3, "rationale": "Euthanasia, research-subject protection, and affirmative action are all classic applied-ethics issues.", "diff": 4}, {"chapter": 1, "n": 14, "tag": "2024 · Q2", "q": "The philosophical and theological study of morality, moral judgments, and moral problems is called:", "options": ["Value", "Morals", "Ethics", "Standards of practice"], "answer": 2, "rationale": "Ethics is the philosophical/theological study of morality and moral problems.", "diff": 4}, {"chapter": 1, "n": 15, "tag": "2024 · Q3", "q": "Ethics is a set of ..... that govern the behaviors of individuals or organizations.", "options": ["Principles", "Standards", "Principles and standards", "Rules"], "answer": 2, "rationale": "Ethics is defined as a combined set of principles and standards governing behavior.", "diff": 1}, {"chapter": 1, "n": 16, "tag": "2024 · Q27", "q": "An occupation requiring specific knowledge, training, and skills is called:", "options": ["Autonomy", "Profession", "Professional obligation", "Patience"], "answer": 1, "rationale": "An occupation requiring specific knowledge, training and skills is a profession.", "diff": 4}, {"chapter": 1, "n": 17, "tag": "2024 · Q58", "q": "Ethics is a set of _______ governing the behavior of individuals or organizations.", "options": ["Principles", "Standards", "Principles and Standards", "Rules"], "answer": 2, "rationale": "Ethics is defined as a combined set of principles and standards.", "diff": 1}, {"chapter": 1, "n": 18, "tag": "2024-Malakand · Q2", "q": "A nurse believes that abortion is an acceptable option if a pregnancy results from a situation of rape. What is the best description of this belief?", "options": ["Ethics", "Personal morality", "Legal obligations", "Professional values"], "answer": 1, "rationale": "A private conviction about right and wrong held by an individual is personal morality.", "diff": 1}, {"chapter": 1, "n": 19, "tag": "2024-Malakand · Q50", "q": "Essentially, ethics stems from:", "options": ["autonomy", "morality", "self-regard", "b and"], "answer": 1, "rationale": "Ethics is rooted in morality.", "diff": 3}, {"chapter": 1, "n": 20, "tag": "2024-Malakand · Q57", "q": "___ are similar to ethics and many people use the two words interchangeably (closely associated with the concept of ethics)", "options": ["Ethical principles", "Autonomy", "Morals", "Beneficence"], "answer": 2, "rationale": "Morals is the term most often used interchangeably with ethics.", "diff": 4}, {"chapter": 1, "n": 21, "tag": "2024-Malakand · Q60", "q": "A ___ is a member of a profession or any person who earns a living from a specified professional activity.", "options": ["Professional", "Doctor", "Nurse", "LHV"], "answer": 0, "rationale": "A member of a profession who earns a living from it is a professional.", "diff": 2}, {"chapter": 1, "n": 22, "tag": "2025 · Q25", "q": "A profession requires training and a code of ethics. A job may not. The main difference is:", "options": ["Location", "Salary", "Regulation", "Timing"], "answer": 2, "rationale": "Professions are regulated (licensing, standards and a code of ethics); a job is not necessarily.", "diff": 4}, {"chapter": 1, "n": 23, "tag": "2025 · Q44", "q": "Bioethics helps solve problems in:", "options": ["Travel", "Healthcare", "Construction", "Business"], "answer": 1, "rationale": "Bioethics deals with ethical issues in healthcare and the life sciences.", "diff": 2}, {"chapter": 1, "n": 24, "tag": "2025 · Q62", "q": "Nurse Seema explains her profession to a new student. Ethics mainly studies:", "options": ["Conduct", "Finance", "Equipment", "Medicines"], "answer": 0, "rationale": "Ethics is the study of moral conduct: what is right and wrong behavior.", "diff": 3}, {"chapter": 2, "n": 1, "tag": "2017 · Q1", "q": "Which one is deeply rooted in human being?", "options": ["Value", "Belief", "Attitude", "Behavior"], "answer": 0, "rationale": "Values are the core convictions that underlie beliefs and behaviour, so they are the most deeply rooted guide to how a person lives.", "diff": 3}, {"chapter": 2, "n": 2, "tag": "2017 · Q2", "q": "A nurse is a member of a team which decides euthanasia for a patient while it opposes the value of the nurse. It creates which of them?", "options": ["Value clarification", "Value conflict", "Belief", "Empathy"], "answer": 1, "rationale": "Team decision clashing with the nurse's own value is a value conflict.", "diff": 1}, {"chapter": 2, "n": 3, "tag": "2017 · Q3", "q": "Caring a patient, a nurse shows professional value when doing/giving which of the following?", "options": ["Advocacy", "Teaching", "Respect", "Medication"], "answer": 2, "rationale": "Respect for the patient is a core professional nursing value, shown in how care is given.", "diff": 2}, {"chapter": 2, "n": 4, "tag": "2017 · Q4", "q": "Identify classification of value.", "options": ["Intrinsic Value and Extrinsic Value", "Positive Value and Negative Value", "Both a &", "None of the above"], "answer": 0, "rationale": "Values are classically split by worth (intrinsic/extrinsic); positive/negative is not the standard classification asked here.", "diff": 1}, {"chapter": 2, "n": 5, "tag": "2017 · Q5", "q": "How many steps should be considered to clarify values?", "options": ["Six", "Seven", "Ten", "Fourteen"], "answer": 1, "rationale": "Values clarification is commonly taught as a seven-step process (choosing, prizing, acting).", "diff": 3}, {"chapter": 2, "n": 6, "tag": "2017 · Q6", "q": "Before tea break a student finds 100 rupees in the classroom. Which of the following action should a student do?", "options": ["Quickly pick up the 100 rupees before anyone else comes in and sees it.", "Use it to buy your snacks for the day.", "Return it into the administration office.", "Go into the classroom and ask if anyone has lost 100 rupees"], "answer": 2, "rationale": "Money found with no identifiable owner should be handed to the administration office, where it can be claimed by its owner through the proper lost-property route.", "diff": 2}, {"chapter": 2, "n": 7, "tag": "2017 · Q7", "q": "If you found a wallet with 1000 rupees in it and the owner's name and address, which of following action would you do?", "options": ["Keep it with you", "Get it to the owner", "Arrange party for friends", "Other"], "answer": 1, "rationale": "Returning found property to its identified owner is the honest, ethical action.", "diff": 3}, {"chapter": 2, "n": 8, "tag": "2017 · Q11", "q": "Which of the following is NOT true of values?", "options": ["Every body has them.", "They have little or no impact on behaviour.", "They always have a behavioural impact.", "The worth of a person, object, idea or action."], "answer": 1, "rationale": "Everybody holds values, and values guide behaviour, so the claim that they have little or no impact on behaviour is the false statement.", "diff": 3}, {"chapter": 2, "n": 9, "tag": "2017 · Q19", "q": "The principles or standards that influence behavior and decision making which are based on experience, religion, education and culture is called:", "options": ["Values", "Morals", "Ethics", "Standards of practice"], "answer": 0, "rationale": "Values are shaped by experience, religion, education and culture and guide behavior/decisions.", "diff": 4}, {"chapter": 2, "n": 10, "tag": "2017 · Q25", "q": "Values clarification means which of the following?", "options": ["A process by which people identify and express their values.", "A process by which people identify but do not express their values.", "A process by which people do not identify their values.", "Both b and"], "answer": 0, "rationale": "Values clarification is the process of identifying AND expressing one's own values.", "diff": 4}, {"chapter": 2, "n": 11, "tag": "2018 · Q2", "q": "The principles or standards that influence behavior and decision making which are based on experience, religion, education and culture is called:", "options": ["Value", "Morals", "Ethics", "Standards of practice"], "answer": 0, "rationale": "Values are shaped by experience, religion, education and culture and guide behavior/decisions.", "diff": 4}, {"chapter": 2, "n": 12, "tag": "2018 · Q31", "q": "Mr. Gul Khan, 90 years old, gives directions to his son not to take any measure to prolong his life, as he believes it is useless when it seems to be at its end. This is an example of:", "options": ["Choosing a value", "Prizing a value", "Affirming a value", "Reflecting a value"], "answer": 1, "rationale": "Cherishing and being willing to publicly stand by a belief about end-of-life care is 'prizing' the value.", "diff": 2}, {"chapter": 2, "n": 13, "tag": "2018 · Q32", "q": "Values clarification promotes your personal growth by fostering your:", "options": ["Awareness", "Empathy", "Insight", "All of them"], "answer": 3, "rationale": "Values clarification builds self-awareness, empathy and insight together.", "diff": 1}, {"chapter": 2, "n": 14, "tag": "2018 · Q40", "q": "The values which are related to human relationships are called:", "options": ["Economical values", "Political values", "Aesthetic values", "Social values"], "answer": 3, "rationale": "Values concerning human relationships are classified as social values.", "diff": 3}, {"chapter": 2, "n": 15, "tag": "2018 · Q49", "q": "Values are acquired through which of the following?", "options": ["Experience", "Institutions", "Interactions", "All of them"], "answer": 3, "rationale": "Values are formed through a mix of experience, institutions and interactions.", "diff": 4}, {"chapter": 2, "n": 16, "tag": "2018 · Q51", "q": "Preferring the welfare of others over your own is associated with:", "options": ["Altruism", "Sympathy", "Empathy", "Apathy"], "answer": 0, "rationale": "Putting others' welfare ahead of one's own is altruism.", "diff": 2}, {"chapter": 2, "n": 17, "tag": "2018 · Q52", "q": "A health care member demonstrates the attitude of empathy and respects self and others. This is referred to as:", "options": ["Apathy", "Dignity", "Sanity", "Insanity"], "answer": 1, "rationale": "Respecting self and others while showing empathy reflects dignity.", "diff": 3}, {"chapter": 2, "n": 18, "tag": "2018 · Q55", "q": "A nurse's own motivation to care for others is usually generated by:", "options": ["Quality nurse instructors", "Patient's feedback", "Moral perspective", "Mentor in the workplace"], "answer": 2, "rationale": "Intrinsic motivation to care for others is generally rooted in one's own moral perspective.", "diff": 3}, {"chapter": 2, "n": 19, "tag": "2018 · Q57", "q": "Self-Awareness involves the determination to be conscious of our:", "options": ["Thoughts", "Feelings", "Emotional responses", "All of them"], "answer": 3, "rationale": "Self-awareness spans thoughts, feelings and emotional responses together.", "diff": 2}, {"chapter": 2, "n": 20, "tag": "2018 · Q60", "q": "A special class of attitudes in which the cognitive component is based more on faith than on fact is:", "options": ["Culture", "Value", "Belief", "None of the above"], "answer": 2, "rationale": "An attitude grounded in faith rather than fact is, by definition, a belief.", "diff": 3}, {"chapter": 2, "n": 21, "tag": "2018 · Q62", "q": "It is the habit of a nurse that she tends to keep the patient's environment neat and clean. Which of the following does it show?", "options": ["Social value", "Aesthetic value", "Economical value", "Political value"], "answer": 1, "rationale": "Keeping the environment neat and clean reflects an aesthetic value.", "diff": 1}, {"chapter": 2, "n": 22, "tag": "2022 · Q36", "q": "Which of the following statements are true about 'Morale' Except:", "options": ["It is a form of 'attitude'", "It is reflected in positive feelings about the work group", "It instills confidence that difficult goals can be achieved easily", "It is the knowledge of the distinction between right and wrong action"], "answer": 3, "rationale": "Morale is a state of mind and attitude, reflected in positive feelings about the work group and in confidence about achieving difficult goals, while knowledge of the distinction between right and wrong action is morality, not morale.", "diff": 2}, {"chapter": 2, "n": 23, "tag": "2024 · Q5", "q": "A nurse ensures that the patient's environment is neat and clean. Which of the following does this action reflect?", "options": ["Social value", "Aesthetic value", "Environmental value", "Health benefit value"], "answer": 1, "rationale": "Keeping the environment neat and clean reflects an aesthetic value.", "diff": 1}, {"chapter": 2, "n": 24, "tag": "2024 · Q7", "q": "The act of verbally instilling a value system in a child by parents is called:", "options": ["Modeling", "Moralizing", "Laissez-faire", "Reward and punishment"], "answer": 1, "rationale": "Verbally instilling values in a child is called moralizing.", "diff": 1}, {"chapter": 2, "n": 25, "tag": "2024 · Q21", "q": "Mental struggle resulting from incompatible or opposing needs is called:", "options": ["Dilemma", "Conflict", "Ethical dilemma", "Assault"], "answer": 1, "rationale": "Mental struggle from opposing needs is termed a conflict (not yet an ethical dilemma).", "diff": 1}, {"chapter": 2, "n": 26, "tag": "2024 · Q29", "q": "The process by which individuals identify, examine, and develop their own values is called:", "options": ["Value clarification", "Value set", "Aesthetic", "Value"], "answer": 0, "rationale": "Identifying, examining and developing one's own values is value clarification.", "diff": 4}, {"chapter": 2, "n": 27, "tag": "2024 · Q30", "q": "Mental struggle due to incompatible or opposing needs is called:", "options": ["Dilemma", "Conflict", "Ethical dilemma", "Assault"], "answer": 1, "rationale": "Mental struggle from opposing needs is termed a conflict.", "diff": 3}, {"chapter": 2, "n": 28, "tag": "2024 · Q32", "q": "Individualized values derived from society are known as:", "options": ["Personal values", "Professional values", "Social values", "Negative values"], "answer": 0, "rationale": "Individualized values a person derives from society are personal values.", "diff": 3}, {"chapter": 2, "n": 29, "tag": "2024 · Q35", "q": "Lily's flower roots are dropped in the ponds. We compare their roots with:", "options": ["Values", "Beliefs", "Attitudes", "Dilemma"], "answer": 1, "rationale": "Deep, anchoring roots are used as a metaphor for beliefs, the deepest-held convictions.", "diff": 3}, {"chapter": 2, "n": 30, "tag": "2024 · Q61", "q": "What does a nurse practice when they refrain from making hasty or biased decisions?", "options": ["Being Nonjudgmental", "Being Neutral", "Being Practical", "Being Professional"], "answer": 0, "rationale": "Refraining from hasty or biased decisions is the practice of being nonjudgmental.", "diff": 1}, {"chapter": 2, "n": 31, "tag": "2024-Malakand · Q1", "q": "___ values reflect how the individual or the organization relates to society.", "options": ["Collective value", "Individual values", "Relationship values", "Societal values"], "answer": 3, "rationale": "Values describing how a person or organization relates to the wider society are societal values.", "diff": 3}, {"chapter": 2, "n": 32, "tag": "2024-Malakand · Q11", "q": "Integration and fulfillment of man's basic impulses and desires in a stable and consistent manner appropriate for his living. The statement is about:", "options": ["Value significance", "Professional values", "Value conflict", "Conflict resolution"], "answer": 0, "rationale": "The statement describes the significance of values, which unify a person's drives into a consistent way of living.", "diff": 2}, {"chapter": 2, "n": 33, "tag": "2024-Malakand · Q18", "q": "Self-Awareness involves the determination to be conscious of our:", "options": ["thoughts", "feelings", "physical and emotional responses", "All of these"], "answer": 3, "rationale": "Self-awareness covers thoughts, feelings and physical and emotional responses together.", "diff": 2}, {"chapter": 2, "n": 34, "tag": "2024-Malakand · Q21", "q": "In professional values ___ concerns for welfare and well-being of others.", "options": ["Integrity", "Humanism", "Altruism", "Justice"], "answer": 2, "rationale": "Concern for the welfare and well-being of others is altruism.", "diff": 2}, {"chapter": 2, "n": 35, "tag": "2024-Malakand · Q28", "q": "___ is a process by which people identify, examine, and develop their own individual values.", "options": ["Value transformation", "Ethics", "Value clarification", "Morals"], "answer": 2, "rationale": "Identifying, examining and developing one's values is value clarification.", "diff": 3}, {"chapter": 2, "n": 36, "tag": "2024-Malakand · Q31", "q": "___ values are how you represent what you believe in when it comes to religion /spirituality.", "options": ["Material values", "Spiritual values", "Relationship values", "Ethical values"], "answer": 1, "rationale": "Values tied to religion and spirituality are spiritual values.", "diff": 2}, {"chapter": 2, "n": 37, "tag": "2024-Malakand · Q39", "q": "In the delivery of care, the nurse acts in accordance with nursing standards and the code of ethics and reports a medication error that she has made. The nurse is most clearly demonstrating which of the following professional values?", "options": ["Human dignity", "Integrity", "Altruism", "Nursing knowledge"], "answer": 1, "rationale": "Honestly reporting one's own error is integrity.", "diff": 4}, {"chapter": 2, "n": 38, "tag": "2024-Malakand · Q51", "q": "What is the term for the beliefs held by the individual about what matters?", "options": ["Bioethics", "Ethics", "Morals", "Values"], "answer": 3, "rationale": "Personal beliefs about what matters are values.", "diff": 4}, {"chapter": 2, "n": 39, "tag": "2024-Malakand · Q52", "q": "Values connected with the solidarity of the community or collective norms of equality, justice, solidarity and sociableness are known as ___.", "options": ["Collective value", "Individual values", "Relationship values", "Societal values"], "answer": 0, "rationale": "Values built on community solidarity and shared norms are collective values.", "diff": 1}, {"chapter": 2, "n": 40, "tag": "2024-Malakand · Q58", "q": "Which of the following strategies can most help you as a nurse to enhance your ethical practice and client advocacy?", "options": ["reading a book on religions of the world", "examining and clarifying your own value", "talking with peers about their beliefs and values", "buying a nursing book on ethical decisions"], "answer": 1, "rationale": "Examining and clarifying your own values is the strategy that builds ethical practice and advocacy.", "diff": 1}, {"chapter": 2, "n": 41, "tag": "2024-Malakand · Q70", "q": "These are the prevailing values of the society which change with time and either coincide or not with the family or personal values.", "options": ["Material values", "Spiritual values", "Personal values", "Social-cultural values"], "answer": 3, "rationale": "Prevailing societal values that shift over time are social-cultural values.", "diff": 1}, {"chapter": 2, "n": 42, "tag": "2025 · Q13", "q": "A nurse consistently respects patient dignity in all cases. This indicates:", "options": ["Policy", "True value", "Habit", "Fear"], "answer": 1, "rationale": "Consistent behavior across all situations shows a genuinely held personal and professional value.", "diff": 4}, {"chapter": 2, "n": 43, "tag": "2025 · Q21", "q": "A nurse reflects on her beliefs before making a decision in care. This is:", "options": ["Compliance", "Value clarification", "Avoidance", "Moralizing"], "answer": 1, "rationale": "Value clarification is reflecting on one's own beliefs and values so that they can be recognized in ethical decisions.", "diff": 1}, {"chapter": 2, "n": 44, "tag": "2025 · Q27", "q": "Nurse Samina feels uncomfortable giving end-of-life care due to personal beliefs. This situation shows:", "options": ["Skill gap", "Value conflict", "Policy issue", "Routine care"], "answer": 1, "rationale": "Her personal beliefs conflict with the care she is asked to give: a value conflict.", "diff": 4}, {"chapter": 2, "n": 45, "tag": "2025 · Q35", "q": "A nurse follows ethical code even under pressure. This reflects:", "options": ["Integrity", "Weakness", "Fear", "Habit"], "answer": 0, "rationale": "Acting on one's moral principles despite pressure is integrity.", "diff": 2}, {"chapter": 2, "n": 46, "tag": "2025 · Q40", "q": "Naveed watches his senior nurse calmly handle an angry relative. Later, Naveed does the same. This is:", "options": ["Modeling", "Punishment", "Forgetting", "Isolation"], "answer": 0, "rationale": "Learning by watching and imitating a respected role model is modeling.", "diff": 1}, {"chapter": 2, "n": 47, "tag": "2025 · Q50", "q": "A patient's family wants aggressive treatment, but the patient wants comfort care. This is a:", "options": ["Simple task", "Legal matter", "Value conflict", "Financial issue"], "answer": 2, "rationale": "The patient and family hold opposing values about treatment, a value conflict (the patient's wishes take priority).", "diff": 1}, {"chapter": 2, "n": 48, "tag": "2025 · Q57", "q": "A student learns ethics by watching a mentor handle a difficult case. This mode is:", "options": ["Lecture", "Punishment", "Isolation", "Role modeling"], "answer": 3, "rationale": "Learning ethical behavior by observing a mentor is role modeling.", "diff": 2}, {"chapter": 2, "n": 49, "tag": "2025 · Q60", "q": "A nurse must choose between personal belief and patient need. Best action:", "options": ["Delay care", "Avoid case", "Impose belief", "Respect patient"], "answer": 3, "rationale": "Professional ethics puts the patient's needs and wishes first; the nurse should not impose personal beliefs.", "diff": 1}, {"chapter": 2, "n": 50, "tag": "2025 · Q68", "q": "A nurse feels exhausted but still comforts a crying relative. This shows:", "options": ["Indifference", "Neglect", "Avoidance", "Compassion"], "answer": 3, "rationale": "Caring for another's suffering despite one's own fatigue is compassion.", "diff": 4}, {"chapter": 3, "n": 1, "tag": "2017 · Q9", "q": "A Nurse ASIMA avoids deliberate harm, risk of harm and harm that occurs during her performance of nursing actions. The nurse is promoting which ethical principle?", "options": ["Autonomy", "Nonmaleficence", "Beneficence", "Justice"], "answer": 1, "rationale": "Avoiding harm to the patient is the definition of nonmaleficence.", "diff": 1}, {"chapter": 3, "n": 2, "tag": "2017 · Q12", "q": "The concept of justice in ethics is which of the following?", "options": ["An obligation of the patient to the society", "The principle that deals with fairness, equity and equality", "Taken as patient to choose or refuse treatment", "The obligation to do not harm to the patient"], "answer": 1, "rationale": "Justice in ethics concerns fairness, equity, and equal treatment.", "diff": 2}, {"chapter": 3, "n": 3, "tag": "2017 · Q13", "q": "Autonomy means which of the following?", "options": ["The right to be selfish", "The right to make one's own decisions and choices.", "Self-awareness", "Self-promotion"], "answer": 1, "rationale": "Autonomy is the patient's right to make their own decisions and choices.", "diff": 3}, {"chapter": 3, "n": 4, "tag": "2017 · Q14", "q": "Which of the following defines the principle of ethics?", "options": ["Ethics are a function of moral rules and principles.", "All ethical decisions will have both positive and negative consequences", "It is essential that decisions be made for the greater good of society.", "None of the above"], "answer": 2, "rationale": "An ethical principle guides decisions toward the greatest good of society, which is the standard this definition uses.", "diff": 3}, {"chapter": 3, "n": 5, "tag": "2017 · Q15", "q": "Identify four basic ethical principles.", "options": ["Autonomy, beneficence, non maleficence, justice", "Autonomy, beneficence, fidelity, veracity", "Fidelity, justice, individuality, non maleficence", "Justice, non maleficence veracity, Autonomy"], "answer": 0, "rationale": "The four classic bioethical principles are autonomy, beneficence, nonmaleficence, and justice.", "diff": 1}, {"chapter": 3, "n": 6, "tag": "2017 · Q16", "q": "Providing equality of resources and opportunity for all people upholds the ethical principle of:", "options": ["Veracity", "Autonomy", "Beneficence", "Justice"], "answer": 3, "rationale": "Equal distribution of resources and opportunity is the principle of justice.", "diff": 1}, {"chapter": 3, "n": 7, "tag": "2017 · Q17", "q": "The right of both the consumer and provider to make choices and take action, provided that the results do not adversely affect others, is the ethical principle of:", "options": ["Autonomy", "Beneficence", "Justice", "Truth"], "answer": 0, "rationale": "Freedom to choose and act without harming others is the definition of autonomy.", "diff": 2}, {"chapter": 3, "n": 8, "tag": "2017 · Q23", "q": "Informed consent is an example of which of the following ethical principle?", "options": ["Autonomy", "Justice", "Beneficence", "Nonmalificence"], "answer": 0, "rationale": "Informed consent operationalizes the patient's autonomy.", "diff": 1}, {"chapter": 3, "n": 9, "tag": "2017 · Q32", "q": "Which of the following are the basic ethical obligations for health professionals?", "options": ["To extend life", "To lessen pain and suffering.", "Both a and", "Spend more money on prevention"], "answer": 2, "rationale": "Extending life and relieving pain and suffering are both basic obligations of health professionals.", "diff": 3}, {"chapter": 3, "n": 10, "tag": "2017 · Q33", "q": "Nonmaleficence refers to which of the following?", "options": ["The duty to do no harm.", "The duty to be patience.", "The duty to practice self-care", "The duty to be kind."], "answer": 0, "rationale": "Nonmaleficence literally means the duty to do no harm.", "diff": 1}, {"chapter": 3, "n": 11, "tag": "2017 · Q34", "q": "Which of the following is NOT an ethical principle?", "options": ["Autonomy", "Nonmaleficence", "Beneficence", "Apprehension"], "answer": 3, "rationale": "Apprehension is not one of the recognized bioethical principles.", "diff": 4}, {"chapter": 3, "n": 12, "tag": "2017 · Q35", "q": "Beneficence means which of the following?", "options": ["To act in the best interest of others", "To act in the best interest of own self", "None of the above", "All of the above"], "answer": 0, "rationale": "Beneficence is the duty to act in the best interest of others, doing good for the patient rather than for oneself.", "diff": 2}, {"chapter": 3, "n": 13, "tag": "2017 · Q50", "q": "A 65 year old man with respiratory failure requests no treatment and her physician orders a one week course of penicillin. This violates which ethical principle?", "options": ["Justice", "Autonomy", "Beneficence", "Non-maleficence"], "answer": 1, "rationale": "Overriding the patient's informed refusal of treatment violates autonomy.", "diff": 3}, {"chapter": 3, "n": 14, "tag": "2018 · Q5", "q": "The nurse in a unit is caring for several clients. To distribute nursing care the nurse utilized the principle of triage due to the limited availability of resources. The nurse is promoting which ethical principle?", "options": ["Fidelity", "Justice", "Veracity", "Confidentiality"], "answer": 1, "rationale": "Fair distribution of limited resources via triage reflects the principle of justice.", "diff": 3}, {"chapter": 3, "n": 15, "tag": "2018 · Q7", "q": "Nurse Janine avoids deliberate harm, risk of harm and harm that occurs during her performance of nursing actions. The nurse is promoting which ethical principle?", "options": ["Autonomy", "Non-maleficence", "Beneficence", "Justice"], "answer": 1, "rationale": "Avoiding harm to the patient defines nonmaleficence.", "diff": 2}, {"chapter": 3, "n": 16, "tag": "2018 · Q8", "q": "The client on renal dialysis informs the nurse that he wants to stop the series of dialysis. The nurse should appropriately do which action in response to the client's decision?", "options": ["Inform the client that the doctor must decide what to do", "Tell the client that he must finish his series of renal dialysis", "Respect the client's decision and provide comfort measures", "Leave the client and attend other patients"], "answer": 2, "rationale": "A competent client's right to refuse treatment must be respected, with continued comfort care.", "diff": 2}, {"chapter": 3, "n": 17, "tag": "2018 · Q13", "q": "Informed consent is a method that promotes:", "options": ["Autonomy", "Non-maleficence", "Beneficence", "Justice"], "answer": 0, "rationale": "Informed consent operationalizes the patient's autonomy.", "diff": 4}, {"chapter": 3, "n": 18, "tag": "2018 · Q19", "q": "Principle requires loyalty, fairness, truthfulness, advocacy, and dedication to our patients are called______.", "options": ["Beneficence", "Justice", "Fidelity", "Paternalism"], "answer": 2, "rationale": "Loyalty and faithful dedication to patients is the principle of fidelity.", "diff": 2}, {"chapter": 3, "n": 19, "tag": "2018 · Q20", "q": "Ethical theories states that people should adhere to their obligations and duties when engaged in decision making when ethics are in play.", "options": ["Deontology theory", "Utilitarianism theory", "rights theory", "virtues theory"], "answer": 0, "rationale": "Duty- and obligation-based decision-making defines deontology.", "diff": 1}, {"chapter": 3, "n": 20, "tag": "2018 · Q21", "q": "The theory believes that variances in culture and society influence whether an act is moral, and that what is morally right or wrong varies from person to person or society to society.", "options": ["rights theory", "Ethical Relativism", "Deontology theory", "Utilitarianism theory e. virtues theory"], "answer": 1, "rationale": "Morality varying by culture/society with no absolute truths is the definition of ethical relativism.", "diff": 3}, {"chapter": 3, "n": 21, "tag": "2018 · Q22", "q": "The ethical theory that judges a person by his/her character rather than by an action that may deviate from his/her normal behavior.", "options": ["rights theory", "Deontology theory", "Utilitarianism theory", "virtues theory"], "answer": 3, "rationale": "Judging by character rather than a single act is the hallmark of virtue theory.", "diff": 3}, {"chapter": 3, "n": 22, "tag": "2018 · Q23", "q": "Which of the following theory focuses on the nature of acting person?", "options": ["Deontology", "Utilitarianism", "Virtue ethics", "Consequentialism"], "answer": 2, "rationale": "Virtue ethics centers on the character/nature of the person acting, not just the act or its consequences.", "diff": 4}, {"chapter": 3, "n": 23, "tag": "2018 · Q24", "q": "________ guide to ethical decision-making (Davis 1999).", "options": ["Five steps", "Six steps", "Seven steps", "Eight steps"], "answer": 2, "rationale": "Davis's (1999) model is a seven-step guide to ethical decision-making.", "diff": 4}, {"chapter": 3, "n": 24, "tag": "2018 · Q30", "q": "Utilitarianism is an example of a _________ moral theory.", "options": ["supervenient", "deontological", "reductionist", "consequentialist"], "answer": 3, "rationale": "Utilitarianism judges actions by their consequences, making it a consequentialist theory.", "diff": 1}, {"chapter": 3, "n": 25, "tag": "2018 · Q34", "q": "The nurse tells a patient that this injection 'will not hurt at all' while aware that the injection is painful. Which ethical principle does the nurse clearly violate?", "options": ["Autonomy", "Beneficence", "Justice", "Veracity"], "answer": 3, "rationale": "Telling a patient something untrue about a painful procedure violates veracity (truthfulness).", "diff": 4}, {"chapter": 3, "n": 26, "tag": "2018 · Q35", "q": "An attempt to immunize a child against T.B. is based on the ethical principle of:", "options": ["Beneficence", "Non-maleficence", "Autonomy", "Fidelity"], "answer": 0, "rationale": "Immunizing to protect health is an act of beneficence, doing good for the child.", "diff": 3}, {"chapter": 3, "n": 27, "tag": "2018 · Q36", "q": "Giving placebo to a patient justifies which of the following ethical principles?", "options": ["Fidelity", "Beneficence", "Non-maleficence", "Autonomy"], "answer": 1, "rationale": "Supporters justify giving a placebo by beneficence, because the inert treatment is given with the aim of benefiting the patient and relieving suffering without the risks of an active drug.", "diff": 2}, {"chapter": 3, "n": 28, "tag": "2018 · Q38", "q": "A health care provider decides what is best for the patient, regardless of patient's choice. This is referred to as:", "options": ["Morality", "Informed consent", "Paternalism", "Non-maleficence"], "answer": 2, "rationale": "Overriding patient choice 'for their own good' is the definition of paternalism.", "diff": 4}, {"chapter": 3, "n": 29, "tag": "2018 · Q39", "q": "Distributing resources according to the need of patients is referred to as:", "options": ["Equality", "Equity", "Parity", "Fairness"], "answer": 1, "rationale": "Distributing according to need (not equal shares) is equity.", "diff": 1}, {"chapter": 3, "n": 30, "tag": "2018 · Q41", "q": "The requirement of consent reflects which of the ethical principles?", "options": ["Autonomy", "Veracity", "Fidelity", "Confidentiality"], "answer": 0, "rationale": "Requiring consent before treatment is a direct expression of respect for autonomy.", "diff": 3}, {"chapter": 3, "n": 31, "tag": "2018 · Q45", "q": "A health care member knows that a contaminated syringe should not be used, to avoid:", "options": ["Non-maleficence", "Beneficence", "Fidelity", "Veracity"], "answer": 0, "rationale": "Refusing to use a contaminated syringe prevents harm to the patient, which is the duty of non-maleficence.", "diff": 2}, {"chapter": 3, "n": 32, "tag": "2018 · Q53", "q": "A nurse feels the prescribed dose of medicine exceeds the normal dose and verifies it with the concerned physician. This concern shows which principle of ethics?", "options": ["Beneficence", "Non-maleficence", "Confidentiality", "Veracity"], "answer": 1, "rationale": "Double-checking a suspicious dose to prevent harm reflects nonmaleficence.", "diff": 4}, {"chapter": 3, "n": 33, "tag": "2018 · Q59", "q": "Fidelity is a principle pertaining specifically to the concept of:", "options": ["Charity", "Faithfulness", "Benevolence", "a and"], "answer": 1, "rationale": "Fidelity is specifically about faithfulness/keeping one's commitments.", "diff": 1}, {"chapter": 3, "n": 34, "tag": "2018 · Q61", "q": "The following are the cardinal principles of health care ethics except:", "options": ["Beneficence", "Maleficence", "Veracity", "Confidentiality"], "answer": 1, "rationale": "Maleficence (causing harm) is the opposite of a cardinal ethical principle, not one itself.", "diff": 2}, {"chapter": 3, "n": 35, "tag": "2018 · Q63", "q": "A health care provider promises to wake a patient for prayer per the patient's wish but fails to do so. What did she violate?", "options": ["Confidentiality", "Veracity", "Fidelity", "Autonomy"], "answer": 2, "rationale": "Failing to keep a promise made to the patient is a breach of fidelity.", "diff": 2}, {"chapter": 3, "n": 36, "tag": "2022 · Q10", "q": "Which among the following are principle concerns with 'professional ethics'?", "options": ["To study ethical dilemmas in professions by application of moral theory", "The study of unique moral obligations created by special social roles", "The practice and consultancy of ethics by a trained professional ethicist", "A & B"], "answer": 3, "rationale": "Professional ethics concerns both applying moral theory to dilemmas and the unique obligations of a professional role.", "diff": 1}, {"chapter": 3, "n": 37, "tag": "2022 · Q19", "q": "The principle of autonomy, broken down into 'autos' (self) and 'nomos' (rule), views:", "options": ["the rights of an individual to self-determination", "the rights of an individual to self-judgment", "the rights of an individual to self-accuracy", "the rights of an individual to self-blessing"], "answer": 0, "rationale": "'Autos' (self) + 'nomos' (rule/law) literally means self-determination/self-governance.", "diff": 2}, {"chapter": 3, "n": 38, "tag": "2024 · Q1", "q": "Falsehood, an act or statement that misleads, hides the truth, or promotes a belief, concept, or idea that is not true, is called:", "options": ["Lying", "Veracity", "Truth", "Deception"], "answer": 3, "rationale": "An act that misleads or hides the truth is defined as deception.", "diff": 4}, {"chapter": 3, "n": 39, "tag": "2024 · Q8", "q": "A nurse performs CPR on a choking patient, resulting in a sternum fracture that leads to the patient's death. Which ethical theory supports that the nurse's actions were inherently good due to intent, regardless of the outcome?", "options": ["Virtue theory", "Rights theory", "Utilitarianism theory", "Deontology theory"], "answer": 3, "rationale": "Judging the act as good based on the nurse's intent, regardless of outcome, is a deontological view.", "diff": 4}, {"chapter": 3, "n": 40, "tag": "2024 · Q9", "q": "A nurse performs a pain assessment and requests an analgesic for the patient. Which ethical principle is being applied?", "options": ["Autonomy", "Beneficence", "Veracity", "Non-maleficence"], "answer": 1, "rationale": "Acting to relieve the patient's pain is an act of beneficence.", "diff": 2}, {"chapter": 3, "n": 41, "tag": "2024 · Q10", "q": "A patient asks a nurse to explain laboratory results. The nurse assists another patient in the bathroom first and then returns to explain the results. Which moral principle does this action demonstrate?", "options": ["Non-maleficence", "Autonomy", "Beneficence", "Fidelity"], "answer": 3, "rationale": "Keeping the commitment to return and explain the results demonstrates fidelity.", "diff": 3}, {"chapter": 3, "n": 42, "tag": "2024 · Q11", "q": "A nurse mistakenly administers the wrong blood unit, causing an anaphylactic reaction. During resuscitation, the nurse does not disclose the mistake. Which moral principle was violated?", "options": ["Human dignity", "Veracity", "Autonomy", "Fidelity"], "answer": 1, "rationale": "Concealing a mistake from the patient/team is a violation of veracity (truthfulness).", "diff": 1}, {"chapter": 3, "n": 43, "tag": "2024 · Q12", "q": "When resolving an ethical conflict involving a seriously ill newborn, the first step for the nurse is:", "options": ["Exploring reasonable courses of action", "Identifying people who can solve the difficulty", "Clarifying values related to the cause of the dilemma", "Collecting all available information about the situation"], "answer": 3, "rationale": "Ethical decision-making models begin with gathering all available information about the situation.", "diff": 4}, {"chapter": 3, "n": 44, "tag": "2024 · Q14", "q": "To make autonomous decisions, a patient must have:", "options": ["Freedom from internal and external influences", "A minor patient", "An unconscious patient", "A comatose patient"], "answer": 0, "rationale": "Autonomous decision-making requires freedom from internal and external coercion.", "diff": 3}, {"chapter": 3, "n": 45, "tag": "2024 · Q20", "q": "Nursing has many implications related to autonomy, including:", "options": ["Informed consent", "Advance directives", "End-of-life issues", "All of the above"], "answer": 3, "rationale": "Informed consent, advance directives, and end-of-life issues are all autonomy-related implications.", "diff": 1}, {"chapter": 3, "n": 46, "tag": "2024 · Q22", "q": "The principle that a person should be free from external pressure is called:", "options": ["Choose freely", "Autonomy", "Feel good about the choice", "List alternatives"], "answer": 1, "rationale": "Freedom from external pressure in decision-making is autonomy.", "diff": 2}, {"chapter": 3, "n": 47, "tag": "2024 · Q23", "q": "If a nurse collects data from a patient without obtaining consent, which ethical principle is violated?", "options": ["Beneficence and autonomy", "Human rights and maleficence", "Autonomy and human rights", "Beneficence and dignity"], "answer": 2, "rationale": "Collecting data without consent violates both the patient's autonomy and human rights.", "diff": 4}, {"chapter": 3, "n": 48, "tag": "2024 · Q28", "q": "When a nurse identifies a moral problem but is unsure of the ethical action, this is called:", "options": ["Moral distress", "Moral uncertainty", "Moral outrage", "All of the above"], "answer": 1, "rationale": "Identifying a moral problem but being unsure of the right action is moral uncertainty.", "diff": 1}, {"chapter": 3, "n": 49, "tag": "2024 · Q36", "q": "The distribution of nurses to the areas of 'most need' during a nursing shortage is an example of:", "options": ["Utilitarianism Theory", "Deontological Theory", "Justice", "Beneficence"], "answer": 2, "rationale": "Distributing scarce nursing resources by need is an application of the principle of justice.", "diff": 2}, {"chapter": 3, "n": 50, "tag": "2024 · Q43", "q": "A critically ill patient has a living will on record. The patient's condition worsens, but the spouse insists on 'everything being done' regardless of the patient's wishes. Which ethical principle is the spouse violating?", "options": ["Autonomy", "Beneficence", "Justice", "Nonmaleficence"], "answer": 0, "rationale": "Overriding a documented living will violates the patient's autonomy.", "diff": 2}, {"chapter": 3, "n": 51, "tag": "2024 · Q44", "q": "A nurse caring for a patient with neurological impairment uses subtle painful stimuli, such as nail bed pressure, rather than slapping or pinching. This exemplifies which ethical principle?", "options": ["Beneficence", "Fidelity", "Nonmaleficence", "Veracity"], "answer": 2, "rationale": "Choosing the least harmful method to elicit a response reflects nonmaleficence.", "diff": 2}, {"chapter": 3, "n": 52, "tag": "2024 · Q53", "q": "In ethical decision-making, identifying options and exploring the short-term and long-term consequences of each option falls under:", "options": ["Assessment", "Planning", "Diagnosis", "Evaluation"], "answer": 1, "rationale": "Weighing options and their consequences is the planning stage of ethical decision-making.", "diff": 3}, {"chapter": 3, "n": 53, "tag": "2024 · Q55", "q": "A nurse sees a patient quietly crying and approaches them, saying, 'Something seems to be troubling you.' This action demonstrates the ethical principle of:", "options": ["Beneficence", "Autonomy", "Veracity", "Nonmaleficence"], "answer": 0, "rationale": "Reaching out to help a distressed patient is an act of beneficence.", "diff": 4}, {"chapter": 3, "n": 54, "tag": "2024 · Q56", "q": "Which type of moral theory, when rigidly applied, would likely consider euthanasia morally wrong, even if it relieves a patient's pain and suffering?", "options": ["Relational ethics", "Naturalism", "Deontology", "Utilitarianism"], "answer": 2, "rationale": "Rigid deontology (rule/duty-based ethics) would forbid euthanasia regardless of outcome.", "diff": 1}, {"chapter": 3, "n": 55, "tag": "2024 · Q57", "q": "Nurses allocate their time across patients based on needs and care levels. Which ethical principle does this illustrate?", "options": ["Client Choice", "Fairness", "Honoring Dignity", "Respect for Life"], "answer": 1, "rationale": "Allocating time by patient need illustrates the principle of fairness.", "diff": 2}, {"chapter": 3, "n": 56, "tag": "2024 · Q60", "q": "Which deontological theory emphasizes duty and moral law as the basis for ethical decision-making?", "options": ["Utilitarianism", "Virtue Ethics", "Kantian Ethics", "Hedonism"], "answer": 2, "rationale": "Kantian ethics is the deontological theory built on duty and moral law.", "diff": 3}, {"chapter": 3, "n": 57, "tag": "2024 · Q66", "q": "Which of the following is NOT one of the five caring processes in Kristen M. Swanson's Theory of Caring?", "options": ["Maintaining Belief", "Knowing", "Providing Medication", "Enabling"], "answer": 2, "rationale": "Swanson's five caring processes are knowing, being with, doing for, enabling, and maintaining belief — 'providing medication' isn't one of them.", "diff": 2}, {"chapter": 3, "n": 58, "tag": "2024-Malakand · Q4", "q": "A patient shows signs of anxiety before treatment. What should the nurse prioritize?", "options": ["Reassurance", "Medication", "Enforcement", "Indifference"], "answer": 0, "rationale": "Calming the anxious patient through reassurance comes first and does no harm.", "diff": 3}, {"chapter": 3, "n": 59, "tag": "2024-Malakand · Q9", "q": "Following are the stages of conflict resolution except ___.", "options": ["Define the conflict", "Assess the cause", "Examine possible solutions", "Test the solution"], "answer": 1, "rationale": "In De Vito's conflict-resolution model the stages are defining the conflict, examining possible solutions, testing the solution and evaluating it, so testing the solution is a genuine stage and assessing the cause is not.", "diff": 2}, {"chapter": 3, "n": 60, "tag": "2024-Malakand · Q10", "q": "When a nurse identifies a moral problem but is unsure of the ethically correct actions, this is called:", "options": ["moral distress", "moral uncertainty", "moral outrage", "All of these"], "answer": 1, "rationale": "Recognising a moral problem without knowing the right action is moral uncertainty.", "diff": 1}, {"chapter": 3, "n": 61, "tag": "2024-Malakand · Q15", "q": "An ethical ___ model is a tool that can be used by health care providers to help develop the ability to think through an ethical dilemma and arrive at an ethical decision.", "options": ["Moral", "Paternalism", "Dilemma", "decision-making"], "answer": 3, "rationale": "The tool is an ethical decision-making model.", "diff": 4}, {"chapter": 3, "n": 62, "tag": "2024-Malakand · Q23", "q": "If you collect data from a patient had not been asked to give consent, which of the following principle would you have broken.", "options": ["Beneficence and autonomy", "Human right and maleficence", "Autonomy and human right", "Beneficence and dignity"], "answer": 2, "rationale": "Collecting data without consent breaches the patient's autonomy and human rights.", "diff": 1}, {"chapter": 3, "n": 63, "tag": "2024-Malakand · Q25", "q": "Autonomy literally means:", "options": ["self-governing", "do no harm", "interdependence", "none of the above"], "answer": 0, "rationale": "Greek autos (self) and nomos (rule) give 'self-governing'.", "diff": 3}, {"chapter": 3, "n": 64, "tag": "2024-Malakand · Q27", "q": "___ is a decision making on behalf of the patients without their full consent or knowledge.", "options": ["Expressed Consent", "Implied consent", "Paternalism", "Autonomy"], "answer": 2, "rationale": "Deciding for the patient without their consent or knowledge is paternalism.", "diff": 3}, {"chapter": 3, "n": 65, "tag": "2024-Malakand · Q40", "q": "Actions must aim to 'benefit' people health, welfare, comfort, well being, improve a person's potential, improve quality of life. These actions come in ___ ethical principle.", "options": ["Beneficence", "Autonomy", "Non-maleficence", "Justice"], "answer": 0, "rationale": "Actions aimed at benefiting people fall under beneficence.", "diff": 1}, {"chapter": 3, "n": 66, "tag": "2024-Malakand · Q41", "q": "Fidelity is a principle pertaining specifically to the concept of:", "options": ["Faithfulness", "Charity", "Benevolence", "a and"], "answer": 0, "rationale": "Fidelity is about faithfulness and keeping commitments.", "diff": 1}, {"chapter": 3, "n": 67, "tag": "2024-Malakand · Q44", "q": "A woman age 83 years who has suffered a cerebrovascular accident and is unable to swallow refuses the insertion of a feeding tube. This is an example of what ethical principle?", "options": ["Veracity", "Autonomy", "Justice", "Nonmaleficence"], "answer": 1, "rationale": "A competent patient refusing treatment is exercising autonomy.", "diff": 2}, {"chapter": 3, "n": 68, "tag": "2024-Malakand · Q61", "q": "In nursing, there are many implications with autonomy, such as:", "options": ["informed consent", "advance directives", "end of life issues", "All of these"], "answer": 3, "rationale": "Consent, advance directives and end-of-life issues all involve autonomy.", "diff": 1}, {"chapter": 3, "n": 69, "tag": "2024-Malakand · Q63", "q": "A 70-year-old patient is admitted to the hospital because of an accidental gunshot wound. The patient is pale and losing blood and needs a blood transfusion. The patient is responsive but refuses the transfusion based on religious beliefs. Which right is this patient exercising in regard to care?", "options": ["Autonomy", "Privacy", "Dignity", "Capacity"], "answer": 0, "rationale": "A responsive patient refusing treatment on religious grounds is exercising autonomy.", "diff": 1}, {"chapter": 3, "n": 70, "tag": "2025 · Q3", "q": "A nurse prioritizes listening and relationship over rules. This approach is:", "options": ["Care ethics", "Justice ethics", "Law ethics", "Duty ethics"], "answer": 0, "rationale": "Care ethics stresses relationships, empathy and responsiveness to the patient's needs over rigid rules.", "diff": 1}, {"chapter": 3, "n": 71, "tag": "2025 · Q5", "q": "A patient chooses to leave against medical advice. Nurse respects this. She honors:", "options": ["Control", "Autonomy", "Authority", "Policy"], "answer": 1, "rationale": "A competent patient has the right to make their own decisions, even against advice; this is respect for autonomy.", "diff": 3}, {"chapter": 3, "n": 72, "tag": "2025 · Q8", "q": "A patient with capacity refuses pain medicine despite severe pain. Nurse should:", "options": ["Respect refusal", "Ignore patient", "Force medicine", "Inject secretly"], "answer": 0, "rationale": "A patient with decision-making capacity may refuse treatment; the nurse respects the refusal (while exploring concerns and offering alternatives).", "diff": 2}, {"chapter": 3, "n": 73, "tag": "2025 · Q10", "q": "An elderly patient refuses medication despite risks. Which principle is most relevant?", "options": ["Policy", "Autonomy", "Charity", "Justice"], "answer": 1, "rationale": "The patient's right to self-determination, even when the choice is risky, is the principle of autonomy.", "diff": 4}, {"chapter": 3, "n": 74, "tag": "2025 · Q11", "q": "A competent patient refuses life-saving dialysis. The nurse should:", "options": ["Force dialysis", "Delay decision", "Respect choice", "Call family"], "answer": 2, "rationale": "A competent adult may refuse even life-saving treatment; the nurse respects the choice and continues supportive care.", "diff": 4}, {"chapter": 3, "n": 75, "tag": "2025 · Q17", "q": "A doctor asks a nurse to lie about a test result. The nurse refuses. Which principle is upheld?", "options": ["Non-maleficence", "Beneficence", "Justice", "Veracity"], "answer": 3, "rationale": "Veracity is the duty to tell the truth and not deceive patients.", "diff": 3}, {"chapter": 3, "n": 76, "tag": "2025 · Q19", "q": "Deontology says an action is right if it follows:", "options": ["Emotion", "Duty", "Reward", "Results"], "answer": 1, "rationale": "Deontology judges an action by whether it follows duty or moral rules, not by its consequences.", "diff": 2}, {"chapter": 3, "n": 77, "tag": "2025 · Q20", "q": "Nurse Khalid promised to sit with a dying patient. He stays late to do so. This is:", "options": ["Veracity", "Fidelity", "Autonomy", "Justice"], "answer": 1, "rationale": "Fidelity is faithfulness: keeping promises and commitments to patients.", "diff": 4}, {"chapter": 3, "n": 78, "tag": "2025 · Q32", "q": "Virtue ethics focuses on the nurse's:", "options": ["Character", "Salary", "Schedule", "Uniform"], "answer": 0, "rationale": "Virtue ethics asks what a good person would do, focusing on moral character (compassion, honesty, courage).", "diff": 4}, {"chapter": 3, "n": 79, "tag": "2025 · Q36", "q": "A nurse feels torn between telling the truth and protecting a family's emotions. This inner struggle is:", "options": ["Routine care", "Happiness", "Skill gain", "Moral distress"], "answer": 3, "rationale": "Being torn between two competing moral demands — telling the truth and sparing the family's feelings — causes moral distress, the painful inner conflict a nurse feels when facing a morally troubling situation in which no course feels fully right.", "diff": 3}, {"chapter": 3, "n": 80, "tag": "2025 · Q37", "q": "A nurse avoids giving a wrong medication. Which principle guides this?", "options": ["Autonomy", "Non-maleficence", "Justice", "Fidelity"], "answer": 1, "rationale": "Non-maleficence means 'do no harm'; avoiding medication errors protects patients from harm.", "diff": 3}, {"chapter": 3, "n": 81, "tag": "2025 · Q41", "q": "Two patients need the only ventilator. One is young, one is old. Best choice:", "options": ["Random pick", "Family wealth", "Age alone", "Clinical need"], "answer": 3, "rationale": "Under the principle of justice, scarce resources go to the patient with the greater medical need and likelihood of benefit, not by age or wealth.", "diff": 3}, {"chapter": 3, "n": 82, "tag": "2025 · Q46", "q": "Nurse Shahid shows patience and kindness to a confused elder. This reflects:", "options": ["Policy", "Virtue ethics", "Routine", "Law"], "answer": 1, "rationale": "Acting from good character traits such as patience and kindness reflects virtue ethics.", "diff": 4}, {"chapter": 3, "n": 83, "tag": "2025 · Q49", "q": "A hospital gives the only ICU bed to the sickest patient, not the richest. This shows:", "options": ["Favoritism", "Justice", "Neglect", "Bias"], "answer": 1, "rationale": "Distributing scarce resources by need rather than wealth is distributive justice.", "diff": 2}, {"chapter": 3, "n": 84, "tag": "2025 · Q52", "q": "The principle of doing good for the patient is called:", "options": ["Justice", "Beneficence", "Veracity", "Fidelity"], "answer": 1, "rationale": "Beneficence is the duty to do good and act in the patient's best interest.", "diff": 2}, {"chapter": 3, "n": 85, "tag": "2025 · Q59", "q": "Nurse Nida gives pain medicine on time to relieve suffering. She is applying:", "options": ["Ab
