andonment", "Neglect", "Beneficence", "Maleficence"], "answer": 2, "rationale": "Acting to relieve suffering and benefit the patient is beneficence.", "diff": 1}, {"chapter": 3, "n": 86, "tag": "2025 · Q61", "q": "A nurse listens to a patient's full life story before making a care plan. This is:", "options": ["Narrative ethics", "Utilitarianism", "Virtue ethics", "Deontology"], "answer": 0, "rationale": "Narrative ethics uses the patient's own life story to understand values and guide care decisions.", "diff": 2}, {"chapter": 3, "n": 87, "tag": "2025 · Q70", "q": "A nurse decides to give a vaccine to 100 children instead of treating one adult. This thinking reflects:", "options": ["Deontology", "Care ethics", "Virtue ethics", "Utilitarianism"], "answer": 3, "rationale": "Utilitarianism aims for the greatest good for the greatest number.", "diff": 3}, {"chapter": 4, "n": 1, "tag": "2017 · Q22", "q": "Confidentiality can be breached:", "options": ["When a patient does not listen to doctor", "When a patient authorized to do so", "For a patient who requires invasive treatment", "In the case of foreign nationals in a country"], "answer": 1, "rationale": "Confidential information may be shared when the patient authorises disclosure; a patient disagreeing with the doctor does not permit it.", "diff": 2}, {"chapter": 4, "n": 2, "tag": "2017 · Q36", "q": "Identify some limits to confidentiality:", "options": ["Need to discuss helping experiences with supervisor", "Intent to harm self or others needs to be reported", "Childhood abuse needs to be reported", "Both b and"], "answer": 3, "rationale": "Duty-to-warn/mandatory-reporting limits confidentiality when there's intent to harm or suspected child abuse.", "diff": 4}, {"chapter": 4, "n": 3, "tag": "2017 · Q43", "q": "Which of the following client's cannot provide informed consent?", "options": ["Minors (children)", "Unconscious or seriously injured (emergency).", "Mentally ill person / Mentally Incompetent", "All of the above"], "answer": 3, "rationale": "Minors, unconscious/emergency patients, and the mentally incompetent all lack capacity to consent.", "diff": 1}, {"chapter": 4, "n": 4, "tag": "2018 · Q6", "q": "The duty to respect privileged information is called:", "options": ["Fidelity", "Justice", "Veracity", "Confidentiality"], "answer": 3, "rationale": "Protecting privileged patient information is the duty of confidentiality.", "diff": 3}, {"chapter": 4, "n": 5, "tag": "2018 · Q15", "q": "Which of these needs to be considered to gain informed consent?", "options": ["Obtaining both written and verbal consent", "Giving detailed information to participants", "Discussing the potential risks and benefits of the research", "Respecting cultural diversity"], "answer": 2, "rationale": "Valid informed consent requires the participant to understand the potential risks and benefits before agreeing, so discussing them is an essential part of gaining consent.", "diff": 2}, {"chapter": 4, "n": 6, "tag": "2018 · Q16", "q": "A research participant is allowed to withdraw from a study:", "options": ["For any reason as long as it is explained to the researcher", "For any reason as long as the researcher gives permission to withdraw", "For any reason without any explanation."], "answer": 2, "rationale": "Voluntary withdrawal is unconditional; a participant needs no explanation or permission.", "diff": 4}, {"chapter": 4, "n": 7, "tag": "2018 · Q17", "q": "On which of these occasions has confidentiality not been broken?", "options": ["You made notes during an interview and ask a friend to spell-check them.", "You store your research data and statistics on a public folder on the local library computer.", "You forget to tell inform participants that another researcher will be using your work.", "You ask participants to sign a consent form giving permission for their details to be entered into a prize draw."], "answer": 3, "rationale": "Getting explicit signed consent for a specific use of data keeps confidentiality intact.", "diff": 3}, {"chapter": 4, "n": 8, "tag": "2018 · Q25", "q": "When children/minors are included in research/Treatment, the parent/guardian must sign a permission consent document.", "options": ["Consent", "Parental permission", "Assent", "Short form"], "answer": 1, "rationale": "A guardian signing on a minor's behalf is termed parental permission (the minor gives assent, not consent).", "diff": 3}, {"chapter": 4, "n": 9, "tag": "2018 · Q26", "q": "A _______ is generally used when there is a language barrier and an English IRB-approved consent is orally translated in the subject's native language.", "options": ["Consent", "Parental permission", "Assent", "Short form"], "answer": 3, "rationale": "An orally-translated consent process for a language barrier uses a short form document.", "diff": 1}, {"chapter": 4, "n": 10, "tag": "2018 · Q27", "q": "Components of informed consent includes all of the following except:", "options": ["The proposed treatment or procedure", "Who will perform the treatment or procedure", "The purpose of the proposed treatment or procedure", "The cast and bills of the treatment or procedure"], "answer": 3, "rationale": "Cost/billing is not a required component of informed consent; treatment, performer, and purpose are.", "diff": 2}, {"chapter": 4, "n": 11, "tag": "2018 · Q28", "q": "Who will be responsible and accountable for the verification of and witnessing that the patient or the legal representative has signed the consent document in their presence and that the patient, or the legal representative, is of legal age and competent to provide consent.", "options": ["OT Technician", "Assign nurse", "Medical officer", "Nursing manager"], "answer": 1, "rationale": "Witnessing and verifying the consent signature is the assigned nurse's responsibility.", "diff": 4}, {"chapter": 4, "n": 12, "tag": "2018 · Q29", "q": "Informed consent will be signed from patient by:", "options": ["Doctor", "Nurse", "Pharmacist", "Physio-therapist"], "answer": 0, "rationale": "The doctor performing/ordering the procedure obtains the patient's signed informed consent.", "diff": 3}, {"chapter": 4, "n": 13, "tag": "2018 · Q33", "q": "A surgeon asks a nurse to take informed consent of the patient. Which action is best for the nurse to take?", "options": ["Saying yes", "Say this is your responsibility", "Make him realize that you are busy", "Ask someone else to do so"], "answer": 1, "rationale": "Obtaining informed consent for a surgical procedure is the surgeon's, not the nurse's, responsibility to disclose.", "diff": 1}, {"chapter": 4, "n": 14, "tag": "2018 · Q50", "q": "Which of the following is exempted from consent?", "options": ["Minor/child", "Mentally retarded person", "Unconscious patient", "All of them"], "answer": 3, "rationale": "Minors, the mentally incompetent, and unconscious patients all lack capacity, exempting them from giving direct consent.", "diff": 2}, {"chapter": 4, "n": 15, "tag": "2018 · Q54", "q": "In case of minors having no parents or guardians, who is supposed to consent for them?", "options": ["No need to consent", "Nobody", "A volunteer", "Legal guardian"], "answer": 3, "rationale": "A legal guardian must provide consent for a minor with no parents present.", "diff": 2}, {"chapter": 4, "n": 16, "tag": "2022 · Q38", "q": "When obtaining consent from a patient the nurse should be conscious of all of the points Except:", "options": ["The client must not feel forced or pressurized.", "The client must feel free to make decision.", "The consent form must contain such a word that the client may not understand.", "Consent must be translated if the client has a language barrier"], "answer": 2, "rationale": "A consent form should never use language the client can't understand — that's the exception; the source scan shows no clear circle for this item.", "diff": 4}, {"chapter": 4, "n": 17, "tag": "2022 · Q39", "q": "Mr. ABC is admitted to a hospital seriously ill with AIDS. He asks the nurse not to disclose the cause of illness to his parents and to respond to their questions with other causes like leukemia. What should the nurse do?", "options": ["Keep the patient information confident", "List all the information on poster", "To disclose the patient disease with their parents", "None of above"], "answer": 0, "rationale": "Respecting the competent adult patient's right to confidentiality is the standard textbook answer; the source scan shows no clear circle for this item.", "diff": 3}, {"chapter": 4, "n": 18, "tag": "2024 · Q13", "q": "Consent shown by actions rather than words is called:", "options": ["Expressed consent", "Implied consent", "Informed consent", "Unanimous consent"], "answer": 1, "rationale": "Consent demonstrated through actions rather than words is implied consent.", "diff": 1}, {"chapter": 4, "n": 19, "tag": "2024 · Q16", "q": "Who is responsible for verifying and witnessing that a patient or legal representative has signed a consent document?", "options": ["OT nurse", "Assigned nurse", "Medical officer", "Nursing manager"], "answer": 1, "rationale": "The assigned nurse verifies and witnesses the signing of the consent document.", "diff": 1}, {"chapter": 4, "n": 20, "tag": "2024 · Q42", "q": "Proof of informed consent requires at a minimum evidence that:", "options": ["A knowledgeable person discussed and answered questions about treatment", "The patient received written materials about the treatment", "A general consent to treatment was signed by the patient", "A specific consent to treatment was signed by the patient"], "answer": 3, "rationale": "A signed specific consent documents that the patient was informed about and agreed to that particular treatment, and that signed document is the legal proof of informed consent; discussion alone does not prove consent.", "diff": 4}, {"chapter": 4, "n": 21, "tag": "2024-Malakand · Q8", "q": "If a patient meets all criteria for informed consent but chooses not to proceed with treatment, this is known as:", "options": ["Informed refusal", "Informed compliance", "Informed denial", "Informed assent"], "answer": 0, "rationale": "A competent, fully informed decision to decline treatment is informed refusal.", "diff": 4}, {"chapter": 4, "n": 22, "tag": "2024-Malakand · Q12", "q": "It is an agreement by a client to accept a course of a treatment, procedure or research after being provided complete information including benefits and risks.", "options": ["Informed consent", "Medical paternalism", "Autonomy", "Beneficence"], "answer": 0, "rationale": "Agreement given after full disclosure of benefits and risks is informed consent.", "diff": 3}, {"chapter": 4, "n": 23, "tag": "2024-Malakand · Q17", "q": "___ is type of consent which exists when the client's nonverbal behavior indicates agreement.", "options": ["Expressed Consent", "Implied consent", "Consent", "Both A and B"], "answer": 1, "rationale": "Agreement shown through behaviour rather than words is implied consent.", "diff": 4}, {"chapter": 4, "n": 24, "tag": "2024-Malakand · Q19", "q": "If a patient is deemed legally incompetent to provide consent, who can provide consent on their behalf?", "options": ["Legal guardian", "A nurse", "Hospital administration", "The attending physician"], "answer": 0, "rationale": "A legally incompetent patient's consent comes from the legal guardian.", "diff": 3}, {"chapter": 4, "n": 25, "tag": "2024-Malakand · Q20", "q": "A common topic or topics of discussion in an ethics committee are:", "options": ["advance directives", "informed consent", "organ and tissue recovery and donation", "All of these"], "answer": 3, "rationale": "Ethics committees deal with advance directives, consent and organ donation, among others.", "diff": 2}, {"chapter": 4, "n": 26, "tag": "2024-Malakand · Q22", "q": "Which of the following is NOT an element of informed consent?", "options": ["Competence", "Coercion", "Disclosure of material information", "Comprehension"], "answer": 1, "rationale": "Consent must be voluntary, so coercion is the opposite of an element.", "diff": 4}, {"chapter": 4, "n": 27, "tag": "2024-Malakand · Q26", "q": "A client who is mentally incapacitated is scheduled to undergo surgery. The nurse demonstrates understanding of the principle of autonomy and checks the client's medical record to ensure that consent has been obtained from which person?", "options": ["Attending nurse", "Operating surgeon", "Client", "Surrogate decision maker"], "answer": 3, "rationale": "An incapacitated client's consent must come from a surrogate decision maker.", "diff": 4}, {"chapter": 4, "n": 28, "tag": "2024-Malakand · Q34", "q": "A healthcare provider must ensure that patients understand their diagnosis. This relates to which element of informed consent?", "options": ["Competence", "Comprehension", "Authorization", "Voluntariness"], "answer": 1, "rationale": "Making sure the patient understands is the comprehension element.", "diff": 2}, {"chapter": 4, "n": 29, "tag": "2024-Malakand · Q36", "q": "Which group of people cannot provide informed consent?", "options": ["Children", "Adult", "Conscious people", "Both (B) and (C)"], "answer": 0, "rationale": "Children lack legal capacity to give informed consent; conscious adults can.", "diff": 3}, {"chapter": 4, "n": 30, "tag": "2024-Malakand · Q38", "q": "Your patient has been admitted to four bed rooms with roommates, what right may be breached due to setting?", "options": ["Rights of refuse treatment", "social right", "rights of privacy and confidentiality", "Nurse bill of rights"], "answer": 2, "rationale": "A shared room puts the patient's privacy and confidentiality at risk.", "diff": 3}, {"chapter": 4, "n": 31, "tag": "2024-Malakand · Q49", "q": "More recently confidentiality has become front and center in America with the passage of what is referred to as:", "options": ["JCAHO", "CONREP", "HIPAA", "FICA"], "answer": 2, "rationale": "HIPAA is the US law that put patient confidentiality front and centre.", "diff": 1}, {"chapter": 4, "n": 32, "tag": "2024-Malakand · Q55", "q": "Following are the basic elements of consent except:", "options": ["Consent must be given voluntarily", "The consent must be given by a client/participant with the capacity and competence to understand", "The consent must be specific to the procedure & person", "The client must be married"], "answer": 3, "rationale": "Marital status has no bearing on valid consent.", "diff": 1}, {"chapter": 4, "n": 33, "tag": "2025 · Q1", "q": "Before a procedure, nurse Rabia explains risks in simple words. She is ensuring:", "options": ["Comprehension", "Confusion", "Fear", "Silence"], "answer": 0, "rationale": "Explaining in simple words ensures the patient understands the information, which is essential for informed consent.", "diff": 3}, {"chapter": 4, "n": 34, "tag": "2025 · Q7", "q": "Nurse Shahzad calls an ethics committee meeting. The goal is:", "options": ["Better decision", "Save money", "Delay care", "Punish staff"], "answer": 0, "rationale": "Ethics committees help clinicians, patients and families reach well-considered decisions in difficult cases.", "diff": 3}, {"chapter": 4, "n": 35, "tag": "2025 · Q9", "q": "A patient holds out an arm for blood pressure check. This action shows:", "options": ["Parental consent", "Implied consent", "Written consent", "Verbal consent"], "answer": 1, "rationale": "Consent shown by actions or conduct rather than words or a signature is implied consent.", "diff": 1}, {"chapter": 4, "n": 36, "tag": "2025 · Q28", "q": "Nurse Rabia uses teach-back to confirm understanding. This supports:", "options": ["Bias", "Negligence", "Informed consent", "Abandonment"], "answer": 2, "rationale": "Teach-back checks that the patient understands, a core element of valid informed consent.", "diff": 4}, {"chapter": 4, "n": 37, "tag": "2025 · Q33", "q": "Nurse Hina keeps a patient's HIV status secret from coworkers. She protects:", "options": ["Justice", "Fidelity", "Confidentiality", "Interference"], "answer": 2, "rationale": "Health information is shared only with those who need it for care; keeping it private protects confidentiality.", "diff": 1}, {"chapter": 4, "n": 38, "tag": "2025 · Q39", "q": "A patient threatens to kill someone after discharge. The nurse should:", "options": ["Ignore threat", "Stay quiet", "Break confidentiality", "Laugh it off"], "answer": 2, "rationale": "When there is a serious, specific threat to another person, the duty to protect outweighs confidentiality, so the nurse reports it.", "diff": 4}, {"chapter": 4, "n": 39, "tag": "2025 · Q42", "q": "Nurse Farzana explains treatment benefits and risks before starting. She is practicing:", "options": ["Negligence", "Bias", "Informed consent", "Abandonment"], "answer": 2, "rationale": "Disclosing benefits, risks and alternatives before treatment is the process of informed consent.", "diff": 3}, {"chapter": 4, "n": 40, "tag": "2025 · Q51", "q": "A patient is unconscious and needs emergency surgery. The hospital proceeds. This is:", "options": ["Emergency consent", "Negligence", "Abandonment", "Battery"], "answer": 0, "rationale": "When a patient cannot consent and delay would be harmful, treatment proceeds under emergency (implied) consent.", "diff": 2}, {"chapter": 4, "n": 41, "tag": "2025 · Q53", "q": "A patient signs a consent form but does not understand the language. This consent lacks:", "options": ["Justice", "Comprehension", "Fidelity", "Voluntariness"], "answer": 1, "rationale": "Valid consent requires that the patient understands the information; a language barrier removes comprehension.", "diff": 3}, {"chapter": 4, "n": 42, "tag": "2025 · Q55", "q": "A nurse shares patient information with a friend. This violates:", "options": ["Fidelity", "Policy", "Privacy", "Justice"], "answer": 2, "rationale": "Disclosing patient information without authorization breaches the patient's privacy and confidentiality.", "diff": 2}, {"chapter": 4, "n": 43, "tag": "2025 · Q69", "q": "A patient agrees to surgery but cannot explain the procedure back. Which element is missing in informed consent?", "options": ["Consent", "Timing", "Authority", "Comprehension"], "answer": 3, "rationale": "The patient agreed but did not understand the procedure; comprehension is the missing element.", "diff": 2}, {"chapter": 5, "n": 1, "tag": "2017 · Q46", "q": "The Bills of Rights appear in which document?", "options": ["A paper containing a declaration of rights", "Articles of Confederation", "Report Card", "The Daily News"], "answer": 0, "rationale": "A bill of rights is, by definition, a document declaring a set of rights.", "diff": 2}, {"chapter": 5, "n": 2, "tag": "2017 · Q47", "q": "Right to Liberty means:", "options": ["Right to Freedom of action", "Right to life", "Right to happiness", "Right to speech"], "answer": 0, "rationale": "Liberty is defined as the right to freedom of action.", "diff": 4}, {"chapter": 5, "n": 3, "tag": "2017 · Q48", "q": "The alternate name of legal right is which of the following?", "options": ["Positive Rights", "Negative rights", "Moral Rights", "Property Rights"], "answer": 0, "rationale": "A legal right is a right created and protected by law, which is what a positive right is, whereas a moral right exists independently of legal recognition.", "diff": 4}, {"chapter": 5, "n": 4, "tag": "2018 · Q37", "q": "Bill of rights sets the rights of which of the following?", "options": ["Patients", "Health care provider", "Health care agency", "All of them"], "answer": 0, "rationale": "A Patient's Bill of Rights sets out the rights of the patient receiving care, such as respectful care, information, privacy and the right to accept or refuse treatment.", "diff": 3}, {"chapter": 5, "n": 5, "tag": "2022 · Q1", "q": "The rights which are not limited to a particular jurisdiction/authority is known as:", "options": ["Legal right", "Moral right", "Right to life", "All of above"], "answer": 1, "rationale": "A right not tied to a specific jurisdiction's law is a moral right, not a legal one.", "diff": 3}, {"chapter": 5, "n": 6, "tag": "2022 · Q2", "q": "When you have a right to something that means you can force someone else to provide you with it:", "options": ["Moral right", "Right to life", "Positive right", "All of above"], "answer": 2, "rationale": "A right that obliges someone else to actively provide something is a positive right.", "diff": 3}, {"chapter": 5, "n": 7, "tag": "2022 · Q3", "q": "When you have a right to something, but you have to gain/maintain it yourself:", "options": ["Legal right", "Negative right", "Positive right", "All of above"], "answer": 1, "rationale": "A right that only requires others not to interfere, leaving you to secure it yourself, is a negative right.", "diff": 1}, {"chapter": 5, "n": 8, "tag": "2022 · Q4", "q": "Patients' bill of right is affirmed by:", "options": ["American heart association", "American hospital association", "Right to life", "All of above"], "answer": 1, "rationale": "The Patient's Bill of Rights was affirmed by the American Hospital Association.", "diff": 2}, {"chapter": 5, "n": 9, "tag": "2022 · Q5", "q": "Patient bill of right include:", "options": ["Be treated respectfully", "Obtain complete current information", "Receive information necessary to give his or her informed consent", "All of the above"], "answer": 3, "rationale": "Respectful treatment, current information, and informed-consent information are all part of a patient's bill of rights.", "diff": 1}, {"chapter": 5, "n": 10, "tag": "2024 · Q4", "q": "..... are the rights of freedom and choice that express people's right to live as they choose within prescribed boundaries.", "options": ["Individual rights", "Economic rights", "Legislative rights", "Social rights"], "answer": 0, "rationale": "Freedom and choice to live as one chooses within limits describes individual rights.", "diff": 2}, {"chapter": 5, "n": 11, "tag": "2024 · Q6", "q": "The type of rights established by law and based on the concept of justice is called:", "options": ["Individual rights", "Political rights", "Legislative rights", "Social rights"], "answer": 2, "rationale": "Rights established by law, grounded in justice, are legislative rights.", "diff": 1}, {"chapter": 5, "n": 12, "tag": "2024 · Q50", "q": "Receiving complete information about one's health condition, treatment, and related matters is the right of:", "options": ["The Nurse", "The Doctor", "The Patient", "The Head Nurse"], "answer": 2, "rationale": "Receiving complete information about one's own care is the patient's right.", "diff": 1}, {"chapter": 5, "n": 13, "tag": "2024 · Q51", "q": "Legitimate expectations of a person in society at a given time are known as:", "options": ["Power", "Law", "Rights", "Legislative Rights"], "answer": 2, "rationale": "Legitimate societal expectations of a person are known as rights.", "diff": 1}, {"chapter": 5, "n": 14, "tag": "2024 · Q64", "q": "The right to privacy becomes controversial when:", "options": ["Balancing free expression with hate speech concerns", "Religious practices conflict with human rights", "Tension arises between personal privacy and security concerns", "Debates over when life begins in the context of abortion rights"], "answer": 2, "rationale": "Privacy becomes controversial specifically when it conflicts with security concerns.", "diff": 2}, {"chapter": 5, "n": 15, "tag": "2024-Malakand · Q13", "q": "Rights to liberty and rights to happiness are the example of?", "options": ["Moral rights", "spiritual rights", "legal rights", "A&C"], "answer": 0, "rationale": "Liberty and the pursuit of happiness are classic natural or moral rights.", "diff": 1}, {"chapter": 5, "n": 16, "tag": "2024-Malakand · Q24", "q": "The right to be free from discrimination on the basis of sexual orientation, including the right to marry a person of the same sex is a ___ human right.", "options": ["Islamic", "Controversial", "Universal", "Fundamental"], "answer": 1, "rationale": "This right is widely disputed across cultures and laws, so it is termed a controversial human right.", "diff": 2}, {"chapter": 5, "n": 17, "tag": "2024-Malakand · Q47", "q": "A formal declaration of the legal and civil rights of the citizens of any state, country, federation, etc. is called ___.", "options": ["Nurses federation", "Nursing association", "Bills of right", "Nursing council"], "answer": 2, "rationale": "A formal declaration of citizens' rights is a bill of rights.", "diff": 3}, {"chapter": 5, "n": 18, "tag": "2024-Malakand · Q48", "q": "Rights of patient described in the American hospital association 'Patient bill of rights' include all of the following except?", "options": ["Privacy and confidentiality", "rights to refuse to participate in research", "care without respect for continuity", "the rights to refuse treatment"], "answer": 2, "rationale": "Patients have the right to continuity of care, so 'care without respect for continuity' is the exception.", "diff": 1}, {"chapter": 5, "n": 19, "tag": "2024-Malakand · Q54", "q": "The right to reproductive freedom including the right to choose abortion is a ___ human right.", "options": ["Islamic", "Controversial", "Universal", "Fundamental"], "answer": 1, "rationale": "Abortion rights are widely disputed, so they are termed a controversial human right.", "diff": 1}, {"chapter": 5, "n": 20, "tag": "2024-Malakand · Q56", "q": "Some examples of universal human rights include all of the following except:", "options": ["The right to take life of others", "The right to liberty and freedom", "The right to the pursuit of happiness", "The right to live your life free of discrimination"], "answer": 0, "rationale": "No human right permits taking another person's life.", "diff": 4}, {"chapter": 5, "n": 21, "tag": "2025 · Q12", "q": "Nurse Sofia explains a patient's diagnosis and answers questions. She supports the right to:", "options": ["Food", "Information", "Discharge", "Silence"], "answer": 1, "rationale": "Patients have the right to information about their diagnosis and treatment, the basis of informed decisions.", "diff": 2}, {"chapter": 5, "n": 22, "tag": "2025 · Q29", "q": "A hospital restricts visitors during flu season to protect patients. This limits which right?", "options": ["Moral right", "Legal right", "Absolute right", "Limited right"], "answer": 3, "rationale": "Rights are not absolute: visiting rights can be limited when needed to protect the health of others.", "diff": 1}, {"chapter": 5, "n": 23, "tag": "2025 · Q54", "q": "The right to refuse treatment is an example of:", "options": ["Moral right", "Absolute right", "Hospital rule", "Legal duty"], "answer": 0, "rationale": "Refusing treatment is a right grounded in autonomy (a moral right, also protected in law). It is not absolute, and it is not a hospital rule or a duty.", "diff": 2}, {"chapter": 5, "n": 24, "tag": "2025 · Q56", "q": "Patient Bill of Rights ensures patients can make informed decisions. This promotes:", "options": ["Silence", "Control", "Delay", "Autonomy"], "answer": 3, "rationale": "Informed decision making is the practical expression of patient autonomy.", "diff": 2}, {"chapter": 6, "n": 1, "tag": "2017 · Q24", "q": "According to nursing code of ethics, when working as a nurse a conflict comes up between your client's needs and physician wants, and hospital policies, your first loyalty is to which of the following?", "options": ["Hospital", "Client", "Family", "Physician"], "answer": 1, "rationale": "The nurse's first loyalty in a conflict is to the client/patient.", "diff": 2}, {"chapter": 6, "n": 2, "tag": "2017 · Q26", "q": "Code of Ethics is best described by which of the following?", "options": ["A set of rules and guidelines of conduct", "Professional Standards", "Both a &", "None of the above"], "answer": 0, "rationale": "A code of ethics is a set of rules/guidelines governing conduct.", "diff": 1}, {"chapter": 6, "n": 3, "tag": "2017 · Q28", "q": "Which of the following are the standards of ethical conduct which is set by ICN in 1953?", "options": ["Nurses and people and practice", "Nurses and the profession", "Nurses and co-workers", "All of the above"], "answer": 3, "rationale": "The ICN Code's standard elements together cover nurses and people, practice, co-workers and profession.", "diff": 2}, {"chapter": 6, "n": 4, "tag": "2018 · Q46", "q": "A solemn promise or agreement to do or refrain from doing something is referred to as:", "options": ["Consent", "Pledge", "Authority", "Accountability"], "answer": 1, "rationale": "A solemn promise to do/refrain from doing something is a pledge.", "diff": 3}, {"chapter": 6, "n": 5, "tag": "2018 · Q65", "q": "A written statement of policies and principles that guides the behavior of all employees is called:", "options": ["Skills", "Code of ethics", "Ethical conflictions", "Ethical dilemma"], "answer": 1, "rationale": "A written statement of guiding policies/principles for employees is a code of ethics.", "diff": 1}, {"chapter": 6, "n": 6, "tag": "2018 · Q66", "q": "Which of the following is not a core principle of the Society for Human Resource Management's Code of Ethics?", "options": ["Professional development", "Professional responsibility", "Fairness and justice", "None of them"], "answer": 3, "rationale": "All three listed items are genuine SHRM Code of Ethics core principles, so none is excluded.", "diff": 3}, {"chapter": 6, "n": 7, "tag": "2018 · Q67", "q": "Which of the following factors shapes the ethical behavior of the members of an organization?", "options": ["Code of ethics", "The supervisor's behavior", "Organizational culture", "All of them"], "answer": 3, "rationale": "Ethical behavior in an organization is shaped jointly by its code, supervisors, and culture.", "diff": 4}, {"chapter": 6, "n": 8, "tag": "2018 · Q68", "q": "Most companies begin the process of establishing organizational ethics programs by developing:", "options": ["Hidden agendas", "Ethics training programs", "Codes of conduct", "Ethics enforcement mechanisms"], "answer": 2, "rationale": "An organisation normally begins an ethics programme by developing a written code of conduct, which then guides training and enforcement.", "diff": 2}, {"chapter": 6, "n": 9, "tag": "2022 · Q6", "q": "_______ helps members of a profession to recognize their responsibilities, and helps create an environment in which ethical behavior is the norm.", "options": ["Code", "Code of conduct", "Code of ethics", "None of the above"], "answer": 2, "rationale": "A code of ethics helps members of a profession recognise their responsibilities and creates an environment in which ethical behaviour is the norm.", "diff": 1}, {"chapter": 6, "n": 10, "tag": "2022 · Q7", "q": "An international code of ethics for nurses was adopted by the International Council of Nurses (ICN) in:", "options": ["1953", "1854", "1956", "1960"], "answer": 0, "rationale": "ICN adopted its first international code of ethics for nurses in 1953.", "diff": 4}, {"chapter": 6, "n": 11, "tag": "2022 · Q8", "q": "The principle of an international code of ethics for nurses includes Except:", "options": ["Nurse and people", "Nurse and practice", "Nurse and co-worker", "Nurse and doctor"], "answer": 3, "rationale": "The ICN Code's classic elements are nurses & people, practice, co-workers and profession — 'nurse and doctor' isn't one of them.", "diff": 4}, {"chapter": 6, "n": 12, "tag": "2022 · Q9", "q": "While the application of code of ethics in clinical setting includes all Except:", "options": ["It assists health personnel to provide safe care.", "To harm patient is only possible by following code of ethics.", "To provide care that respects human rights and is sensitive to the values, customs and beliefs of people.", "Legal and moral rights to deal patients and others."], "answer": 1, "rationale": "A code of ethics exists to prevent harm, not enable it, so this statement is the exception.", "diff": 2}, {"chapter": 6, "n": 13, "tag": "2022 · Q12", "q": "Which of the following are the functions of a code of ethics?", "options": ["It can express a shared commitment on the part of a professional society's members to strive to satisfy certain ethical standards and principles", "It can help foster an environment in which ethical behavior is the norm", "It can serve as a guide or reminder in specific situations", "All of the above"], "answer": 3, "rationale": "A code of ethics serves all three functions together: shared commitment, fostering ethical norms, and situational guidance.", "diff": 4}, {"chapter": 6, "n": 14, "tag": "2022 · Q14", "q": "A _____ is a set of principles that people hold themselves to or that are held by organizations or groups.", "options": ["code of ethics", "code of honor", "ethical perspective", "persuasive tactic"], "answer": 0, "rationale": "A set of self-held or organizational principles is, by definition, a code of ethics.", "diff": 3}, {"chapter": 6, "n": 15, "tag": "2024 · Q15", "q": "The primary purpose of the Code of Ethics for Nurses is to:", "options": ["Ensure that all nurses share the same vision of nursing", "Support disciplinary actions when necessary", "Guide nursing responsibilities in a manner consistent with ethical and quality care", "Differentiate nursing from other healthcare professions"], "answer": 2, "rationale": "The Code of Ethics exists to guide nursing responsibilities consistent with ethical, quality care.", "diff": 4}, {"chapter": 6, "n": 16, "tag": "2024 · Q17", "q": "A nurse's major role in determining and implementing acceptable standards in clinical practice, management, research, and education is covered under:", "options": ["Nurse and people", "Nurses and co-workers", "Nurses and the profession", "Nurses and practice"], "answer": 2, "rationale": "Standard-setting in practice, management, research and education falls under 'Nurses and the profession'.", "diff": 2}, {"chapter": 6, "n": 17, "tag": "2024 · Q19", "q": "The ICN Code of Ethics for Nurses consists of ..... principal elements.", "options": ["Four", "Three", "Two", "One"], "answer": 0, "rationale": "The ICN Code of Ethics is built around four principal elements.", "diff": 2}, {"chapter": 6, "n": 18, "tag": "2024 · Q39", "q": "A solemn promise or agreement to do or refrain from doing something is called:", "options": ["Consent", "Pledge", "Authority", "Accountability"], "answer": 1, "rationale": "A solemn promise to do or refrain from doing something is a pledge.", "diff": 3}, {"chapter": 6, "n": 19, "tag": "2024 · Q40", "q": "Informing the public about the minimum professional standards and raising awareness about nursing conduct is a function of:", "options": ["International Nursing Council", "Ethical Principles", "Ethical Codes", "Ethical Conducts"], "answer": 2, "rationale": "Publicizing minimum standards and raising awareness of nursing conduct is a function of ethical codes.", "diff": 4}, {"chapter": 6, "n": 20, "tag": "2024 · Q45", "q": "Collaborating responsibly with academic faculty and clinical staff to ensure the highest quality of patient care is a code of ethics for:", "options": ["Clinical Nurses", "Nursing Students", "Clinical Nursing Teachers", "Nursing Supervisors"], "answer": 1, "rationale": "Collaborating with faculty and clinical staff is specifically a code-of-ethics expectation for nursing students.", "diff": 4}, {"chapter": 6, "n": 21, "tag": "2024 · Q59", "q": "Which of the following is NOT one of the principal elements outlined in the ICN Code of Ethics for Nurses?", "options": ["Nurses and Patients", "Nurses and Their Rights", "Nurses and Practice", "Nurses and Global Health"], "answer": 1, "rationale": "'Nurses and Their Rights' is not one of the ICN Code's principal elements.", "diff": 3}, {"chapter": 6, "n": 22, "tag": "2024 · Q62", "q": "Seeking work-life balance, personal growth, and maintaining a healthy lifestyle are elements in the ICN Code of Ethics for:", "options": ["Educators and Researchers", "Nurse Leaders and Nurse Managers", "National Nurses Associations", "All of the Above"], "answer": 3, "rationale": "The ICN Code states that its ethical duties and values apply to all nursing roles, including clinicians, educators, researchers, managers and professional associations, and it directs nurses to seek work-life balance, ongoing personal growth and a healthy lifestyle to maintain fitness to practise.", "diff": 4}, {"chapter": 6, "n": 23, "tag": "2024 · Q63", "q": "Nurses are accountable for data integrity to support and facilitate ethical standards of care. This falls under the code of ethics of:", "options": ["PMDC", "PNMC", "ICN", "PNF"], "answer": 2, "rationale": "Data integrity accountability for ethical standards of care falls under the ICN Code.", "diff": 2}, {"chapter": 6, "n": 24, "tag": "2024 · Q67", "q": "'Nurses share responsibility with society for initiating and supporting actions to meet health and social needs.' This element belongs to which ICN Code?", "options": ["1st", "2nd", "3rd", "4th"], "answer": 0, "rationale": "This statement is item 1.6 of the first element of the ICN Code, Nurses and Patients or Other People Requiring Care or Services, which covers nurses sharing with society the responsibility for meeting the health and social needs of all people.", "diff": 4}, {"chapter": 6, "n": 25, "tag": "2024 · Q69", "q": "The Professional Code of Ethics by the Pakistan Nursing and Midwifery Council provides guidance for:", "options": ["Nurses and Midwives", "Lady Health Visitors (LHVs)", "Nurse Auxiliaries", "All of the Above"], "answer": 3, "rationale": "PNMC's Code of Ethics covers nurses, midwives, LHVs and nurse auxiliaries together.", "diff": 3}, {"chapter": 6, "n": 26, "tag": "2024-Malakand · Q37", "q": "The American Nurses Association developed its code of ethics in the:", "options": ["1950s", "2008", "The year after the death of Florence Nightingale", "2010"], "answer": 0, "rationale": "The ANA adopted its first formal code of ethics in 1950.", "diff": 2}, {"chapter": 6, "n": 27, "tag": "2025 · Q4", "q": "Nurse Farah follows the PNC code during daily rounds. She is maintaining:", "options": ["Professional standards", "Family customs", "Personal habits", "Social rules"], "answer": 0, "rationale": "The Pakistan Nursing Council (PNC) code sets professional standards of conduct; following it maintains them.", "diff": 1}, {"chapter": 6, "n": 28, "tag": "2025 · Q18", "q": "A code of ethics provides:", "options": ["Salary", "Guidance", "Punishment", "Promotion"], "answer": 1, "rationale": "A code of ethics guides professional conduct and decision making.", "diff": 1}, {"chapter": 7, "n": 1, "tag": "2017 · Q20", "q": "A wrong dose of drug is administered by the nurse. The nurse is responsible to whom?", "options": ["Physician who ordered the drug", "Society", "Client", "All of the above"], "answer": 3, "rationale": "A medication error creates accountability toward the client, the profession and society at large.", "diff": 4}, {"chapter": 7, "n": 2, "tag": "2018 · Q3", "q": "Before the nurse administered the client's medication she assessed the client's needs for drugs, and followed the rights in drug preparation and administration. After the nurse has given the dose, she evaluated the client's response to the medication given. The nurse is promoting:", "options": ["Accountability", "Autonomy", "Responsibility", "Veracity"], "answer": 2, "rationale": "Carrying out and evaluating one's own nursing actions demonstrates responsibility.", "diff": 2}, {"chapter": 7, "n": 3, "tag": "2018 · Q4", "q": "Being answerable for one's own action is assuming:", "options": ["Accountability", "Responsibility", "Non-maleficence", "Veracity"], "answer": 0, "rationale": "Being answerable for one's own actions is the definition of accountability.", "diff": 1}, {"chapter": 7, "n": 4, "tag": "2018 · Q9", "q": "A wrong dose of drug is administered by the nurse. The nurse is responsible to whom?", "options": ["Client", "Physician who ordered the drug", "Society", "All of these"], "answer": 3, "rationale": "A medication error creates accountability to the client, physician, and society.", "diff": 4}, {"chapter": 7, "n": 5, "tag": "2018 · Q12", "q": "Professional accountability serves for the following purpose except for:", "options": ["To provide basis for ethical decision", "To respect the decision of the client", "To maintain standards of health", "To evaluate new professional practices and reassess existing ones"], "answer": 3, "rationale": "Evaluating and reassessing new professional practices belongs to research and professional development, not to professional accountability, which centres on being answerable for one's own practice and on upholding ethical and client-centred standards.", "diff": 3}, {"chapter": 7, "n": 6, "tag": "2018 · Q58", "q": "Actively seeking feedback through supervision, mentoring and peer review also serves to enhance a nurse's:", "options": ["Competency", "Integrity", "self-respect", "all of them"], "answer": 3, "rationale": "Supervision, mentoring and peer review build competency, integrity and self-respect together.", "diff": 3}, {"chapter": 7, "n": 7, "tag": "2022 · Q16", "q": "An individual answerable to oneself and others for one's own actions:", "options": ["Socialism", "Politician", "Humanity", "Accountable"], "answer": 3, "rationale": "Being answerable to self and others for one's own actions defines being accountable.", "diff": 2}, {"chapter": 7, "n": 8, "tag": "2022 · Q17", "q": "All of the characteristics of a professional nurse include Except:", "options": ["Caring", "Honest", "Faithful", "Aggressive"], "answer": 3, "rationale": "Aggressive is not a professional nursing trait; caring, honest and faithful are.", "diff": 3}, {"chapter": 7, "n": 9, "tag": "2022 · Q18", "q": "Nurse/physicians can exercise professional judgment to make care decisions that best meet the needs of patients and:", "options": ["Social autonomy", "Demographical autonomy", "Professional autonomy", "All of the above"], "answer": 2, "rationale": "Exercising professional judgment in patient care decisions is professional autonomy.", "diff": 1}, {"chapter": 7, "n": 10, "tag": "2022 · Q35", "q": "_______ is the degree to which others can depend on us. Like reputation, it can take a lifetime to build and only seconds to destroy.", "options": ["Likability", "Persuasiveness", "Reliability", "Eloquence"], "answer": 2, "rationale": "Being dependable, built slowly and lost quickly, describes reliability.", "diff": 3}, {"chapter": 7, "n": 11, "tag": "2022 · Q40", "q": "The authority to make decisions and the freedom to act in accordance with one's professional knowledge base:", "options": ["Professional autonomy", "Autonomy", "Social autonomy", "All of the above"], "answer": 0, "rationale": "Deciding and acting on one's own professional knowledge base is professional autonomy.", "diff": 2}, {"chapter": 7, "n": 12, "tag": "2024 · Q24", "q": "The ANA Standards of Professional Performance include:", "options": ["Quality of practice", "Collaboration", "Resource utilization", "All of the above"], "answer": 3, "rationale": "Quality of practice, collaboration and resource utilization are all ANA Standards of Professional Performance.", "diff": 3}, {"chapter": 7, "n": 13, "tag": "2024 · Q31", "q": "Insufficient or inaccurate assessment can lead to harm to the patient. What key skill is required to prevent this?", "options": ["Evaluation", "Critical thinking", "Ethical values", "Documentation"], "answer": 1, "rationale": "Critical thinking is the key skill needed to prevent harm from inaccurate assessment.", "diff": 4}, {"chapter": 7, "n": 14, "tag": "2024 · Q37", "q": "What are the characteristics of a leader who follows a laissez-faire leadership style?", "options": ["Involves the group in planning and decision-making", "Passive and shifts responsibility for decision-making to others", "Encourages independence in a team by promoting motivation and creativity", "Provides little autonomy and lacks motivation"], "answer": 1, "rationale": "A laissez-faire leader is passive and shifts decision-making responsibility to others.", "diff": 4}, {"chapter": 7, "n": 15, "tag": "2024 · Q46", "q": "Professional accountability serves the following purposes, except:", "options": ["Providing a basis for ethical decision-making", "Respecting the client's decision", "Maintaining healthcare standards", "Evaluating new professional practices and reassessing existing ones"], "answer": 1, "rationale": "Respecting the client's decision falls under autonomy, not a purpose of professional accountability.", "diff": 3}, {"chapter": 7, "n": 16, "tag": "2024 · Q47", "q": "Justifying an action by explaining why something was (or was not) done is called:", "options": ["Honesty", "Responsibility", "Fidelity", "Accountability"], "answer": 3, "rationale": "Explaining/justifying why an action was or wasn't taken is accountability.", "diff": 1}, {"chapter": 7, "n": 17, "tag": "2024 · Q68", "q": "Why is Continuing Professional Development (CPD) important for professionals?", "options": ["It guarantees a higher salary", "It allows them to maintain and update their skills", "It reduces working hours", "It provides opportunities for job-hopping"], "answer": 1, "rationale": "CPD matters because it lets professionals maintain and update their skills.", "diff": 2}, {"chapter": 7, "n": 18, "tag": "2024-Malakand · Q29", "q": "Characteristics of professional nurse include the following except:", "options": ["Humble and honest to gain the trust of the client", "Fulfill duties", "Fair without prejudice", "A nurse should be a glamour nurse"], "answer": 3, "rationale": "Glamour is not a professional trait; humility, duty and fairness are.", "diff": 2}, {"chapter": 7, "n": 19, "tag": "2024-Malakand · Q35", "q": "A patient diagnosed with diabetes is not adhering to their dietary restrictions. What is the nurse's primary role?", "options": ["Judge", "Educate", "Ignore", "Prescribe"], "answer": 1, "rationale": "The nurse's primary role here is to educate, not to judge or prescribe.", "diff": 1}, {"chapter": 7, "n": 20, "tag": "2024-Malakand · Q65", "q": "A patient who recently underwent surgery asks about the risks of infection. What is the key aspect to address?", "options": ["Awareness", "Medication", "Cost", "Consent"], "answer": 0, "rationale": "The nurse should raise the patient's awareness of infection risks and prevention.", "diff": 4}, {"chapter": 7, "n": 21, "tag": "2024-Malakand · Q67", "q": "Being a ___ nurse means the patients in your care must be able to trust you, It means being up to date with best practice, It means treating your patients and colleagues with dignity, kindness, respect and compassion.", "options": ["Capable", "Kind", "Sympathetic", "Professional"], "answer": 3, "rationale": "Trust, up-to-date practice and respectful care describe a professional nurse.", "diff": 3}, {"chapter": 7, "n": 22, "tag": "2024-Malakand · Q68", "q": "An elderly patient wishes to share their feelings about their declining health with the nursing staff. What should the nurse primarily facilitate?", "options": ["Treatment", "Transition", "Communication", "Discharge"], "answer": 2, "rationale": "Letting the patient express feelings is facilitating communication.", "diff": 2}, {"chapter": 7, "n": 23, "tag": "2025 · Q2", "q": "When all nurses on a unit work as a team, patient outcomes improve. This is:", "options": ["Division", "Unity", "Competition", "Isolation"], "answer": 1, "rationale": "Cooperation and shared purpose among team members is unity, which improves patient outcomes.", "diff": 1}, {"chapter": 7, "n": 24, "tag": "2025 · Q6", "q": "Nurse Salma stays after shift to document properly. She shows:", "options": ["Avoidance", "Neglect", "Responsibility", "Ignorance"], "answer": 2, "rationale": "Completing accurate documentation even after the shift shows professional responsibility.", "diff": 2}, {"chapter": 7, "n": 25, "tag": "2025 · Q15", "q": "Nurse Salman admits a charting mistake to his supervisor. This is:", "options": ["Arrogance", "Negligence", "Accountability", "Abandonment"], "answer": 2, "rationale": "Honestly acknowledging one's own error and reporting it is accountability.", "diff": 2}, {"chapter": 7, "n": 26, "tag": "2025 · Q16", "q": "Nursing sets its own practice standards. This ability is called:", "options": ["Chaos", "Isolation", "Dependence", "Autonomy"], "answer": 3, "rationale": "A hallmark of a profession is professional autonomy: self-regulation and setting its own standards.", "diff": 4}, {"chapter": 7, "n": 27, "tag": "2025 · Q23", "q": "A senior nurse asks a junior to do a skill the junior is not trained for. Best response:", "options": ["Do it anyway", "Run away", "Ignore request", "Refuse politely"], "answer": 3, "rationale": "Nurses must practice within their competence; politely declining protects the patient and the nurse.", "diff": 3}, {"chapter": 7, "n": 28, "tag": "2025 · Q24", "q": "A patient hides pain due to fear. Nurse Asad uses ethical skills to:", "options": ["Ignore", "Listen", "Leave", "Rush"], "answer": 1, "rationale": "Active, compassionate listening builds trust and lets the patient express fear and pain.", "diff": 2}, {"chapter": 7, "n": 29, "tag": "2025 · Q34", "q": "A nurse refuses a gift from a patient. This avoids:", "options": ["Generosity", "Boundary violation", "Friendship", "Kindness"], "answer": 1, "rationale": "Accepting gifts can blur the professional relationship; refusing keeps professional boundaries.", "diff": 2}, {"chapter": 7, "n": 30, "tag": "2025 · Q45", "q": "A nurse makes a medication error but documents it correctly. Which value is shown?", "options": ["Avoidance", "Secrecy", "Denial", "Accountability"], "answer": 3, "rationale": "Honest documentation of one's own error is accountability.", "diff": 4}, {"chapter": 7, "n": 31, "tag": "2025 · Q48", "q": "A nurse joins PNF to get legal help during a job dispute. This shows:", "options": ["Fear", "Isolation", "Ignorance", "Professional unity"], "answer": 3, "rationale": "Joining a professional association (e.g., the Pakistan Nurses Federation) for support shows professional unity.", "diff": 1}, {"chapter": 7, "n": 32, "tag": "2025 · Q64", "q": "A nurse feels sad after a patient dies but continues working. This shows:", "options": ["Weakness", "Avoidance", "Resilience", "Neglect"], "answer": 2, "rationale": "Coping with grief and continuing to function professionally shows resilience.", "diff": 3}, {"chapter": 7, "n": 33, "tag": "2025 · Q65", "q": "Nurse Amina updates her skills every year. This shows:", "options": ["Laziness", "Lifelong learning", "Confusion", "Avoidance"], "answer": 1, "rationale": "Keeping knowledge and skills current is lifelong learning, a professional responsibility.", "diff": 1}, {"chapter": 7, "n": 34, "tag": "2025 · Q67", "q": "Nurse Tariq reads research to improve wound care. He follows:", "options": ["Old habits", "Gossip", "Personal belief", "Evidence-based practice"], "answer": 3, "rationale": "Basing practice on the best available research is evidence-based practice.", "diff": 4}, {"chapter": 8, "n": 1, "tag": "2017 · Q37", "q": "What kind of contact can prove as an element of the tort of battery?", "options": ["Violent contact", "Contact causing slight injury", "Any contact without consent", "Harmful or offensive contact"], "answer": 3, "rationale": "Battery is intentional, unconsented contact that is harmful or offensive to the person touched.", "diff": 2}, {"chapter": 8, "n": 2, "tag": "2017 · Q38", "q": "Criminal law usually results in which of the following?", "options": ["Prison time", "False Communication", "Element of harm", "Do good do not harm"], "answer": 0, "rationale": "Criminal law violations can lead to imprisonment (prison time).", "diff": 2}, {"chapter": 8, "n": 3, "tag": "2017 · Q39", "q": "The two broad categories of torts are:", "options": ["Assault and battery", "Assault and aggravated assault", "Assault and negligence", "Intentional and unintentional"], "answer": 3, "rationale": "Torts are broadly classed as intentional and unintentional.", "diff": 1}, {"chapter": 8, "n": 4, "tag": "2017 · Q40", "q": "Intentional torts means?", "options": ["The act was done on purpose or with intent", "The act was NOT done on purpose or with intent", "To touch another person unjustifiably", "None of the above"], "answer": 0, "rationale": "An intentional tort is committed on purpose/with intent.", "diff": 2}, {"chapter": 8, "n": 5, "tag": "2017 · Q41", "q": "Unintentional torts means?", "options": ["Do not require intention, BUT, require an element of harm", "Require intention, BUT, require an element of harm", "Require intention and element of harm", "Require intention"], "answer": 0, "rationale": "Unintentional torts (e.g. negligence) don't need intent, but do need resulting harm.", "diff": 2}, {"chapter": 8, "n": 6, "tag": "2017 · Q42", "q": "Identify the examples of unintentional torts?", "options": ["Negligence", "Malpractice", "Both a and", "Only a is correct"], "answer": 2, "rationale": "Negligence and malpractice are both classic unintentional torts.", "diff": 4}, {"chapter": 8, "n": 7, "tag": "2017 · Q44", "q": "What is false imprisonment?", "options": ["Unjustifiable detention without legal warrant", "Defamation by means of print, writing, or pictures", "False Communication", "Defamation by spoken word"], "answer": 0, "rationale": "False imprisonment is the unjustifiable detention of a person without legal warrant or authority.", "diff": 3}, {"chapter": 8, "n": 8, "tag": "2017 · Q45", "q": "What is invasion of privacy?", "options": ["Unwarranted invasion of patient's private affairs", "Looking at the neighbor's yard", "Failure to behave in a reasonable manner", "Both a and"], "answer": 0, "rationale": "Invasion of privacy is an unwarranted intrusion into a patient's private affairs, such as disclosing or prying into information the patient has a right to keep private.", "diff": 2}, {"chapter": 8, "n": 9, "tag": "2017 · Q49", "q": "Tort is usually results in which of the following?", "options": ["Wrong commitment against person or person's property", "Touching a person", "Threatening a person", "All of the above"], "answer": 3, "rationale": "A tort broadly covers wrongs against a person or their property, including touching/threatening.", "diff": 1}, {"chapter": 8, "n": 10, "tag": "2018 · Q18", "q": "Which of these studies could be potentially unethical?", "options": ["A study of the response of elderly care-home patients to watching television at mealtimes where half watch at lunchtime, and half at dinnertime.", "Research into treatment for AIDS where half of sufferers are given treatment and the other half, a placebo.", "A study of the effects of sleep deprivation with sufferers of insomnia."], "answer": 1, "rationale": "Withholding known-effective treatment via a placebo arm in a serious illness raises a major ethical concern.", "diff": 2}, {"chapter": 8, "n": 11, "tag": "2018 · Q42", "q": "An attempt or threat to touch another person unjustifiably is associated with:", "options": ["Misdemeanor", "Felony", "Assault", "Libel"], "answer": 2, "rationale": "A threat or attempt to touch someone unjustifiably, without actual contact, is assault.", "diff": 3}, {"chapter": 8, "n": 12, "tag": "2018 · Q43", "q": "During tea break two health care members are talking ill of a patient for no reason. This constitutes:", "options": ["Slander", "Libel", "Assault", "Battery"], "answer": 0, "rationale": "Spoken defamation (talking ill of someone) is slander; written defamation is libel.", "diff": 3}, {"chapter": 8, "n": 13, "tag": "2018 · Q44", "q": "Which of the following is unintentional tort?", "options": ["Defamation", "Assault", "False imprisonment", "Negligence"], "answer": 3, "rationale": "Negligence, unlike defamation/assault/false imprisonment, does not require intent.", "diff": 2}, {"chapter": 8, "n": 14, "tag": "2018 · Q64", "q": "Invading someone's privacy is an example of:", "options": ["Crime", "Felony", "Intentional tort", "Unintentional tort"], "answer": 2, "rationale": "Invasion of privacy is a deliberate act, classing it as an intentional tort.", "diff": 1}, {"chapter": 8, "n": 15, "tag": "2018 · Q69", "q": "An alternative to the extended dying process is known as:", "options": ["Active euthanasia", "Passive euthanasia", "Rational suicide", "None of them"], "answer": 1, "rationale": "Withholding/withdrawing extraordinary measures to avoid prolonging dying is passive euthanasia.", "diff": 1}, {"chapter": 8, "n": 16, "tag": "2018 · Q70", "q": "You see a child who slips accidentally and is going to drown in water but you don't try to save him. It is an example of:", "options": ["Assisted suicide", "Killing", "Letting die", "Empathy"], "answer": 2, "rationale": "Failing to act to prevent a death you could have prevented is 'letting die', not killing.", "diff": 4}, {"chapter": 8, "n": 17, "tag": "2022 · Q20", "q": "An act or course of action to which a person is morally or legally bound:", "options": ["Professionalism", "Professional obligation", "Social boundary", "Humanism"], "answer": 1, "rationale": "An act one is morally or legally bound to is a professional obligation.", "diff": 2}, {"chapter": 8, "n": 18, "tag": "2022 · Q21", "q": "A misconduct or practice that is below the standard expected of a reasonable and prudent/sensible person:", "options": ["Negligence", "Mal practice", "Crime", "Felony"], "answer": 0, "rationale": "Falling below the reasonable-and-prudent-person standard is the definition of negligence.", "diff": 3}, {"chapter": 8, "n": 19, "tag": "2022 · Q22", "q": "An act committed in violation of public law and punishable by fine or imprisonment:", "options": ["Negligence", "Mal practice", "Crime", "Felony"], "answer": 2, "rationale": "A violation of public law punishable by fine/imprisonment is a crime.", "diff": 2}, {"chapter": 8, "n": 20, "tag": "2022 · Q23", "q": "An unsafe practice which is done by a professional:", "options": ["Negligence", "Mal practice", "Crime", "Felony"], "answer": 1, "rationale": "An unsafe practice specifically by a professional is malpractice.", "diff": 2}, {"chapter": 8, "n": 21, "tag": "2022 · Q24", "q": "_______ deals with civil law in which a wrong is committed against a person or a person's property. Examples are like touching, threatening, etc.", "options": ["Felony", "Tort", "Misdemeanor", "All of the above"], "answer": 1, "rationale": "A civil wrong against a person or their property, such as touching or threatening, is a tort.", "diff": 3}, {"chapter": 8, "n": 22, "tag": "2022 · Q25", "q": "A crime of less serious nature. For example, a nurse slaps a patient's face:", "options": ["Felony", "Tort", "Misdemeanor", "All of the above"], "answer": 2, "rationale": "A less-serious crime, such as a slap, is classed as a misdemeanor.", "diff": 4}, {"chapter": 8, "n": 23, "tag": "2022 · Q26", "q": "_______ is a crime of a serious nature such as murder:", "options": ["Felony", "Tort", "Misdemeanor", "All of the above"], "answer": 0, "rationale": "A serious crime such as murder is classed as a felony.", "diff": 4}, {"chapter": 8, "n": 24, "tag": "2022 · Q27", "q": "_______ is an attempt or threat to touch another person unjustifiably. For example, to threaten someone by gesturing with a slap or fist:", "options": ["Assault", "Battery", "False Imprisonment", "Defamation"], "answer": 0, "rationale": "A threat or attempt to touch, without actual contact, is assault.", "diff": 4}, {"chapter": 8, "n": 25, "tag": "2022 · Q28", "q": "An intentional unpermitted act causing harmful or offensive contact with others. For example, touching a person or person's clothes that is embarrassing or that causes injury:", "options": ["Assault", "Battery", "False Imprisonment", "Defamation"], "answer": 1, "rationale": "Actual unwanted harmful/offensive contact is battery.", "diff": 4}, {"chapter": 8, "n": 26, "tag": "2022 · Q29", "q": "The unjustifiable detention of a person without legal warrant to confine the person:", "options": ["Assault", "Battery", "False Imprisonment", "Defamation"], "answer": 2, "rationale": "Unjustified detention without a legal warrant is false imprisonment.", "diff": 2}, {"chapter": 8, "n": 27, "tag": "2022 · Q30", "q": "False Communication regarding a person which disgraces or injures the person's reputation:", "options": ["Assault", "Battery", "False Imprisonment", "Defamation"], "answer": 3, "rationale": "False communication injuring someone's reputation is defamation.", "diff": 2}, {"chapter": 8, "n": 28, "tag": "2022 · Q31", "q": "The elements that must be present for a case of nursing malpractice to be proven include all Except:", "options": ["Duty", "breach of duty", "causation/interconnection", "polite"], "answer": 3, "rationale": "Duty, breach of duty, causation and resulting harm are the four elements that must be proved for malpractice, so 'polite' is not one of them.", "diff": 2}, {"chapter": 8, "n": 29, "tag": "2024 · Q25", "q": "Nurses act as patient advocates. Advocacy requires the nurse to:", "options": ["Document all clinical changes in the medical record", "Understand laws related to the patient's condition", "Assess and clarify the patient's point of view", "Seek advice from a nursing supervisor in conflicts"], "answer": 2, "rationale": "Patient advocacy centers on assessing and clarifying the patient's own point of view.", "diff": 1}, {"chapter": 8, "n": 30, "tag": "2024 · Q34", "q": "What is an unsafe practice done by a professional?", "options": ["Malpractice", "Crime", "Negligence", "Profession"], "answer": 0, "rationale": "An unsafe practice specifically by a professional is malpractice.", "diff": 1}, {"chapter": 8, "n": 31, "tag": "2024 · Q41", "q": "If a nurse carries out an illegal practice resulting in a patient's death, the nurse may be guilty of:", "options": ["Assault", "Manslaughter", "Murder", "Negligence"], "answer": 1, "rationale": "An il ates the patient relationship. Why may this physician refuse to treat this patient?", "options": ["The staff feels comfortable", "The patient has right to threat", "There is a safety concern", "There is a minor medical complaint"], "answer": 2, "rationale": "A threat to staff creates a safety concern, which justifies ending the relationship.", "diff": 4}, {"chapter": 8, "n": 41, "tag": "2024-Malakand · Q33", "q": "Which of the following words is best described by the following: the protection and support of another's rights?", "options": ["Advocacy", "Ethics", "Autonomy", "Paternalism"], "answer": 0, "rationale": "Protecting and supporting another's rights defines advocacy.", "diff": 1}, {"chapter": 8, "n": 42, "tag": "2024-Malakand · Q42", "q": "A nurse notices signs of patient abuse. What is the nurse's duty?", "options": ["Discuss", "Report", "Investigate", "Ignore"], "answer": 1, "rationale": "The nurse's duty is to report suspected abuse through the proper channel.", "diff": 3}, {"chapter": 8, "n": 43, "tag": "2024-Malakand · Q43", "q": "___ also known as a moral dilemmas, are a situations in which there is a choice to be made between two options, neither of which resolves the situation in an ethically acceptable fashion.", "options": ["Ethical principles", "Ethical values", "Ethical dilemmas", "Moral principles"], "answer": 2, "rationale": "Choosing between two unsatisfactory options defines an ethical dilemma.", "diff": 3}, {"chapter": 8, "n": 44, "tag": "2024-Malakand · Q45", "q": "The nurse 'breached' that duty of care, or failed to properly care.", "options": ["Obligation", "Negligence", "Battery", "Tort"], "answer": 1, "rationale": "Breaching the duty of care through failure to care properly is negligence.", "diff": 3}, {"chapter": 8, "n": 45, "tag": "2024-Malakand · Q46", "q": "A patient in palliative care is experiencing severe pain despite medication. What is the nurse's main focus in managing this situation?", "options": ["Treatment", "Orders", "Comfort", "Distress"], "answer": 2, "rationale": "The goal in palliative care is the patient's comfort.", "diff": 2}, {"chapter": 8, "n": 46, "tag": "2024-Malakand · Q53", "q": "A young adult patient is reluctant to undergo a psychological evaluation. What should the nurse advocate for?", "options": ["Isolation", "Ignorance", "Denial", "Consent"], "answer": 3, "rationale": "The nurse should advocate for the patient's informed consent before any evaluation.", "diff": 3}, {"chapter": 8, "n": 47, "tag": "2024-Malakand · Q64", "q": "Initiate safety processes in the overall well-being of employees at a workplace setting. The statement is about:", "options": ["Nurses' advocacy in life support equipment", "Nurses' advocacy in selling body parts", "Nurses' advocacy in community", "Nurses' advocacy in occupational hazards"], "answer": 3, "rationale": "Workplace safety for employees is advocacy against occupational hazards.", "diff": 2}, {"chapter": 8, "n": 48, "tag": "2025 · Q14", "q": "A conflict arises between a patient's end-of-life preference and family demands for full treatment. This situation represents:", "options": ["Skill gap", "Routine care", "Autonomy conflict", "Legal issue"], "answer": 2, "rationale": "The patient's autonomy conflicts with the family's wishes, creating an autonomy conflict (an ethical dilemma).", "diff": 3}, {"chapter": 8, "n": 49, "tag": "2025 · Q22", "q": "Nurse Bilal reports a broken ventilator immediately. He fulfills his:", "options": ["Social habit", "Family duty", "Personal wish", "Professional obligation"], "answer": 3, "rationale": "Reporting unsafe equipment to protect patients is a professional obligation.", "diff": 1}, {"chapter": 8, "n": 50, "tag": "2025 · Q26", "q": "Failure to turn a bedridden patient leads to a severe bedsore. This is:", "options": ["Justice", "Negligence", "Advocacy", "Beneficence"], "answer": 1, "rationale": "Failing to give expected care that causes harm is negligence.", "diff": 4}, {"chapter": 8, "n": 51, "tag":
