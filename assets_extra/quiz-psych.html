 thinking", "Symbolic thought", "Ability to perform complex calculations", "Understanding of abstract concepts"], "answer": 1, "rationale": "Symbolic thought defines the preoperational stage.", "diff": 3}, {"chapter": 4, "n": 38, "tag": "2024 · Q56", "q": "In which type of play does a child use blocks or Legos to build a structure?", "options": ["Dramatic", "Functional play", "Constructive play", "Games with rules"], "answer": 2, "rationale": "Building with blocks is constructive play.", "diff": 3}, {"chapter": 4, "n": 39, "tag": "2024 · Q57", "q": "Which is a positive consequence of successful initiative in the preschool years?", "options": ["Increased dependence on others", "Feeling ashamed of their efforts", "Difficulty planning activities", "Sense of purpose and accomplishment"], "answer": 3, "rationale": "Successfully resolving initiative vs. guilt gives a sense of purpose and accomplishment.", "diff": 1}, {"chapter": 4, "n": 40, "tag": "2024 · Q66", "q": "According to Freud, during which stage of psychosexual development does the Oedipus or Electra complex occur?", "options": ["Oral stage", "Anal stage", "Latency stage", "Phallic stage"], "answer": 3, "rationale": "The Oedipus/Electra complex occurs during the phallic stage.", "diff": 4}, {"chapter": 4, "n": 41, "tag": "2024 · Q68", "q": "Erikson's initiative vs. guilt stage focuses on children developing a sense of:", "options": ["Trust", "Independence and control", "intimacy", "Identity"], "answer": 1, "rationale": "Children in this stage assert independence and control by planning and initiating activities, and success in doing so builds a sense of purpose.", "diff": 2}, {"chapter": 4, "n": 42, "tag": "2025 · Q8", "q": "A 4-year-old child believes that the sun follows him when he walks and insists that everyone sees things exactly as he does. This egocentric thinking is typical of the:", "options": ["Sensorimotor Stage", "Concrete Operational Stage", "Preoperational Stage", "Formal Operational Stage"], "answer": 2, "rationale": "Egocentrism (inability to take another's viewpoint) is a hallmark of Piaget's preoperational stage (2-7 years).", "diff": 3}, {"chapter": 4, "n": 43, "tag": "2025 · Q25", "q": "A preschooler throws a tantrum in the store, and shortly afterward the lights in the store go out. The child insists to the mother, \"I turned off the lights because I was mad.\" This reflects:", "options": ["Symbolic thought", "Object permanence", "Syncretism", "Animism"], "answer": 2, "rationale": "Syncretism is the preoperational tendency to link unrelated events as cause and effect (here, the tantrum and the power cut).", "diff": 4}, {"chapter": 4, "n": 44, "tag": "2025 · Q36", "q": "A nurse observes a 3-year-old child learning the word \"dog\" after hearing it only once during a visit to a farm. This rapid word acquisition is called:", "options": ["Centration", "Fast-mapping", "Overgeneralization", "Conservation"], "answer": 1, "rationale": "Fast-mapping is the ability of young children to learn a new word's meaning after very few exposures.", "diff": 4}, {"chapter": 4, "n": 45, "tag": "2025 · Q41", "q": "A 6-year-old boy becomes fearful after learning that boys and girls have different genitalia and begins to avoid rough play with his father. This fear is described by Freud as:", "options": ["Castration anxiety", "Identification", "Neurosis", "Penis envy"], "answer": 0, "rationale": "In the phallic stage (3-6 years) the Oedipus complex produces castration anxiety: fear of punishment by the father.", "diff": 1}, {"chapter": 4, "n": 46, "tag": "2025 · Q42", "q": "A 4-year-old child says, \"I goed to the park yesterday\" instead of \"I went to the park.\" This is an example of:", "options": ["Language delay", "Rule mastery without errors", "Overgeneralization", "Egocentric speech"], "answer": 2, "rationale": "Applying a regular rule (add -ed) to an irregular verb is overgeneralization, a normal step in language development.", "diff": 4}, {"chapter": 4, "n": 47, "tag": "2025 · Q44", "q": "A nurse notices a child's play reflects gender-specific toys. This is likely due to:", "options": ["Economic status", "Cultural influences", "Biological factors", "Family size"], "answer": 1, "rationale": "Gender-typed play is largely shaped by cultural expectations and socialization.", "diff": 4}, {"chapter": 4, "n": 48, "tag": "2025 · Q52", "q": "A child thinks the moon follows them when they move. This is an example of:", "options": ["Egocentric thinking", "Formal operational stage", "Concrete operational stage", "Preoperational stage"], "answer": 0, "rationale": "The child assumes the world revolves around their own viewpoint, which is egocentric thinking (typical of the preoperational stage).", "diff": 1}, {"chapter": 4, "n": 49, "tag": "2025 · Q68", "q": "A 5-year-old child compares two blocks and says, \"This one is bigger and that one is the tallest.\" This illustrates the use of:", "options": ["Symbolic play", "Conservation", "Comparative terms", "Egocentrism"], "answer": 2, "rationale": "Using words such as 'bigger' and 'tallest' to compare objects is the use of comparative terms, a language milestone of the preschool years.", "diff": 3}, {"chapter": 5, "n": 1, "tag": "2017 · Q9", "q": "Children of ______ parents are often obedient and are more likely to suffer from low self-confidence?", "options": ["Authoritarian Parents", "Authoritative Parents", "Permissive Parents", "Uninvolved Parents"], "answer": 0, "rationale": "Authoritarian parenting produces obedient children who often have lower self-confidence.", "diff": 2}, {"chapter": 5, "n": 2, "tag": "2017 · Q39", "q": "According to Sigmund Freud (1856-1939), the latency stage of psychosexual development occurs at ages?", "options": ["3-5", "5-11", "11-13", "13-15"], "answer": 1, "rationale": "The latency stage spans roughly ages 5/6 to 11/12.", "diff": 2}, {"chapter": 5, "n": 3, "tag": "2018 · Q14", "q": "Eddie's parents often include him in decisions such as curfew and chores. Once ge.", "diff": 2}, {"chapter": 5, "n": 9, "tag": "2018 · Q46", "q": "The developmental stage in which the child is no longer ego-centric in his thinking; he does not think of himself as the centre of the external world and does not perceive the world only from his own standpoint.", "options": ["Formal operation", "Sensory motor Stage", "Concrete Operational Stage", "Preoperational Stage"], "answer": 2, "rationale": "Decline of egocentrism occurs in the concrete operational stage.", "diff": 1}, {"chapter": 5, "n": 10, "tag": "2018 · Q55", "q": "In Piaget's stage of concrete operational intelligence, the child acquires an understanding of the principle of:", "options": ["Conservation", "Deduction", "Attachment", "Object permanence"], "answer": 0, "rationale": "Conservation is acquired in the concrete operational stage.", "diff": 1}, {"chapter": 5, "n": 11, "tag": "2019 · Q35", "q": "______ parents allow children to make all of their own decisions and do not interfere with the child's choices, even if they are bad choices.", "options": ["Authoritarian", "Permissive", "Uninvolved", "Authoritative"], "answer": 1, "rationale": "Permissive parents give children control over decisions with little interference.", "diff": 1}, {"chapter": 5, "n": 12, "tag": "2019 · Q36", "q": "Children of ______ parents are often obedient and are more likely to suffer from low self-confidence?", "options": ["Authoritarian Parents", "Authoritative Parents", "Permissive Parents", "Uninvolved Parents"], "answer": 0, "rationale": "Authoritarian parenting produces obedient children who often have lower self-confidence.", "diff": 2}, {"chapter": 5, "n": 13, "tag": "2019 · Q41", "q": "Which one of the following is an example of a fine motor skill?", "options": ["Climbing", "Hopping", "Running", "Writing"], "answer": 3, "rationale": "Writing is a fine motor skill, while climbing, hopping and running are gross motor skills.", "diff": 2}, {"chapter": 5, "n": 14, "tag": "2019 · Q46", "q": "In Piaget's Stages of Cognitive Development, the concrete-operational stage occurs at?", "options": ["2-7", "7-11", "12-15", "16-18"], "answer": 1, "rationale": "The concrete operational stage spans roughly ages 7-11.", "diff": 1}, {"chapter": 5, "n": 15, "tag": "2019 · Q61", "q": "At what time of life does Erikson's stage \"Industry vs. Inferiority\" occur?", "options": ["Adolescence", "Infancy", "School age", "Adulthood"], "answer": 2, "rationale": "Industry vs. inferiority occurs during school age.", "diff": 2}, {"chapter": 5, "n": 16, "tag": "2022 · Q56", "q": "When children are acquiring cognitive operations and thinking more logically about real objects and experiences, which of the following Piaget's stages of cognitive development developed?", "options": ["Preoperational Stage", "Concrete-Operational Stage", "Formal-Operational Stage", "Sensorimotor Stage"], "answer": 1, "rationale": "Logical thinking about concrete objects and experiences develops in the concrete operational stage.", "diff": 3}, {"chapter": 5, "n": 17, "tag": "2022 · Q57", "q": "During the ______ stage, one's ability to cope with demands is challenged and either competence or inferiority are the outcomes.", "options": ["Infancy", "Early childhood", "Pre-School", "School Age"], "answer": 3, "rationale": "Industry vs. inferiority, with competence or inferiority as outcomes, occurs during school age.", "diff": 4}, {"chapter": 5, "n": 18, "tag": "2022 · Q60", "q": "A type of parenting that makes few demands on a child, communicates very little and is often slow to respond to a child.", "options": ["Authoritarian", "Permissive", "Uninvolved", "Authoritative"], "answer": 2, "rationale": "Few demands, little communication and slow responsiveness describe uninvolved, or neglectful, parenting, in contrast to the strict control of authoritarian parenting.", "diff": 3}, {"chapter": 5, "n": 19, "tag": "2022 · Q63", "q": "If a teen wants to go with a bunch of friends on a weekend outing and asks parents' permission, and receives the reply \"Sure, go and have fun, but be careful\", this could possibly be a(n) ______ parent.", "options": ["Authoritative", "Authoritarian", "Uninvolved", "Permissive"], "answer": 0, "rationale": "Granting permission with caring guidance (\"be careful\") reflects authoritative parenting.", "diff": 3}, {"chapter": 5, "n": 20, "tag": "2023 · Q18", "q": "During which stage is children's ability to cope with demands challenged, with competence or inferiority as the outcome?", "options": ["Infancy", "Early childhood", "Pre-School", "School age"], "answer": 3, "rationale": "Industry vs. inferiority occurs during school age (roughly 6-12 years).", "diff": 4}, {"chapter": 5, "n": 21, "tag": "2023 · Q20", "q": "According to Piaget's theory, which stage is characterized by understanding of conservation and reversibility?", "options": ["Sensorimotor stage", "Concrete operational stage", "Preoperational stage", "Formal operational stage"], "answer": 1, "rationale": "Conservation and reversibility develop in the concrete operational stage.", "diff": 1}, {"chapter": 5, "n": 22, "tag": "2023 · Q22", "q": "What parenting style has high demands and low responsiveness, enforcing strict rules with little explanation?", "options": ["Neglectful", "Authoritative", "Permissive", "Authoritarian"], "answer": 3, "rationale": "Authoritarian parenting is high-demand, low-responsiveness, with strict rules.", "diff": 2}, {"chapter": 5, "n": 23, "tag": "2023 · Q27", "q": "During middle childhood and early adolescence (5-12 years), a significant cognitive development is the ability to:", "options": ["Identify and name all primary colors", "Reason logically and consider multiple perspectives in problem-solving", "Differentiate between left and right hand", "Memorize and recite multiplication tables"], "answer": 1, "rationale": "Logical reasoning and multiple-perspective problem-solving develop in this period (concrete operational thinking).", "diff": 2}, {"chapter": 5, "n": 24, "tag": "2023 · Q28", "q": "A 7-year-old can follow instructions, complete simple tasks independently, and copy complex shapes. These abilities demonstrate development in which area?", "options": ["Social skills", "Fine motor skills and following directions", "Emotional regulation", "Self-esteem"], "answer": 1, "rationale": "Following instructions and copying shapes reflect fine motor skill and direction-following development.", "diff": 4}, {"chapter": 5, "n": 25, "tag": "2023 · Q29", "q": "Erikson's theory suggests a child who succeeds at \"Initiative vs. Guilt\" (ages 3-5) will more likely develop industry during school years. What does \"industry\" represent?", "options": ["A strong sense of self-worth and confidence", "The ability to form deep and meaningful relationships", "Competence, achievement, and a desire to learn", "Independence and autonomy"], "answer": 2, "rationale": "Industry represents competence, achievement and eagerness to learn during school age.", "diff": 4}, {"chapter": 5, "n": 26, "tag": "2023 · Q30", "q": "Which is NOT a benefit of positive peer interactions for school-aged children?", "options": ["Development of social skills like cooperation and compromise", "Increased self-confidence and sense of belonging", "Enhanced academic performance through individual study", "Learning to manage conflict and resolve disagreements"], "answer": 2, "rationale": "Individual study is not a peer-interaction benefit; the others are direct benefits of peer relationships.", "diff": 3}, {"chapter": 5, "n": 27, "tag": "2023 · Q31", "q": "Authoritative parenting is characterized by:", "options": ["Setting strict rules with harsh punishments for disobedience", "Providing clear expectations, guidance, and encouraging children's independence", "Offering minimal rules and allowing children to make most decisions", "Being emotionally distant and uninvolved in a child's life"], "answer": 1, "rationale": "Authoritative parenting balances clear expectations with warmth and support for independence.", "diff": 1}, {"chapter": 5, "n": 28, "tag": "2023 · Q32", "q": "Which activity would be most beneficial for promoting vocabulary development in a school-aged child?", "options": ["Watching cartoons with limited dialogue", "Regular visits to the library and encouraging independent reading", "Playing video games with minimal text or narration", "Limiting social interactions and focusing on solitary activities"], "answer": 1, "rationale": "Regular reading exposes a school-aged child to new words in meaningful context, which builds vocabulary more effectively than cartoons with little dialogue, games with minimal text, or solitary activities.", "diff": 1}, {"chapter": 5, "n": 29, "tag": "2023 · Q33", "q": "Which best describes Freud's \"latency stage\" (ages 6-11)?", "options": ["A period of intense exploration and focus on genital pleasure", "A time of reduced sexual interest, with energy directed towards social interactions and learning", "A stage where children develop a strong attachment to the opposite-sex parent", "A period focused on toilet training and control over bodily functions"], "answer": 1, "rationale": "The latency stage is marked by reduced sexual interest and a focus on social/academic learning.", "diff": 3}, {"chapter": 5, "n": 30, "tag": "2023 · Q34", "q": "Which is NOT a typical characteristic of school children (5-12 years)?", "options": ["Increased attention span and ability to focus on tasks", "Development of a sense of self-awareness and self-identity", "Strong reliance on parents for all decision-making and problem-solving", "Growing desire for social interaction and peer relationships"], "answer": 2, "rationale": "School-age children grow more independent, not more reliant on parents for all decisions.", "diff": 4}, {"chapter": 5, "n": 31, "tag": "2023 · Q35", "q": "When a school-aged child exhibits behavioral problems or learning difficulties, parents should:", "options": ["Punish the child harshly to discourage the , such as income and healthcare access", "The ability to perform daily activities independently", "The strength and quality of social relationships"], "answer": 1, "rationale": "Objective living conditions are external, measurable factors like income and healthcare access.", "diff": 4}, {"chapter": 8, "n": 18, "tag": "2024 · Q9", "q": "When someone has good objective living conditions but reports low subjective well-being, it's called:", "options": ["Wellbeing", "Adaptation", "Dissonance", "Deprivation"], "answer": 2, "rationale": "A mismatch between good objective conditions and low subjective wellbeing is dissonance.", "diff": 1}, {"chapter": 8, "n": 19, "tag": "2024 · Q15", "q": "In addition to the stages mentioned, Erikson's theory includes a stage focused on:", "options": ["Establishing strong peer relationships", "Managing emotions effectively", "Achieving career success", "Developing a sense of integrity about one's life"], "answer": 3, "rationale": "Late adulthood's stage centers on developing a sense of integrity about one's life.", "diff": 4}, {"chapter": 8, "n": 20, "tag": "2024 · Q47", "q": "\"Deprivation\" in the context of quality of life for older adults refers to:", "options": ["A combination of wealth and unhappiness", "Poor living conditions and low life satisfaction", "Good health but limited social connections", "High levels of physical activity and emotional well-being"], "answer": 1, "rationale": "Deprivation means poor living conditions combined with low life satisfaction.", "diff": 2}, {"chapter": 8, "n": 21, "tag": "2025 · Q3", "q": "An elderly patient's confusion is addressed using knowledge of:", "options": ["Nutrition", "Developmental changes", "Surgical techniques", "Pharmacology"], "answer": 1, "rationale": "Confusion in old age must be judged against normal ageing and age-related cognitive change, so knowledge of developmental changes guides its assessment and care.", "diff": 4}, {"chapter": 8, "n": 22, "tag": "2025 · Q19", "q": "A nurse notices an elderly patient eating alone and avoiding social gatherings. The best intervention is to:", "options": ["Encourage group activities", "Provide sedatives", "Ignore the behavior", "Restrict visitors"], "answer": 0, "rationale": "Social withdrawal in older adults risks isolation and depression; encouraging group activities promotes engagement.", "diff": 1}, {"chapter": 8, "n": 23, "tag": "2025 · Q51", "q": "A 68-year-old patient becomes irritable and withdrawn after moving to a nursing home. This is likely due to:", "options": ["Depression", "Sensory loss", "Adjustment difficulty", "Cognitive impairment"], "answer": 2, "rationale": "A recent major change in living situation with irritability and withdrawal suggests difficulty adjusting to the move.", "diff": 4}, {"chapter": 8, "n": 24, "tag": "2025 · Q58", "q": "A 75-year-old patient has slower reaction time and reduced balance. This is an example of:", "options": ["Physical change", "Cognitive change", "Emotional change", "Social change"], "answer": 0, "rationale": "Slower reaction time and impaired balance are age-related physical (neuromuscular) changes.", "diff": 1}, {"chapter": 9, "n": 1, "tag": "2017 · Q25", "q": "Which part of the brain is responsible for positive emotion?", "options": ["Left hemisphere", "Right hemisphere", "Amygdala", "Hippocampus"], "answer": 0, "rationale": "The left hemisphere is associated with positive emotional processing.", "diff": 1}, {"chapter": 9, "n": 2, "tag": "2017 · Q26", "q": "Which structure is selectively involved in the recognition of fear stimuli?", "options": ["Hippocampus", "Pulvinar of thalamus", "Orbitofrontal cortex", "Amygdala"], "answer": 3, "rationale": "The amygdala is central to recognizing fear stimuli.", "diff": 1}, {"chapter": 9, "n": 3, "tag": "2017 · Q27", "q": "Strong, relatively uncontrollable feelings that affect our behavior are known as?", "options": ["Motivations", "Personality", "Emotions", "Perceptions"], "answer": 2, "rationale": "Strong ans have generally concluded that?", "options": ["The hippocampus plays a crucial role in experiencing fear", "The fornix plays a crucial role in allowing the recognition of fear", "The temporal cortex plays a crucial role in experiencing fear", "The amygdala plays a crucial role in the recognition of fear"], "answer": 3, "rationale": "Neuroimaging studies consistently implicate the amygdala in recognizing fear.", "diff": 3}, {"chapter": 9, "n": 10, "tag": "2018 · Q62", "q": "Positive emotional appraisals lead to what kind of tendencies in life?", "options": ["All of these choices are correct", "more playfulness", "an openness to experiences", "increase life span"], "answer": 0, "rationale": "Positive emotions are linked to increased playfulness, openness and even longevity, so all apply.", "diff": 1}, {"chapter": 9, "n": 11, "tag": "2018 · Q63", "q": "How are the physiological responses to negative emotions different from the responses to positive emotions?", "options": ["Heart rates are decreased when expressing positive emotions", "Skin temperatures are increased when expressing positive emotions", "Heart rates are increased when expressing positive emotions", "Skin temperatures are decreased when expressing positive emotions"], "answer": 2, "rationale": "In Levenson and colleagues' study a happy expression produced a small increase in heart rate, significantly smaller than the increase for anger and fear.", "diff": 3}, {"chapter": 9, "n": 12, "tag": "2018 · Q64", "q": "According to the James-Lange theory of emotions, you know you are afraid of snakes because:", "options": ["of learning about poisonous snakes", "You run when you see one", "of your cognitive appraisal of the danger", "All of these choices are true"], "answer": 1, "rationale": "James-Lange theory says the physiological/behavioral response (running) produces the feeling of fear.", "diff": 1}, {"chapter": 9, "n": 13, "tag": "2018 · Q65", "q": "Studies of people attempting to identify emotional reacti ": 18, "tag": "2019 · Q7", "q": "Which part of the brain is responsible for negative emotion?", "options": ["Left hemisphere", "Right hemisphere", "Amygdale", "Hippocampus"], "answer": 1, "rationale": "The right hemisphere is associated with negative emotional processing.", "diff": 2}, {"chapter": 9, "n": 19, "tag": "2019 · Q50", "q": "______ is any conscious experience characterized by intense mental activity and a certain degree of pleasure or displeasure.", "options": ["Intelligence", "Emotions", "Memory", "Happiness"], "answer": 1, "rationale": "This description defines emotion.", "diff": 4}, {"chapter": 9, "n": 20, "tag": "2019 · Q70", "q": "A broad range of feelings that people experience is called?", "options": ["Moods", "Affect", "Emotion", "Motivation"], "answer": 1, "rationale": "\"Affect\" is the broad term for the range of feelings a person experiences.", "diff": 3}, {"chapter": 9, "n": 21, "tag": "2022 · Q8", "q": "______ involve a mixture of physiological arousal, behavior, and thought.", "options": ["Needs", "Beliefs", "Emotions", "All of these choices are true"], "answer": 2, "rationale": "Emotions combine physiological arousal, behavior and thought.", "diff": 4}, {"chapter": 9, "n": 22, "tag": "2022 · Q9", "q": "When we experience ______ and ______, skin temperature may be reduced:", "options": ["Anger, happiness", "Surprise, anger", "Fear, disgust", "Grief, sadness"], "answer": 2, "rationale": "Fear and disgust are associated with reduced skin temperature in emotion research.", "diff": 3}, {"chapter": 9, "n": 23, "tag": "2022 · Q10", "q": "Males more readily express ______, while females more readily express ______?", "options": ["Anger, happiness", "Pride, grief", "Sadness, anger", "Anger, fear"], "answer": 0, "rationale": "Research on gender and emotion expression finds males express anger more readily, females express happiness more readily.", "diff": 4}, {"chapter": 9, "n": 24, "tag": "2022 · Q11", "q": "There are ______ components of the emoti  "options": ["Retrieval", "Encoding", "Storage", "Organization"], "answer": 2, "rationale": "Storage is holding information in memory over time.", "diff": 4}, {"chapter": 10, "n": 4, "tag": "2017 · Q13", "q": "Memory that is part of long-term memory containing factual information?", "options": ["Episodic", "Semantic", "Declarative", "Procedural"], "answer": 1, "rationale": "Factual, general knowledge about the world is stored in semantic memory, a form of declarative long-term memory.", "diff": 3}, {"chapter": 10, "n": 5, "tag": "2017 · Q14", "q": "The correct order for the three stages of memory is?", "options": ["Short-term memory, long-term memory, retrieval", "Working memory, short term memory, long term memory", "Sensory memory, short term memory, long term memory", "Short-term memory, sensory memory, long term memory"], "answer": 2, "rationale": "The standard model orders memory as sensory, short-term, then long-term.", "diff": 4}, {"chapter": 10, "n": 6, "tag": "2017 · Q15", "q": "These are the ways that help improve memory except?", "options": ["Rehearsal", "Recitation", "Organization", "Discussion"], "answer": 3, "rationale": "Rehearsal, recitation and organisation directly aid encoding and recall, while discussion is a general learning activity rather than a specific memory-improvement technique.", "diff": 2}, {"chapter": 10, "n": 7, "tag": "2018 · Q1", "q": "The process by which we process an external event into memory follows:", "options": ["Sensory Memory, Short-term Memory, Long-term Memory", "Short-term Memory, Long-term Memory, Sensory Memory", "Sensory Memory, Long-term Memory, Short-term Memory", "Only A & B"], "answer": 0, "rationale": "Information moves from sensory memory to short-term memory to long-term memory.", "diff": 2}, {"chapter": 10, "n": 8, "tag": "2018 · Q4", "q": "The process by which we associate a visual image with a memory is called?", "options": ["Visual Encoding", "Visual Memory", "Visual Sense", "Memory of Vision"], "answer": 0, "rationale": "Encoding a visual image into memory is visual encoding.", "diff": 1}, {"chapter": 10, "n": 9, "tag": "2019 · Q33", "q": "Echoic memory stores information coming from the ______.", "options": ["Eyes", "Ears", "Touch", "Senses"], "answer": 1, "rationale": "Echoic memory is the sensory memory store for auditory (ear) information.", "diff": 1}, {"chapter": 10, "n": 10, "tag": "2019 · Q66", "q": "The type of memory processed in the cerebellum and basal ganglia is?", "options": ["Explicit Memory", "Implicit Memory", "Semantic Memory", "Episodic Memory"], "answer": 1, "rationale": "Implicit (procedural) memory relies on the cerebellum and basal ganglia.", "diff": 4}, {"chapter": 10, "n": 11, "tag": "2019 · Q67", "q": "Psychologists have concluded that long-term memories fall into the following categories?", "options": ["Fact memory and mnemonic memory", "Procedural memory and fact memory", "Semantic memory and fact memory", "Semantic memory and reintegration memory"], "answer": 1, "rationale": "Long-term memory divides into declarative (fact) memory and non-declarative (procedural) memory, so procedural memory and fact memory are the two broad categories.", "diff": 3}, {"chapter": 10, "n": 12, "tag": "2019 · Q68", "q": "The process of holding information in memory is referred to as?", "options": ["Retrieval", "Encoding", "Storage", "Organization"], "answer": 2, "rationale": "Storage is holding information in memory over time.", "diff": 4}, {"chapter": 10, "n": 13, "tag": "2019 · Q69", "q": "Memory that is part of long-term memory containing factual information?", "options": ["Episodic", "Semantic", "Declarative", "Procedural"], "answer": 1, "rationale": "Semantic memory is the part of long-term memory that stores general factual knowledge about the world, independent of personal experience.", "diff": 3}, {"chapter": 10, "n": 14, "tag": "2022 · Q12", "q": "The first stage of memory when we are actively studying or introduced with a thing is called?", "options": ["Decoding Stage", "Storage Stage", "Retrieval Stage", "Encoding Stage"], "answer": 3, "rationale": "Actively processing new information is the encoding stage.", "diff": 3}, {"chapter": 10, "n": 15, "tag": "2022 · Q13", "q": "Things you know that you can show by doing is?", "options": ["Episodic", "Semantic", "Non Declarative", "Declarative"], "answer": 2, "rationale": "Skills demonstrated by doing (not stating) are non-declarative (procedural) memory.", "diff": 1}, {"chapter": 10, "n": 16, "tag": "2022 · Q14", "q": "The correct order for the three stages of memory is:", "options": ["Short-term memory, long-term memory, retrieval", "Working memory, short term memory, long term memory", "Sensory memory, short term memory, long term memory", "Short-term memory, sensory memory, long term memory"], "answer": 2, "rationale": "The standard model orders memory as sensory, short-term, then long-term.", "diff": 1}, {"chapter": 10, "n": 17, "tag": "2022 · Q15", "q": "The type of memory which operates over seconds to minutes is called?", "options": ["Sensory Memory", "Short term or Working memory", "Long term Memory", "Semantic Memory"], "answer": 1, "rationale": "Short-term/working memory holds information over seconds to minutes.", "diff": 3}, {"chapter": 10, "n": 18, "tag": "2022 · Q16", "q": "For working memory, most normal adults have a capacity of:", "options": ["7±2", "8±2", "9±2", "5±2"], "answer": 0, "rationale": "Miller's classic finding is a working memory capacity of 7±2 items.", "diff": 2}, {"chapter": 10, "n": 19, "tag": "2022 · Q17", "q": "One of the most striking aspects of human memory is that everyone suffers from a particular kind of amnesia: eventually no one can recall events from the first year of life. This is called...", "options": ["Retrograde amnesia", "Anterograde amnesia", "Transient global amnesia", "Childhood/infantile amnesia"], "answer": 3, "rationale": "Inability to recall very early childhood events is infantile amnesia.", "diff": 2}, {"chapter": 10, "n": 20, "tag": "2023 · Q64", "q": "The three main types of memory are:", "options": ["Sensory, emotional, and motor memory", "Explicit, implicit, and working memory", "Sensory, short-term, and long-term memory", "Visual, auditory, and olfactory memory"], "answer": 2, "rationale": "The classic memory model has sensory, short-term and long-term memory.", "diff": 3}, {"chapter": 10, "n": 21, "tag": "2023 · Q65", "q": "Sensory memory is the first stage of memory that stores:", "options": ["Information for several minutes", "Information for a lifetime", "An exact copy of incoming information for a very brief time", "Information related to emotions"], "answer": 2, "rationale": "Sensory memory holds a brief, exact copy of incoming sensory information.", "diff": 1}, {"chapter": 10, "n": 22, "tag": "2023 · Q66", "q": "Short-term memory (STM) has a limited capacity and is susceptible to:", "options": ["Encoding difficulties only", "Long-term storage problems only", "Emotional responses only", "Interruption and interference"], "answer": 3, "rationale": "STM is easily disrupted by interruption and interference.", "diff": 4}, {"chapter": 10, "n": 23, "tag": "2023 · Q67", "q": "Chunks in STM refer to:", "options": ["Meaningful units of information", "Random bits of unrelated information", "Memories associated with strong emotions", "Information stored in long-term memory"], "answer": 0, "rationale": "Chunking groups information into meaningful units to expand STM capacity.", "diff": 4}, {"chapter": 10, "n": 24, "tag": "2024 · Q1", "q": "Chunks in STM refer to:", "options": ["Meaningful units of information", "Random bits of unrelated information", "Memories associated with strong emotions", "Information stored in long-term memory"], "answer": 0, "rationale": "Chunking groups information into meaningful units to expand STM capacity.", "diff": 4}, {"chapter": 10, "n": 25, "tag": "2024 · Q64", "q": "The three main types of memory are:", "options": ["Sensory, emotional, toring. This is:", "options": ["Decay", "Proactive interference", "Retroactive interference", "Motivated forgetting"], "answer": 2, "rationale": "New learning (glucose monitoring) interferes with previously learned material (injection steps): retroactive interference.", "diff": 3}, {"chapter": 10, "n": 31, "tag": "2025 · Q67", "q": "A child remembers how to ride a bicycle even after not riding for 2 years. This is an example of:", "options": ["Semantic memory", "Procedural memory", "Episodic memory", "Sensory memory"], "answer": 1, "rationale": "Skills and habits such as riding a bicycle are stored in procedural memory, which lasts for years.", "diff": 1}, {"chapter": 11, "n": 1, "tag": "2017 · Q16", "q": "Dyscalculia refers to difficulty with ______?", "options": ["Reading", "Speaking", "Spelling", "Calculating"], "answer": 3, "rationale": "Dyscalculia is a specific difficulty with mathematics/calculation.", "diff": 4}, {"chapter": 11, "n": 2, "tag": "2017 · Q54", "q": "Materials like food for hungry animals or water for thirsty animals are called?", "options": ["Secondary Reinforcers", "Primary Reinforcers", "Intermittent Reinforcers", "Fixed Reinforcers"], "answer": 1, "rationale": "Reinforcers that satisfy basic biological needs directly are primary reinforcers.", "diff": 2}, {"chapter": 11, "n": 3, "tag": "2017 · Q55", "q": "A very useful principle of learning is that a new response is strengthened by?", "options": ["Punishment", "Reinforcement", "Biofeedback", "Discriminative Stimulus"], "answer": 1, "rationale": "Reinforcement strengthens a response.", "diff": 2}, {"chapter": 11, "n": 4, "tag": "2017 · Q56", "q": "Punishment is effective only when it weakens?", "options": ["Undesirable response", "Desirable response", "Positive response", "Negative response"], "answer": 0, "rationale": "Punishment is effective when it weakens an undesirable response.", "diff": 4}, {"chapter": 11, "n": 5, "tag": "2017 · Q57", "q": "Who among the following was the earliest inve  new response is strengthened by?", "options": ["Punishment", "Reinforcement", "Biofeedback", "Discriminative Stimulus"], "answer": 1, "rationale": "Reinforcement strengthens a response.", "diff": 2}, {"chapter": 11, "n": 19, "tag": "2019 · Q9", "q": "Punishment is effective only when it weakens?", "options": ["Undesirable response", "Desirable response", "Positive response", "Negative response"], "answer": 0, "rationale": "Punishment is effective when it weakens an undesirable response.", "diff": 4}, {"chapter": 11, "n": 20, "tag": "2019 · Q18", "q": "In Pavlov's experiments, ______ is considered an unconditioned response.", "options": ["Meat", "Food", "Salivation", "None of the above"], "answer": 2, "rationale": "Salivation (to food) is the unconditioned response in Pavlov's experiment; food/meat is the unconditioned stimulus.", "diff": 1}, {"chapter": 11, "n": 21, "tag": "2019 · Q52", "q": "According to ______, people learn their behavior from their history or past experience, particularly those repeated or reinforced?", "options": ["B.F. Skinner", "Ivan Pavlov", "John Watson", "Abraham Maslow"], "answer": 0, "rationale": "This describes B.F. Skinner's operant conditioning perspective.", "diff": 4}, {"chapter": 11, "n": 22, "tag": "2019 · Q53", "q": "Who among the following was the earliest investigator of classical conditioning?", "options": ["Ivan Pavlov", "B.F. Skinner", "Edward Thorndike", "Joseph Wolpe"], "answer": 0, "rationale": "Ivan Pavlov pioneered classical conditioning.", "diff": 3}, {"chapter": 11, "n": 23, "tag": "2019 · Q55", "q": "Who conceptualized social learning theory based on behavioral concepts?", "options": ["Albert Bandura", "Joseph Wolpe", "Edward Thorndike", "Mary Cover Jones"], "answer": 0, "rationale": "Albert Bandura developed social learning theory.", "diff": 4}, {"chapter": 11, "n": 24, "tag": "2019 · Q56", "q": "The notion of ______ claims that all learning is the result of operant conditioning.", "options": ["Behaviorism", "Functionalism", "Modularity", "Connectionism"], "answer": 0, "rationale": "Radical behaviorism holds that all learning results from operant conditioning.", "diff": 1}, {"chapter": 11, "n": 25, "tag": "2019 · Q57", "q": "A change in behavior as a result of experience or practice is called?", "options": ["Learning", "Multiple intelligence", "Cognitivism", "Structuralism"], "answer": 0, "rationale": "Learning is a behavior change from experience or practice.", "diff": 4}, {"chapter": 11, "n": 26, "tag": "2022 · Q18", "q": "It is defined as a relatively permanent change in the behavior that is the result of practice.", "options": ["Habituation", "Learning", "Tactile stimulation", "Instrumentation"], "answer": 1, "rationale": "This is the standard definition of learning.", "diff": 2}, {"chapter": 11, "n": 27, "tag": "2022 · Q19", "q": "Classical conditioning is based on the work of...", "options": ["Freud", "Ivan Pavlov", "Bandura", "Vygotsky"], "answer": 1, "rationale": "Ivan Pavlov's work established classical conditioning.", "diff": 1}, {"chapter": 11, "n": 28, "tag": "2022 · Q21", "q": "Operant learning refers to:", "options": ["Learning that occurs by observing others", "Learning from a more knowledgeable or skilled individual", "Learning through the manipulation and transformation of information", "Learning that occurs as a result of the manipulation of consequences"], "answer": 3, "rationale": "Operant learning is behavior shaped by the consequences (reinforcement/punishment) that follow it.", "diff": 1}, {"chapter": 11, "n": 29, "tag": "2022 · Q36", "q": "Who among the following conceptualized social learning theory based on behavioral concepts?", "options": ["Mary Cover Jones", "Albert Bandura", "Joseph Wolpe", "Edward Thorndike"], "answer": 1, "rationale": "Albert Bandura developed social learning theory, in which behaviour is learned by observing others and their consequences.", "diff": 4}, {"chapter": 11, "n": 30, "tag": "2023 · Q6", "q": "Who is considered the founder of classical conditioning?", "options": ["Sigmund Freud", "B.F. Skinner", "Ivan Pavlov", "John Watson"], "answer": 2, "rationale": "Ivan Pavlov discovered classical conditioning through his work with dogs.", "diff": 4}, {"chapter": 11, "n": 31, "tag": "2023 · Q68", "q": "Non-associative learning refers to learning that:", "options": ["Does not involve linking stimuli together", "Involves associating a response with a consequence", "Requires repeated exposure to a single stimulus", "Focuses on the internal mental processes during learning"], "answer": 0, "rationale": "Non-associative learning (habituation/sensitization) does not link two stimuli or a stimulus and response.", "diff": 1}, {"chapter": 11, "n": 32, "tag": "2023 · Q69", "q": "In operant conditioning, positive reinforcement involves:", "options": ["Presenting an unpleasant stimulus after an undesired behavior", "Removing a pleasant stimulus after an undesired behavior", "Presenting a pleasant stimulus after a desired behavior", "Removing an unpleasant stimulus after an undesired behavior"], "answer": 2, "rationale": "Positive reinforcement adds a pleasant stimulus to strengthen a desired behavior.", "diff": 4}, {"chapter": 11, "n": 33, "tag": "2024 · Q59", "q": "Non-associative learning refers to learning that:", "options": ["Does not involve linking stimuli together", "Involves associating a response with a consequence", "Requires repeated exposure to a single stimulus", "Focuses on the internal mental processes during learning"], "answer": 0, "rationale": "Non-associative learning does not link two stimuli or a stimulus and response.", "diff": 1}, {"chapter": 11, "n": 34, "tag": "2024 · Q60", "q": "In operant conditioning, reinforcement strengthens a behavior, while punishment weakens it. Positive reinforcement involves:", "options": ["Presenting an unpleasant stimulus after an undesired behavior", "Removing a pleasant stimulus after an undesired behavior", "Presenting a pleasant stimulus after a desired behavior", "Removing an unpleasant stimulus after an undesired behavior"], "answer": 2, "rationale": "Positive reinforcement adds a pleasant stimulus to strengthen a desired behavior.", "diff": 3}, {"chapter": 11, "n": 35, "tag": "2024 · Q67", "q": "Who is considered the founder of classical conditioning?", "options": ["Sigmund Freud", "B.F. Skinner", "Ivan Pavlov", "John Watson"], "answer": 2, "rationale": "Ivan Pavlov discovered classical conditioning.", "diff": 4}, {"chapter": 11, "n": 36, "tag": "2025 · Q9", "q": "Which type of reinforcement involves giving a reward after a desired behavior?", "options": ["Negative reinforcement", "Extinction", "Punishment", "Positive reinforcement"], "answer": 3, "rationale": "Positive reinforcement adds a pleasant stimulus after a behavior to make it more likely to recur.", "diff": 2}, {"chapter": 11, "n": 37, "tag": "2025 · Q20", "q": "A child observes and imitates peers' behavior. This is an example of:", "options": ["Attachment", "Social learning", "Cognitive development", "Moral reasoning"], "answer": 1, "rationale": "Learning by observing and imitating models is Bandura's social learning (observational learning).", "diff": 3}, {"chapter": 11, "n": 38, "tag": "2025 · Q24", "q": "A nurse repeatedly pairs a lollipop (neutral stimulus) with praise (UCS) to make a child smile (UCR). Eventually, the lollipop alone makes the child smile. The lollipop is now a:", "options": ["Reinforcer", "Unconditioned response", "Conditioned stimulus", "Unconditioned stimulus"], "answer": 2, "rationale": "In classical conditioning, a neutral stimulus paired with a UCS becomes a conditioned stimulus that evokes the response by itself.", "diff": 2}, {"chapter": 11, "n": 39, "tag": "2025 · Q31", "q": "A child cries when they see a nurse holding a syringe, even if no injection is given. This is an example of:", "options": ["Extinction", "Stimulus generalization", "Stimulus discrimination", "Spontaneous recovery"], "answer": 1, "rationale": "T vel hierarchy the needs are physiological, safety, belongingness, esteem and self-actualisation; cognition belongs only to the later expanded hierarchy.", "diff": 1}, {"chapter": 13, "n": 2, "tag": "2017 · Q50", "q": "In Maslow's hierarchy of needs, food, water, sleep, and to an extent, sex, are considered ______ motives?", "options": ["Safety", "Self-actualization", "Physiological", "Belongingness"], "answer": 2, "rationale": "Food, water, sleep and sex are physiological needs.", "diff": 1}, {"chapter": 13, "n": 3, "tag": "2017 · Q51", "q": "In order from lowest to highest, what are Maslow's five classes of needs?", "options": ["Social-esteem-physiological-safety-self actualization", "Physiological-safety-social-self actualization-social", "Physiological-safety-social-esteem-self actualization", "Self actualization-esteem-safety-social-physiological"], "answer": 2, "rationale": "Maslow's hierarchy from lowest to highest: physiological, safety, social/belonging, esteem, self-actualization.", "diff": 4}, {"chapter": 13, "n": 4, "tag": "2017 · Q52", "q": "According to Abraham Maslow, achievement, recognition and respect are included in?", "options": ["Self Actualization", "Belongingness", "Safety", "Esteem"], "answer": 3, "rationale": "Achievement, recognition and respect are esteem needs.", "diff": 1}, {"chapter": 13, "n": 5, "tag": "2017 · Q67", "q": "Which term is often used interchangeably with \"motivation\"?", "options": ["Personality", "Emotion", "Need", "Perception"], "answer": 2, "rationale": "\"Need\" is often used interchangeably with motivation, as needs drive motivated behavior.", "diff": 3}, {"chapter": 13, "n": 6, "tag": "2017 · Q68", "q": "Expectancy theory is the theory that comes under ______ theory.", "options": ["Process", "Content", "Attribution", "Perception"], "answer": 0, "rationale": "Expectancy theory is classified as a process theory of motivation.", "diff": 1}, {"chapter": 13, "n": 7, "tag": "2018 · Q61", "q": "Intrinsic motivation occurs when:", "options": ["Obligations or approval are factors", "There is no obvious external reward for one's behavior", "There are obvious external factors controlling behavior", "Extrinsic motivation is also high"], "answer": 1, "rationale": "Intrinsic motivation involves acting without an obvious external reward.", "diff": 2}, {"chapter": 13, "n": 8, "tag": "2018 · Q70", "q": "People do things (like work) for all different reasons. Some work for money, some for power, and some for satisfaction. Internal motivation that causes us to do something because we receive self-satisfaction is called:", "options": ["Humanistic", "Intrinsic", "Sociobiological", "Optimum arousal"], "answer": 1, "rationale": "Self-satisfaction-driven motivation from within is intrinsic motivation.", "diff": 2}, {"chapter": 13, "n": 9, "tag": "2019 · Q20", "q": "An individual's belief that he or she is capable of performing a task is called:", "options": ["Self importance", "Self efficacy", "Self worth", "None of them"], "answer": 1, "rationale": "Belief in one's capability to perform a task is self-efficacy.", "diff": 4}, {"chapter": 13, "n": 10, "tag": "2019 · Q59", "q": "______ theories explain why human needs change with time but not explain how they change?", "options": ["Process theories", "Content theories", "Reinforcement theories", "Reward theories"], "answer": 1, "rationale": "Content theories describe what motivates (needs) but not the process of change.", "diff": 4}, {"chapter": 13, "n": 11, "tag": "2019 · Q60", "q": "______ theories proposes that you can change someone's behavior by using reinforcement, punishment and extinction.", "options": ["Process theories", "Content theories", "Reinforcement theory", "Reward theories"], "answer": 2, "rationale": "Reinforcement theory explains behavior change through reinforcement, punishment and extinction.", "diff": 4}, {"chapter": 13, "n": 12, "tag": "2019 · Q62", "q": "______ theory is based on the idea that individuals are motivated by fairness.", "options": ["Process theory", "Equity theory", "Expectancy theory", "Goal-setting theory"], "answer": 1, "rationale": "Equity theory centers on perceived fairness in outcomes relative to input.", "diff": 1}, {"chapter": 13, "n": 13, "tag": "2019 · Q63", "q": "Vroom's ______ theory assumes that behavior results from conscious choices among alternatives whose purpose is to maximize pleasure and minimize pain.", "options": ["Process theory", "Equity theory", "Expectancy theory", "Goal-setting theory"], "answer": 2, "rationale": "Vroom's Expectancy theory describes motivated behavior as a conscious choice to maximize pleasure/minimize pain.", "diff": 2}, {"chapter": 13, "n": 14, "tag": "2019 · Q64", "q": "These are all the principles of goal setting theory except?", "options": ["Clarity", "Challenges", "Commitment", "Effort"], "answer": 3, "rationale": "The five principles are clarity, challenge, commitment, feedback and task complexity; effort is a mechanism through which goals work, not one of the principles.", "diff": 4}, {"chapter": 13, "n": 15, "tag": "2022 · Q30", "q": "Rewards we get for accomplishments from outside, like when you get a good grade you get a prize. This is an example of....", "options": ["Extrinsic motivation", "Intrinsic motivation", "Self-actualization", "Locus control"], "answer": 0, "rationale": "External rewards for accomplishments define extrinsic motivation.", "diff": 3}, {"chapter": 13, "n": 16, "tag": "2022 · Q33", "q": "These are all the principles of goal setting theory except?", "options": ["Clarity", "Challenges", "Commitment", "Effort"], "answer": 3, "rationale": "Clarity, challenge and commitment are core principles of goal-setting theory; effort is not one of the listed principles.", "diff": 4}, {"chapter": 13, "n": 17, "tag": "2022 · Q34", "q": "According to Abraham Maslow, achievement, recognition and respect are included in ______?", "options": ["Self-Actualization", "Belongingness", "Safety", "Esteem"], "answer": 3, "rationale": "Achievement, recognition and respect are esteem needs.", "diff": 1}, {"chapter": 13, "n": 18, "tag": "2023 · Q71", "q": "How can teachers apply motivation principles in the classroom?", "options": ["By focusing solely on extrinsic rewards", "By providing clear instructions and involving students in activities", "By offering a blend of extrinsic and intrinsic rewards", "By criticizing students' mistakes harshly"], "answer": 1, "rationale": "Clear instructions tell students what is expected, and involving them in activities builds engagement and ownership of learning, which are central principles of classroom motivation.", "diff": 4}, {"chapter": 13, "n": 19, "tag": "2024 · Q46", "q": "How can teachers apply motivation principles in the classroom?", "options": ["By focusing solely on extrinsic rewards", "By offering a blend of extrinsic and intrinsic rewards", "By providing clear instructions and involving students in activities", "By criticizing students' mistakes harshly"], "answer": 2, "rationale": "Clear instructions tell students what is expected, and involving them in activities builds engagement and ownership of learning, which are central principles of classroom motivation.", "diff": 4}, {"chapter": 13, "n": 20, "tag": "2025 · Q5", "q": "The ultimate goal of behavior in drive reduction theory is to achieve:", "options": ["Homeostasis", "Cognitive mastery", "Self-actualization", "Social approval"], "answer": 0, "rationale": "Hull's drive reduction theory holds that biological needs create tension (drive), and behavior aims to restore balance (homeostasis).", "diff": 2}, {"chapter": 13, "n": 21, "tag": "2025 · Q32", "q": "A hospitalized patient becomes irritable and drowsy when sleep is disrupted. According to drive reduction theory, this is:", "options": ["Safety instinct", "Social need", "Biological drive", "Learned coping"], "answer": 2, "rationale": "Sleep is a basic biological need; its deprivation creates a drive that motivates behavior to restore function pickFrom(pool, want, fallback, shuffle){
  let list=pool.slice(); if(shuffle) list.sort(()=>Math.random()-.5);
  if(want==='all') return list;
  want=+want;
  if(list.length>=want) return list.slice(0,want);
  const rest=fallback.filter(q=>!list.includes(q));
  rest.sort(()=>Math.random()-.5);
  return list.concat(rest.slice(0,want-list.length));
}

  <div class="intro glass"><div class="eyebrow">TA SERIES • NU254</div>
  <div class="big-no">${String(n).padStart(2,'0')}</div>
  <h2>${esc(c.title)}</h2>
  <p>${c.count} solved MCQs from past papers 2017–2025.${b!=null?' Your best score here is '+b+'%.':''}</p>
  <button class="btn grad liquid fill" onclick="startChapterDirect(${n})" style="margin-top:20px">📖 Start Chapter — All ${c.count} MCQs</button>
  <button class="btn outline liquid" onclick="renderChapterSetup(${n})" style="margin-top:12px">⚙️ Customise Test</button>
  <button class="btn plain" onclick="renderCover()">← Back</button></div>`;
  window.scrollTo(0,0);
}
function startChapterDirect(n){ chSetup={count:'all',diff:'all',year:'all',shuffle:false}; startChapter(n); }
function renderChapterSetup(n){
  const c=CHAPTERS.find(x=>x.n===n), b=best(n);
  const pool=byChapter(n).filter(q=>(chSetup.diff==='all'||q.diff===+chSetup.diff)&&(chSetup.year==='all'||(q.tag||'').startsWith(chSetup.year)));
  const counts=[10,20,30].filter(x=>x<c.count);
  const want=chSetup.count==='all'?pool.length:Math.min(+chSetup.count,c.count);
  document.getElementById('view').innerHTML = `
  <div class="intro glass"><div class="eyebrow">TA SERIES • NU254</div>
  <div class="big-no">${String(n).padStart(2,'0')}</div>
  <h2>${esc(c.title)}</h2>
  <p>${c.count} solved MCQs from past papers 2017–2025.${b!=null?' Your best score here is '+b+'%.':''}</p>
  ${chips('HOW MANY MCQs?', 'count', [...counts.map(x=>[String(x),String(x)]),['all','All '+c.count]], chSetup.count, 'setCh')}
  ${chips('DIFFICULTY', 'diff', [['all','All levels'],['1','Easy'],['2','Medium'],['3','Hard'],['4','Very Hard']], chSetup.diff, 'setCh')}
  ${chips('WHICH YEAR?', 'year', [['all','All years'],...yearsOf(byChapter(n)).map(y=>[y,y])], chSetup.year, 'setCh')}
  <div class="optlabel">SHUFFLE</div>
  <div class="optrows"><button class="optrow${chSetup.shuffle?' on':''}" onclick="toggleChShuffle()"><span>Shuffle questions · ${chSetup.shuffle?'On':'Off'}</span><span class="radio">${chSetup.shuffle?'✓':''}</span></button></div>
  <div class="setupinfo">You will get <b>${want} questions</b> · about <b>${want} minutes</b> (1 minute per question).${pool.length<want&&chSetup.count!=='all'?' Only '+pool.length+' match your filters, so the rest are mixed from this chapter.':''}</div>
  <div class="setupnote">Difficulty is set by the app to help you practise — the book does not mark it.</div>
  <button class="btn grad liquid fill" onclick="startChapter(${n})" style="margin-top:20px">Start Questions →</button>
  <button class="btn plain" onclick="renderCover()">← Back</button></div>`;
  window.scrollTo(0,0);
}
function renderMockSetup(){
  const b=best('mock');
  const pool=QS.filter(q=>(mockSetup.diff==='all'||q.diff===+mockSetup.diff)&&(mockSetup.year==='all'||(q.tag||'').startsWith(mockSetup.year)));
  const want=mockSetup.mode==='real'?70:mockSetup.mode==='quick'?20:pool.length;
  document.getElementById('view').innerHTML = `
  <div class="intro glass"><div class="eyebrow">TA SERIES • NU254</div>
  <div style="font-size:52px;margin-top:8px">🎯</div>
  <h2>Full Mock Test</h2>
  <p>All 490 solved MCQs from past papers 2017–2025.${b!=null?' Your best mock score is '+b+'%.':''}</p>
  ${chips('CHOOSE YOUR TEST', 'mode', [['real','Real Paper — 70 MCQs · 90 min'],['quick','Quick — 20 MCQs'],['full','Full — all 490 MCQs']], mockSetup.mode, 'setMock')}
  ${chips('DIFFICULTY', 'diff', [['all','All levels'],['1','Easy'],['2','Medium'],['3','Hard'],['4','Very Hard']], mockSetup.diff, 'setMock')}
  ${chips('WHICH YEAR?', 'year', [['all','All years'],...yearsOf(QS).map(y=>[y,y])], mockSetup.year, 'setMock')}
  <div class="optlabel">SHUFFLE</div>
  <div class="optrows"><button class="optrow${mockSetup.shuffle?' on':''}" onclick="toggleMockShuffle()"><span>Shuffle questions · ${mockSetup.shuffle?'On':'Off'}</span><span class="radio">${mockSetup.shuffle?'✓':''}</span></button></div>
  <div class="setupinfo">You will get <b>${want} questions</b>${mockSetup.mode==='real'?' · <b>90 minutes</b> on the clock, just like your real paper':''} · about <b>${want} minutes</b> of work.</div>
  <div class="setupnote">Difficulty is set by the app to help you practise — the book does not mark it.</div>
  <button class="btn grad liquid fill" onclick="startMock()" style="margin-top:20px">Start Mock Test →</button>
  <button class="btn plain" onclick="renderCover()">← Back</button></div>`;
  window.scrollTo(0,0);
}
let paperSetup={mode:'year',year:'2024'};
function setPaper(k,v){ paperSetup[k]=v; renderPaperSetup(); }
function openPaper(){
  document.getElementById('openerTitle').textContent='KMU Paper Practice';
  const op=document.getElementById('opener'); op.classList.add('show');
  setTimeout(()=>{ op.classList.remove('show'); renderPaperSetup(); }, 1150);
}
function renderPaperSetup(){
  const b=best('paper');
  const yearCount=paperSetup.mode==='year'?QS.filter(q=>(q.tag||'').startsWith(paperSetup.year)).length:490;
  document.getElementById('view').innerHTML = `
  <div class="intro glass"><div class="eyebrow">TA SERIES • NU254</div>
  <div style="font-size:52px;margin-top:8px">📝</div>
  <h2>KMU Paper Practice</h2>
  <p>Your real paper, online. 70 MCQs in 90 minutes.${b!=null?' Your best paper score is '+b+'%.':''}</p>
  ${chips('HOW DO YOU WANT IT?', 'mode', [['year','One full year'],['all','Shuffle all years']], paperSetup.mode, 'setPaper')}
  <div style="${paperSetup.mode==='all'?'opacity:.45;pointer-events:none':''}">${chips('WHICH YEAR?', 'year', [['2017','2017'],['2018','2018'],['2022','2022'],['2024','2024'],['2025','2025']], paperSetup.year, 'setPaper')}</div>
  <div class="setupinfo">You will get <b>70 questions</b> · <b>90 minutes</b> on the clock, just like your real paper.${paperSetup.mode==='year'&&yearCount<70?' Year '+paperSetup.year+' has only '+yearCount+' MCQs, so '+(70-yearCount)+' more will come from other years.':''}</div>
  <button class="btn grad liquid fill" onclick="startPaper()" style="margin-top:20px">Start Paper →</button>
  <button class="btn plain" onclick="renderCover()">← Back</button></div>`;
  window.scrollTo(0,0);
}
function startPaper(){
  const s=paperSetup;
  const pool=s.mode==='year'?QS.filter(q=>(q.tag||'').startsWith(s.year)):QS;
  const list=pickFrom(pool, 70, QS, true);
  cur={list,idx:0,score:0,title:'KMU Paper Practice — '+(s.mode==='year'?s.year:'All Years'),no:null,mode:'paper',setup:{...s},timeLimit:90*60,startTime:Date.now(),qStart:Date.now(),fast:0,wrong:[],answers:[],timerId:null};
  streak=0;
  renderQuiz();
}
function openMock(){
  document.getElementById('openerTitle').textContent='Full Mock Test';
  const op=document.getElementById('opener'); op.classList.add('show');
  setTimeout(()=>{ op.classList.remove('show'); renderMockSetup(); }, 1150);
}
function startChapter(n){
  const s=chSetup;
  const pool=byChapter(n).filter(q=>(s.diff==='all'||q.diff===+s.diff)&&(s.year==='all'||(q.tag||'').startsWith(s.year)));
  const list=pickFrom(pool, s.count, byChapter(n), s.shuffle);
  const c=CHAPTERS.find(x=>x.n===n);
  cur={list,idx:0,score:0,title:'Chapter '+n+' — '+c.title,no:n,mode:'chapter',setup:{...s},timeLimit:null,startTime:Date.now(),qStart:Date.now(),fast:0,wrong:[],answers:[],timerId:null};
  streak=0;
  renderQuiz();
}
function startMock(){
  const s=mockSetup;
  const pool=QS.filter(q=>(s.diff==='all'||q.diff===+s.diff)&&(s.year==='all'||(q.tag||'').startsWith(s.year)));
  const want=s.mode==='real'?70:s.mode==='quick'?20:'all';
  const list=pickFrom(pool, want, QS, s.shuffle);
  cur={list,idx:0,score:0,title:'Full Mock Test',no:null,mode:'mock',setup:{...s},timeLimit:s.mode==='real'?90*60:null,startTime:Date.now(),qStart:Date.now(),fast:0,wrong:[],answers:[],timerId:null};
  streak=0;
  renderQuiz();
}
function exitQuiz(){ if(cur&&cur.timerId) clearInterval(cur.timerId); renderCover(); }
function toggleSound(){ soundOn=!soundOn; const b=document.getElementById('sndbtn'); if(b) b.textContent=soundOn?'🔊':'🔇'; }
function renderQuiz(){
  if(cur.timerId) clearInterval(cur.timerId);
  const q=cur.list[cur.idx], letters=['A','B','C','D','E'];
  document.getElementById('view').innerHTML = `
  <div class="topbar"><button class="backbtn" onclick="exitQuiz()">‹ Back</button>
  <div class="chip"><b>${esc(cur.title)}</b><br><span style="font-size:11px;letter-spacing:2px">TA SERIES • NU254</span></div>
  <div class="scorepill"><span id="timer">⏱ 00:00</span> · <span id="scorepill">Score <b>${cur.score}</b>${streak>1?' &nbsp;🔥'+streak:''}</span></div>
  <button class="backbtn" id="sndbtn" onclick="toggleSound()">${soundOn?'🔊':'🔇'}</button></div>
  <div class="prog"><i style="width:${Math.round(cur.idx/cur.list.length*100)}%"></i></div>
  <div class="qcard glass">
    <span class="qtag">${esc(q.tag||'Past Paper')} &nbsp;•&nbsp; Q ${cur.idx+1} of ${cur.list.length}</span>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts" id="opts">
      ${q.options.map((o,i)=>`<button class="opt" style="animation-delay:${i*0.09}s" onclick="answer(${i},this)"><span class="letter">${letters[i]}</span><span>${esc(o)}</span><span class="mark"></span></button>`).join('')}
    </div>
    <div class="why" id="why"><b>Why?</b><p id="whytext"></p></div>
    <button class="next liquid fill" id="nextbtn" onclick="nextQ()">${cur.idx+1===cur.list.length?'See My Result →':'Next Question →'}</button>
  </div>`;
  window.scrollTo(0,0);
  cur.qStart=Date.now();
  cur.timerId=setInterval(()=>{
    const el=document.getElementById('timer');
    if(!el){ clearInterval(cur.timerId); return; }
    if(cur.timeLimit){
      const left=cur.timeLimit-Math.floor((Date.now()-cur.startTime)/1000);
      if(left<=0){ el.textContent='⏱ 00:00'; clearInterval(cur.timerId); renderResult(true); return; }
      el.textContent='⏱ '+fmtTime(left);
    } else {
      el.textContent='⏱ '+fmtTime(Math.floor((Date.now()-cur.startTime)/1000));
    }
  },1000);
}
function answer(i,btn){
  if(btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done='1';
  const q=cur.list[cur.idx];
  const opts=document.querySelectorAll('.opt');
  const correct=i===q.answer;
  const dt=Math.round((Date.now()-cur.qStart)/1000);
  if(dt<=10) cur.fast++;
  cur.answers.push({q,picked:i,ok:correct,dt});
  opts.forEach((o,j)=>{ o.style.pointerEvents='none'; });
  if(correct){
    streak++; cur.score++; beep(true);
    opts.forEach((o,j)=>{
      if(j===q.answer){ o.classList.add('correct'); o.querySelector('.mark').textContent='✓'; }
      else { o.style.transitionDelay=(0.08*(j+1))+'s'; o.classList.add('gone'); }
    });
    document.getElementById('whytext').textContent=(dt<=10?'⚡ Fast answer — '+dt+'s! ':'')+'Correct! '+q.rationale;
  } else {
    streak=0; beep(false);
    cur.wrong.push({q,picked:i});
    opts.forEach((o,j)=>{
      if(j===q.answer){ o.classList.add('correct'); o.querySelector('.mark').textContent='✓'; }
      else if(j===i){ o.classList.add('wrong'); o.querySelector('.mark').textContent='✗'; }
      else o.classList.add('dim');
    });
    document.getElementById('whytext').textContent='Not quite. The correct answer is '+['A','B','C','D','E'][q.answer]+'. '+q.rationale;
  }
  document.getElementById('scorepill').innerHTML='Score <b>'+cur.score+'</b>'+(streak>1?' &nbsp;🔥'+streak:'');
  document.querySelector('.prog i').style.width=Math.round((cur.idx+1)/cur.list.length*100)+'%';
  document.getElementById('why').classList.add('show');
  document.getElementById('nextbtn').classList.add('show');
  setTimeout(()=>{ const w=document.getElementById('why'); if(w&&w.scrollIntoView) w.scrollIntoView({behavior:'smooth',block:'center'}); },300);
}
function nextQ(){ cur.idx++; if(cur.idx>=cur.list.length) renderResult(false); else renderQuiz(); }
function renderResult(timeUp){
  if(cur.timerId) clearInterval(cur.timerId);
  const total=cur.list.length, pct=Math.round(cur.score/total*100);
  if(cur.no) saveBest(cur.no,pct); else saveBest(cur.mode==='paper'?'paper':'mock',pct);
  const secs=Math.round((Date.now()-cur.startTime)/1000);
  const avg=Math.round(secs/Math.max(1,total));
  let msg, emoji;
  if(pct>=80){ msg='Excellent! You really know this. Keep it up.'; emoji='🏆'; }
  else if(pct>=60){ msg='Good work! A little more reading and you will be excellent.'; emoji='🌟'; }
  else if(pct>=40){ msg="It's okay. You just haven't read this part properly yet. Read it once, then try again — you will do better."; emoji='📖'; }
  else { msg="Don't worry at all. It only means you haven't read this yet. Read the chapter once, then come back — you will see the difference."; emoji='💪'; }
  if(timeUp) msg='Time is up — the 90 minutes ended. '+msg;
  const byCh={};
  cur.answers.forEach(a=>{ const c=a.q.chapter; if(!byCh[c]) byCh[c]={total:0,correct:0}; byCh[c].total++; if(a.ok) byCh[c].correct++; });
  const chs=Object.keys(byCh).map(Number).sort((a,b)=>a-b);
  let weakest=null, weakestPct=101;
  chs.forEach(c=>{ const p=Math.round(byCh[c].correct/byCh[c].total*100); if(p<weakestPct){ weakestPct=p; weakest=c; } });
  const rows=chs.map(c=>{
    const st=byCh[c], p=Math.round(st.correct/st.total*100);
    const title=CHAPTERS.find(x=>x.n===c).title;
    const weak=c===weakest&&p<60;
    return `<div class="chrow" onclick="toggleChRow(${c})"><span><b>Chapter ${c} — ${esc(title)}</b><br>${st.total} MCQs came · ${st.correct} correct · ${p}% ${weak?'<span class="weak">· 📖 Read this chapter again</span>':''}</span><span>›</span></div><div class="chdetail" id="chd${c}" style="display:none"></div>`;
  }).join('');
  const C=(2*Math.PI*72).toFixed(1);
  const arc=((pct/100)*2*Math.PI*72).toFixed(1);
  document.getElementById('view').innerHTML = `
  <div style="padding:30px 0 0;text-align:center;position:relative;z-index:2"><div class="eyebrow">TA SERIES • NU254</div></div>
  <div class="result glass"><div style="font-size:56px">${emoji}</div><h2>${esc(cur.title)}</h2>
  <div class="ring-wrap"><svg width="180" height="180" viewBox="0 0 160 160"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7A1233"/><stop offset="100%" stop-color="#101D3A"/></linearGradient></defs><circle cx="80" cy="80" r="72" fill="none" stroke="#fbeef2" stroke-width="12"/><circle cx="80" cy="80" r="72" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${arc} ${C}"/></svg><div class="ring-num"><b>${pct}%</b><span>${cur.score} of ${total} correct</span></div></div>
  <p>${msg}</p>
  <div class="statgrid">
    <div class="stat">⏱ Time<b>${fmtTime(secs)}</b></div>
    <div class="stat">⚡ Fast answers<b>${cur.fast}</b></div>
    <div class="stat">Avg / question<b>${avg}s</b></div>
    <div class="stat">Wrong<b>${cur.wrong.length}</b></div>
  </div>
  ${weakest!=null&&weakestPct<60?`<p style="margin-top:14px"><b>📖 Weakest chapter: Chapter ${weakest}</b> — only ${weakestPct}% correct. Read it again first.</p>`:''}
  <div style="text-align:left;margin-top:16px"><div class="optlabel" style="margin-top:0">YOUR CHAPTERS — TAP TO SEE THE MCQs</div>${rows}</div>
  <button class="btn grad liquid fill" onclick="retry()">Try Again</button>
  <button class="btn plain" onclick="renderCover()">Back</button>
  <div class="foot" style="padding:14px 0 4px">© 2026 Tufail Ahmad · TA SERIES · Burgundy &amp; Navy</div></div>`;
  window.scrollTo(0,0);
}
function toggleChRow(c){
  const d=document.getElementById('chd'+c);
  if(!d) return;
  if(!d.dataset.built){
    const list=cur.answers.filter(a=>a.q.chapter===c);
    d.innerHTML=list.map(a=>`<div class="revq"><div class="rq">${esc(a.q.q)}</div>
    <div class="${a.ok?'rc':'ry'}">${a.ok?'✓ Your answer: ':'✗ Your answer: '}${esc(a.q.options[a.picked])}</div>
    ${a.ok?'':`<div class="rc">Correct answer: ${esc(a.q.options[a.q.answer])}</div>`}
    <div class="rr">Why? ${esc(a.q.rationale)}</div></div>`).join('');
    d.dataset.built='1';
  }
  d.style.display=d.style.display==='none'?'block':'none';
}
function retry(){ if(cur.mode==='mock'){ mockSetup=cur.setup; startMock(); } else if(cur.mode==='paper'){ paperSetup=cur.setup; startPaper(); } else { chSetup=cur.setup; chN=cur.no; startChapter(cur.no); } }
</script>
</body>
</html>
