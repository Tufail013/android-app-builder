<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Applied Developmental Psychology — TA SERIES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;color:#1c2b33;
background:linear-gradient(160deg,#eef7f0 0%,#e7f1ea 40%,#e6f2ee 75%,#fdf3e3 100%)}
/* soft floating plus signs instead of balls */
.plus{position:absolute;z-index:1;font-size:20px;color:rgba(14,154,92,.16);pointer-events:none;animation:orbFloat 5s ease-in-out infinite}
.p1{top:11%;left:6%}
.p2{top:36%;right:5%;animation-delay:1.5s;font-size:16px}
.p3{bottom:15%;left:8%;animation-delay:2.5s}
.p4{top:62%;right:8%;animation-delay:3.5s;font-size:15px;color:rgba(190,150,30,.18)}
/* liquid glass: blur + tint + border + shadow + specular highlight */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.28));
backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
border:1px solid rgba(255,255,255,.85);
box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),
9px 12px 28px rgba(90,110,150,.16),-6px -6px 18px rgba(255,255,255,.7);
border-radius:28px}
/* ---------- splash / intro ---------- */
#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
background:linear-gradient(180deg,#0d2b23,#0e523c 55%,#0a2e22);color:#fff;transition:opacity .6s,transform .6s}
#splash.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.cross{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:44px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.ecg{width:240px;height:56px;margin-top:26px}
.ecg path{stroke:#7cf2c8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.6s ease forwards .2s}
@keyframes draw{to{stroke-dashoffset:0}}
#splash h1{font-family:Georgia,serif;font-weight:400;font-size:38px;margin-top:22px;line-height:1.2}
#splash h1 span{color:#f2c94c}
#splash p{color:#cfe8d8;font-size:14px;line-height:1.7;margin-top:12px}
.enter{margin-top:30px;padding:15px 40px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);color:#fff;font-size:16px;font-weight:700;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.flo{position:absolute;font-size:26px;pointer-events:none;animation:orbFloat 4s ease-in-out infinite}
.f1{top:13%;left:11%;color:rgba(14,154,92,.45)}
.f2{top:21%;right:12%;animation-delay:1.2s;color:rgba(190,150,30,.5)}
.f3{bottom:19%;left:17%;animation-delay:2.2s;color:rgba(14,154,92,.35)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.minibook{width:126px;height:88px;position:relative;margin-top:26px;perspective:700px}
.mb-cover{position:absolute;inset:-7px -9px;background:linear-gradient(135deg,#177a58,#0b3d2e);border:2px solid #d4af37;border-radius:10px;box-shadow:0 16px 34px rgba(0,0,0,.4)}
.mb-page{position:absolute;top:0;width:63px;height:88px;background:#fffdf4;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.mb-page.right{right:0;border-radius:3px 9px 9px 3px;background:#f4efdb}
.mb-page.left{left:0;border-radius:9px 3px 3px 9px;transform-origin:right center;animation:mbturn 2s ease-in-out infinite}
@keyframes mbturn{0%,30%{transform:rotateY(0)}60%,100%{transform:rotateY(-168deg)}}
.loadbar{width:150px;height:5px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:22px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7cf2c8,#f2c94c);animation:load 1.8s ease forwards}
@keyframes load{to{width:100%}}
#splash h1{animation:fadeUp .8s ease both .1s}
#splash p{animation:fadeUp .8s ease both .25s}
#splash .enter{animation:fadeUp .8s ease both .45s,bob 1.6s ease-in-out .9s infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* ---------- clean top ---------- */
.cover{position:relative;z-index:2;padding:34px 22px 4px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:5px;color:#7a8a94;font-weight:700}
h1.big{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:42px;line-height:1.08;margin-top:12px;color:#16242c}
h1.big em{font-style:italic;background:linear-gradient(120deg,#0e9a5c,#14684c,#2f9e6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;color:#66788a;line-height:1.6;margin-top:10px}
.pills{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pill{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:#3c5566;
background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35));backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px rgba(90,110,150,.12)}
.pill b{color:#0b6e3f}
/* ---------- the shelf: one row of real books ---------- */
/* ---------- chapter cards grid (like the website) ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 16px 0;position:relative;z-index:2}
.gcard{position:relative;text-align:left;background:#dfe8e1;border:none;border-radius:22px;padding:16px 30px 16px 15px;cursor:pointer;box-shadow:7px 7px 14px rgba(120,145,130,.4),-7px -7px 14px rgba(255,255,255,.85);transition:transform .15s,box-shadow .25s;font-family:inherit}
.gcard:active{transform:scale(.97);box-shadow:inset 4px 4px 8px rgba(120,145,130,.35),inset -4px -4px 8px rgba(255,255,255,.8)}
.gcard.wide{grid-column:1/-1}
.gcard.kmu{background:linear-gradient(135deg,#0e7a4c,#0b3d2e);box-shadow:7px 7px 16px rgba(11,61,46,.4),-7px -7px 14px rgba(255,255,255,.7)}
.gcard.mock{background:linear-gradient(135deg,#d4af37,#8a6d1b);box-shadow:7px 7px 16px rgba(107,85,16,.4),-7px -7px 14px rgba(255,255,255,.7)}
.g-tag{display:block;font-size:10px;letter-spacing:2.5px;font-weight:800;color:#0b6e3f}
.gcard.kmu .g-tag{color:#7cf2c8}
.gcard.mock .g-tag{color:#fff}
.g-title{display:block;font-family:Georgia,serif;font-size:17px;line-height:1.3;color:#24332b;margin-top:6px}
.gcard.kmu .g-title,.gcard.mock .g-title{color:#fff}
.g-sub{display:block;font-size:12.5px;color:#5a6f63;margin-top:6px}
.gcard.kmu .g-sub{color:rgba(255,255,255,.78)}
.gcard.mock .g-sub{color:rgba(255,255,255,.88)}
.g-go{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:800;color:#0b6e3f}
.gcard.kmu .g-go,.gcard.mock .g-go{color:rgba(255,255,255,.9)}

.foot{text-align:center;color:#93a3ae;font-size:12px;padding:10px 22px 28px;line-height:1.6;position:relative;z-index:2}
.optrows{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#dfe8e1;border:none;border-radius:18px;padding:13px 15px;font-size:15px;font-weight:600;color:#3c4f45;cursor:pointer;box-shadow:6px 6px 12px rgba(120,145,130,.4),-6px -6px 12px rgba(255,255,255,.85);transition:box-shadow .25s,background .25s,transform .15s}
.optrow:active{transform:scale(.98)}
.optrow .radio{flex:0 0 24px;height:24px;border-radius:50%;background:#dfe8e1;box-shadow:inset 3px 3px 6px rgba(120,145,130,.45),inset -3px -3px 6px rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.optrow.on{background:#c9ecd6;box-shadow:inset 4px 4px 8px rgba(20,104,76,.22),inset -4px -4px 8px rgba(255,255,255,.6)}
.optrow.on .radio{background:linear-gradient(135deg,#0e9a5c,#14684c);box-shadow:0 3px 8px rgba(20,104,76,.4)}
.liquid{position:relative;overflow:hidden;isolation:isolate}
.liquid::before{content:"";position:absolute;left:0;top:-14%;width:100%;height:128%;z-index:-1;border-radius:48% 52% 0 0/28px 28px 0 0;background:linear-gradient(120deg,#0e9a5c,#14684c);transform:translateY(92%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
.liquid::after{content:"";position:absolute;left:14%;top:9px;width:40%;height:9px;z-index:-1;border-radius:99px;background:rgba(255,255,255,.4);opacity:0;transition:opacity .4s}
.liquid.on::before,.liquid.fill::before{transform:translateY(0)}
.liquid.on::after{opacity:1}
.liquid.fill::after{opacity:.28;left:auto;right:12%;top:50%;width:56px;height:22px;animation:liquidDrift 3.2s ease-in-out infinite}
@keyframes liquidDrift{0%,100%{transform:translate(0,-50%) scale(1)}50%{transform:translate(-16px,-50%) scale(1.3,.75)}}
.liquid:active{transform:scale(.97)}
.liquid:active::before{transform:translateY(0)}
.btn.outline{background:rgba(255,255,255,.7);border:1.5px solid #0e9a5c;color:#0b6e3f}
.optlabel{font-size:12px;letter-spacing:3px;color:#7a8a94;font-weight:700;margin-top:18px}
.setupinfo{font-size:13.5px;color:#66788a;margin-top:16px;line-height:1.6;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 14px}
.setupnote{font-size:12px;color:#93a3ae;margin-top:8px;line-height:1.5}
.topbar .scorepill{padding:7px 9px;font-size:12px}
.chrow{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:13px 15px;margin-top:9px;cursor:pointer;font-size:14.5px;line-height:1.45}
.chrow b{color:#16242c}
.chrow .weak{color:#b45309;font-weight:700}
.chdetail{text-align:left;margin-top:8px}
.revq{background:rgba(255,255,255,.8);border-radius:14px;padding:12px;margin-top:8px;font-size:14px;line-height:1.5}
.revq .rq{font-family:Georgia,serif;color:#16242c}
.revq .ry{color:#dc2626;margin-top:5px}
.revq .rc{color:#16a34a;margin-top:3px}
.revq .rr{color:#66788a;margin-top:5px;font-size:13.5px}
.statgrid{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.stat{padding:10px 13px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);font-size:12.5px;color:#66788a;line-height:1.5}
.stat b{display:block;font-size:16px;color:#16242c}
.wm{position:absolute;top:50%;z-index:1;writing-mode:vertical-rl;font-size:22px;letter-spacing:8px;font-weight:800;color:rgba(20,60,40,.07);pointer-events:none;white-space:nowrap}
.wm-l{left:3px;transform:translateY(-50%) rotate(180deg)}
.wm-r{right:3px;transform:translateY(-50%)}
#splash .wm{color:rgba(255,255,255,.09)}
/* ---------- book-opening overlay ---------- */
#opener{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.35);backdrop-filter:blur(6px)}
#opener.show{display:flex}
.openbook{width:250px;height:330px;position:relative;perspective:1200px;animation:zoomin .5s ease}
@keyframes zoomin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.openbook .pg{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:#fffdf4;box-shadow:0 24px 50px rgba(0,0,0,.45);transform-origin:left center;animation:pageturn 1s ease .35s forwards}
@keyframes pageturn{from{transform:rotateY(0)}to{transform:rotateY(-178deg)}}
.openbook .cov{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:linear-gradient(135deg,#14684c,#0b3d2e);border:2px solid #d4af37;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:18px}
.openbook .cov h3{font-family:Georgia,serif;font-size:21px;line-height:1.3;margin-top:10px}
.openbook .cov p{font-size:11px;letter-spacing:3px;color:#f2c94c;margin-top:10px}
/* ---------- chapter intro page ---------- */
.intro{margin:26px 16px;padding:34px 22px;text-align:center;position:relative;z-index:2;animation:pagein .5s ease}
.intro .big-no{font-family:Georgia,serif;font-size:74px;line-height:1;background:linear-gradient(120deg,#0e9a5c,#14684c,#2f9e6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h2{font-family:Georgia,serif;font-weight:400;font-size:26px;margin-top:12px;line-height:1.3;color:#16242c}
.intro p{color:#66788a;line-height:1.65;margin-top:10px;font-size:15px}
/* ---------- quiz: game feel ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:18px 16px 8px;position:relative;z-index:2}
.backbtn{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.4));backdrop-filter:blur(12px);color:#3c5566;border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,110,150,.14)}
.chip{flex:1;text-align:center;font-size:12.5px;color:#66788a;line-height:1.4}
.chip b{color:#16242c}
.scorepill{background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.4));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);color:#3c5566;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,110,150,.14)}
.scorepill b{color:#0b6e3f}
.prog{height:6px;background:rgba(255,255,255,.65);border-radius:20px;margin:8px 20px 16px;overflow:hidden;position:relative;z-index:2;box-shadow:inset 0 1px 3px rgba(90,110,150,.2)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#0e9a5c,#14684c,#2f9e6e);border-radius:20px;transition:width .4s}
.qcard{margin:2px 16px 18px;padding:22px 18px;position:relative;z-index:2;animation:pagein .45s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.qtag{display:inline-block;background:rgba(20,122,76,.12);color:#0b6e3f;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;margin-bottom:13px}
.qtext{font-family:Georgia,serif;font-size:20px;line-height:1.55;color:#16242c}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border:1.5px solid rgba(255,255,255,.9);border-radius:20px;padding:14px;font-size:16px;line-height:1.45;cursor:pointer;color:#1c2b33;transition:transform .45s,opacity .45s,background .25s,border-color .25s,box-shadow .25s;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,110,150,.1);animation:optin .45s ease both}
@keyframes optin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.opt:active{transform:scale(.98)}
.opt .letter{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b6e3f;font-size:14px;box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(90,110,150,.15)}
.opt.correct{background:linear-gradient(135deg,#d9f7e3,#b8f0cd);border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25),0 12px 26px rgba(34,197,94,.3);animation:win .55s ease}
.opt.correct .letter{background:#22c55e;color:#fff}
.opt.wrong{background:linear-gradient(135deg,#fdecea,#fadbd8);border-color:#ef4444;animation:shake .35s ease}
.opt.wrong .letter{background:#ef4444;color:#fff}
.opt.dim{opacity:.35}
.opt.gone{opacity:0;transform:scale(.82) translateY(12px);pointer-events:none}
@keyframes win{0%{transform:scale(1)}35%{transform:scale(1.05)}60%{transform:scale(1.02)}100%{transform:scale(1.03)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mark{margin-left:auto;font-size:19px;font-weight:800}
.correct .mark{color:#16a34a}.wrong .mark{color:#dc2626}
.why{margin-top:16px;background:rgba(255,248,220,.8);border:1px solid rgba(220,190,90,.5);border-radius:18px;padding:14px;display:none}
.why.show{display:block;animation:pagein .35s ease}
.why b{color:#7a5c00;font-size:14px}
.why p{margin-top:6px;font-size:15px;line-height:1.6;color:#4a3f10}
.next{width:100%;margin-top:16px;padding:15px;border:none;border-radius:999px;background:linear-gradient(120deg,#0e9a5c,#14684c);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:none;box-shadow:0 10px 24px rgba(20,104,76,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.next.show{display:block}
.result{margin:22px 16px;padding:30px 22px;text-align:center;position:relative;z-index:2;animation:pagein .45s ease}
.result h2{font-family:Georgia,serif;font-weight:400;font-size:25px;margin-top:8px;line-height:1.35;color:#16242c}
.result .pct{font-size:46px;font-weight:800;margin-top:12px;background:linear-gradient(120deg,#0e9a5c,#14684c,#2f9e6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.result p{color:#66788a;line-height:1.65;margin-top:9px;font-size:15px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.grad{background:linear-gradient(120deg,#0e9a5c,#14684c);color:#fff;box-shadow:0 10px 24px rgba(20,104,76,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.plain{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.45));color:#3c5566;border:1px solid rgba(255,255,255,.85)}

/* ---------- TA SERIES Burgundy & Navy — RICH ---------- */
#app{color:#101D3A;background:linear-gradient(180deg,#f4f0f7 0%,#eef1fa 220px,#eef1fa 100%)}
.plus{color:rgba(122,10,40,.14)}
.glass{background:#fff;border:1px solid #e6e9f5;border-radius:22px;box-shadow:0 12px 32px rgba(22,33,62,.10)}
.topbar2{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#7A1233,#5c0d26);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 6px 16px rgba(122,10,40,.35)}
.brand{font-size:20px;font-weight:900;color:#101D3A;letter-spacing:.02em}
.brand-pill{margin-left:auto;background:linear-gradient(135deg,#7A1233,#5c0d26);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:7px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(122,10,40,.30)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#7A1233 0%,#7A1233 45%,#101D3A 100%);border-radius:26px;padding:26px 22px 24px;box-shadow:0 16px 36px rgba(22,33,62,.28)}
.hero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10);top:-90px;right:-60px}
.hero::after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-70px;left:-40px}
.hero>*{position:relative;z-index:1}
.hero-badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.30);color:#fff;font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px}
.hero-h{font-size:48px;line-height:1.0;font-weight:900;margin:16px 0 10px;color:#fff}
.hero-h .b{color:#fff}
.hero-h .n{color:#f3c1cf}
.hero p{color:rgba(255,255,255,.88);font-size:15px;line-height:1.55}
.hero-btns{display:flex;gap:10px;margin-top:18px}

aham Maslow is a key humanistic psychologist.", "diff": 3}, {"chapter": 1, "n": 5, "tag": "2017 · Q58", "q": "Who is considered the father of behaviorism?", "options": ["John B. Watson", "Ivan Pavlov", "B.F. Skinner", "Edward Thorndike"], "answer": 0, "rationale": "John B. Watson is considered the father of behaviorism.", "diff": 4}, {"chapter": 1, "n": 6, "tag": "2017 · Q65", "q": "Client (patient) centered therapy is included in?", "options": ["Psychoanalytic theory", "Behavioral theory", "Humanistic theory", "Gestalt theory"], "answer": 2, "rationale": "Carl Rogers' client-centred therapy is a humanistic approach, based on empathy, genuineness and unconditional positive regard.", "diff": 4}, {"chapter": 1, "n": 7, "tag": "2017 · Q66", "q": "Behavioral modification is a type of?", "options": ["Behavior therapy", "Cognitive therapy", "Humanistic therapy", "Client centered therapy"], "answer": 0, "rationale": "Behavior modification is a form of behavior therapy.", "diff": 1}, {"chapter": 1, "n": 8, "tag": "2018 · Q11", "q": "Dr. Usman studies the diagnosis, causes, treatments and prevention of mental illnesses. Which type of psychologist is Dr. Usman?", "options": ["Clinical psychologist", "Developmental psychologist", "Forensic psychologist", "Health psychologist"], "answer": 0, "rationale": "Diagnosing and treating mental illness is the domain of clinical psychology.", "diff": 1}, {"chapter": 1, "n": 9, "tag": "2018 · Q20", "q": "The ______ focuses on thought processes and the behavior that reflects those processes.", "options": ["psychoanalytic perspective", "learning perspective", "cognitive perspective", "contextual perspective"], "answer": 2, "rationale": "The cognitive perspective studies thought processes and resulting behavior.", "diff": 2}, {"chapter": 1, "n": 10, "tag": "2018 · Q33", "q": "Teaching-Learning process is fundamentally completed in:", "options": ["Class-room", "School", "Society", "Home"], "answer": 0, "rationale": "The classroom is where planned teaching and learning interaction between teacher and learners takes place, so it is the centre of the teaching-learning process.", "diff": 2}, {"chapter": 1, "n": 11, "tag": "2018 · Q66", "q": "Psychology is defined as the science of:", "options": ["Sensation and perception", "Experience and mental illness", "Culture and group dynamics", "Behavior and mental processes"], "answer": 3, "rationale": "Psychology is defined as the scientific study of behavior and mental processes.", "diff": 4}, {"chapter": 1, "n": 12, "tag": "2018 · Q67", "q": "Who is considered the \"father of psychology\" for establishing the first psychology lab?", "options": ["Wilhelm Wundt", "William James", "Sigmund Freud", "E. B. Titchener"], "answer": 0, "rationale": "Wilhelm Wundt established the first psychology laboratory.", "diff": 2}, {"chapter": 1, "n": 13, "tag": "2018 · Q69", "q": "Who developed REBT (Rational Emotive Behavior Therapy)?", "options": ["George Kelly", "John Dollard", "Albert Ellis", "Neal Miller"], "answer": 2, "rationale": "Albert Ellis developed Rational Emotive Behavior Therapy.", "diff": 2}, {"chapter": 1, "n": 14, "tag": "2019 · Q24", "q": "Who suggested that all behaviors are a result of the learning process?", "options": ["Erik Erikson", "Abraham Maslow", "John B. Watson", "Sigmund Freud"], "answer": 2, "rationale": "John B. Watson, founder of behaviorism, held that behavior is learned.", "diff": 2}, {"chapter": 1, "n": 15, "tag": "2019 · Q54", "q": "Who is considered the father of behaviorism?", "options": ["John B. Watson", "Ivan Pavlov", "F. Skinner", "Edward Thorndike"], "answer": 0, "rationale": "John B. Watson is considered the father of behaviorism.", "diff": 4}, {"chapter": 1, "n": 16, "tag": "2019 · Q65", "q": "Abraham Maslow and Carl Rogers were the founders of the ______ approach.", "options": ["Developmental approach", "Biological approach", "Humanistic approach", "Socio-cultural approach"], "answer": 2, "rationale": "Maslow and Rogers founded humanistic psychology.", "diff": 4}, {"chapter": 1, "n": 17, "tag": "2022 · Q22", "q": "One of the following is a humanistic psychologist?", "options": ["Sigmund Freud", "Abraham Maslow", "John Watson", "B.F. Skinner"], "answer": 1, "rationale": "Abraham Maslow is a leading humanistic psychologist.", "diff": 4}, {"chapter": 1, "n": 18, "tag": "2022 · Q37", "q": "Who is considered as the \"Father of", "options": ["Wilhelm Wundt", "Jean Piaget", "Sigmund Freud", "William James"], "answer": 0, "rationale": "Wilhelm Wundt is considered the father of psychology for founding the first psychology lab.", "diff": 2}, {"chapter": 1, "n": 19, "tag": "2022 · Q38", "q": "Client (patient) centered therapy is included in?", "options": ["Psychoanalytic theory", "Behavioral theory", "Humanistic theory", "Gestalt theory"], "answer": 2, "rationale": "Carl Rogers' client-centered therapy is a humanistic approach.", "diff": 4}, {"chapter": 1, "n": 20, "tag": "2022 · Q39", "q": "\"Change your thoughts: change your life\" is used in psychology for....", "options": ["Psychodynamic perspective", "Behavioral perspective", "Cognitive perspective", "Biological perspective"], "answer": 2, "rationale": "This slogan reflects the cognitive perspective's focus on thoughts shaping behavior/experience.", "diff": 4}, {"chapter": 1, "n": 21, "tag": "2022 · Q40", "q": "______ can be defined as the scientific study of behavior, cognition, emotions and mental processes.", "options": ["Cognitivism", "Behaviorism", "Psychology", "Sociology"], "answer": 2, "rationale": "This is the standard definition of psychology.", "diff": 1}, {"chapter": 1, "n": 22, "tag": "2022 · Q44", "q": "Dr. Naila is a cognitive psychologist. She is probably most interested in which of the following?", "options": ["How people process information", "Cultural variation in behavior", "The causes of psychological disorders", "Change and consistency in behavior"], "answer": 0, "rationale": "Cognitive psychologists focus on how people process  "tag": "2025 · Q29", "q": "Which hormone is associated with feelings of bonding, trust, and love in the Biological Perspective?", "options": ["Adrenaline", "Oxytocin", "Dopamine", "Cortisol"], "answer": 1, "rationale": "Oxytocin, the 'bonding hormone', supports attachment, trust and affection.", "diff": 3}, {"chapter": 1, "n": 29, "tag": "2025 · Q38", "q": "A colleague is critical and argumentative with team members. This reflects:", "options": ["Low Conscientiousness", "High Neuroticism", "High Extraversion", "Low Agreeableness"], "answer": 3, "rationale": "In the Big Five model, criticism and argumentativeness reflect low agreeableness.", "diff": 1}, {"chapter": 1, "n": 30, "tag": "2025 · Q43", "q": "A patient sleeps little, talks fast, and spends money impulsively. This phase is likely:", "options": ["Anxiety episode", "Psychotic episode", "Manic episode", "Depressive episode"], "answer": 2, "rationale": "Decreased need for sleep, pressured speech and reckless spending are typical of a manic episode.", "diff": 3}, {"chapter": 1, "n": 31, "tag": "2025 · Q46", "q": "A nurse is interested in understanding why a patient with schizophrenia experiences hallucinations. Which branch of psychology would be most relevant?", "options": ["Abnormal/Clinical Psychology", "Social Psychology", "Educational Psychology", "Developmental Psychology"], "answer": 0, "rationale": "Abnormal (clinical) psychology studies the causes and symptoms of mental disorders such as schizophrenia.", "diff": 4}, {"chapter": 1, "n": 32, "tag": "2025 · Q47", "q": "A patient with MDD has suicidal thoughts. The nurse's priority is:", "options": ["Refer to a dietician", "Encourage socialization", "Assess suicide risk", "Provide sleep aids"], "answer": 2, "rationale": "Safety comes first: the nurse must assess the level of suicide risk (plan, intent, means) immediately.", "diff": 3}, {"chapter": 2, "n": 1, "tag": "2017 · Q35", "q": "______ used free association to gain insight into the client's unconscious?", "options": ["Jean Piaget", "Sigmund Freud", "Erik Erikson", "Albert Bandura"], "answer": 1, "rationale": "Sigmund Freud developed and used free association in psychoanalysis.", "diff": 1}, {"chapter": 2, "n": 2, "tag": "2017 · Q36", "q": "According to Sigmund Freud, the \"actual events in a dream\" are the?", "options": ["Latent content", "Manifest content", "Dream analysis", "Free association"], "answer": 1, "rationale": "The manifest content is the dream's actual/surface content; latent content is its hidden meaning.", "diff": 4}, {"chapter": 2, "n": 3, "tag": "2017 · Q38", "q": "What is the Id?", "options": ["Part of the psyche that controls impulses", "Part of the psyche that reduces anxiety", "A description of innate instinctual needs", "Part of the psyche that controls our morals"], "answer": 2, "rationale": "The id represents innate, instinctual needs and drives.", "diff": 4}, {"chapter": 2, "n": 4, "tag": "2017 · Q41", "q": "Systematic change in the mental processes that underlie all learning and performance is referred to as?", "options": ["Cognitive Development", "Social Emotional Development", "Intellectual Development", "Moral Maturation"], "answer": 0, "rationale": "Cognitive development is the systematic change in mental processes such as thinking, memory and reasoning that underlie learning and performance.", "diff": 4}, {"chapter": 2, "n": 5, "tag": "2017 · Q42", "q": "According to Piagetian theory, cognitive development is influenced by all of the following except?", "options": ["Perception", "Reasoning", "Verbal facilities", "Language"], "answer": 3, "rationale": "Piaget named maturation, experience, social transmission and equilibration as the factors influencing cognitive development; in his view thought precedes and determines language, so language itself is not one of those factors.", "diff": 4}, {"chapter": 2, "n": 6, "tag": "2017 · Q44", "q": "Piaget's principle is related to a child's?", "options": ["Psychological development", "Emotional feelings", "Cognitive development", "Physical development"], "answer": 2, "rationale": "Piaget's theory is a theory of cognitive development.", "diff": 3}, {"chapter": 2, "n": 7, "tag": "2018 · Q3", "q": "Who gives more stress to the philosophy of social constructivism?", "options": ["Piaget", "Kohlberg", "Vygotsky", "Dewey"], "answer": 2, "rationale": "Vygotsky's theory emphasizes social constructivism.", "diff": 3}, {"chapter": 2, "n": 8, "tag": "2018 · Q7", "q": "Which indicates the change in the quality or character of a child?", "options": ["Growth", "Development", "Learning", "Environment"], "answer": 1, "rationale": "Development refers to qualitative changes; growth refers to quantitative (size) changes.", "diff": 2}, {"chapter": 2, "n": 9, "tag": "2018 · Q9", "q": "According to Sigmund Freud, what is the correct order of the five psychosexual stages of development?", "options": ["Oral, Anal, Phallic, Early, Genital", "Oral, Anal, Phallic, Latency, Genital", "Anal, Phallic, Latency, Genital, Oral", "Genital, Oral, Latency, Phallic, Anal"], "answer": 1, "rationale": "Freud's stages in order: oral, anal, phallic, latency, genital.", "diff": 4}, {"chapter": 2, "n": 10, "tag": "2018 · Q10", "q": "The correct order of the three stages of human prenatal development is:", "options": ["Embryo, zygote, fetus", "Placental, umbilical, embryonic", "Zygote, embryo, fetus", "Embryonic, placental, umbilical"], "answer": 2, "rationale": "Prenatal development proceeds zygote, embryo, then fetus.", "diff": 3}, {"chapter": 2, "n": 11, "tag": "2018 · Q13", "q": "After Nadia learned that penguins can't fly, she had to modify her existing concept of birds. This best illustrates the process of:", "options": ["Conservation", "Attachment", "Assimilation", "Accommodation"], "answer": 3, "rationale": "Modifying an existing schema to fit new information is accommodation.", "diff": 2}, {"chapter": 2, "n": 12, "tag": "2018 · Q15", "q": "Each cell of the body has how many chromosomes?", "options": ["12", "24", "54", "46"], "answer": 3, "rationale": "Human cells normally contain 46 chromosomes.", "diff": 3}, {"chapter": 2, "n": 13, "tag": "2018 · Q16", "q": "The correct sequence of Piaget's stages of cognitive development is:", "options": ["Preoperational, sensorimotor, concrete operational, formal operational", "Preoperational, concrete operational, sensorimotor, formal operational", "Sensorimotor, preoperational, concrete operational, formal operational", "Concrete operational, sensorimotor, formal operational, preoperational"], "answer": 2, "rationale": "Piaget's stage order is sensorimotor, preoperational, concrete operational, formal operational.", "diff": 3}, {"chapter": 2, "n": 14, "tag": "2018 · Q18", "q": "______ inborn traits or characteristics inherited from the biological parents.", "options": ["Maturation", "Environments", "culture", "heredity"], "answer": 3, "rationale": "Heredity refers to inborn traits inherited from parents.", "diff": 3}, {"chapter": 2, "n": 15, "tag": "2018 · Q19", "q": "Which of the following is the best research method for developmental psychologists?", "options": ["Case study", "Experiment", "Longitudinal study", "Cross-sectional"], "answer": 2, "rationale": "Longitudinal studies track the same individuals over time, ideal for studying development.", "diff": 1}, {"chapter": 2, "n": 16, "tag": "2018 · Q22", "q": "The raw material of thinking is?", "options": ["Symbols", "Semantics", "Man", "Child"], "answer": 0, "rationale": "Symbols are considered the raw material used in thought.", "diff": 1}, {"chapter": 2, "n": 17, "tag": "2018 · Q23", "q": "What is the unit of heredity?", "options": ["Chromosome", "Gene", "Zygote", "fertilized cell"], "answer": 1, "rationale": "The gene is the basic unit of heredity.", "diff": 3}, {"chapter": 2, "n": 18, "tag": "2018 · Q27", "q": "What is meant by \"Schema\"?", "options": ["Chunking mechanisms", "Learning techniques", "Organized packets of information stored in long-term memory", "Defense mechanisms"], "answer": 2, "rationale": "A schema is an organized packet of information/knowledge structure stored in long-term memory.", "diff": 1}, {"chapter": 2, "n": 19, "tag": "2018 · Q28", "q": "How many stages of cognitive development are recommended by Piaget?", "options": ["Seven stages", "Six stages", "Four Stages", "Two Stages"], "answer": 2, "rationale": "Piaget proposed four stages of cognitive development.", "diff": 3}, {"chapter": 2, "n": 20, "tag": "2018 · Q30", "q": "The process of expansion of an individual's capacities quantitatively should be termed as:", "options": ["Development", "Growth", "Equilibration", "Maturation"], "answer": 1, "rationale": "Growth refers to quantitative expansion of capacities/size.", "diff": 1}, {"chapter": 2, "n": 21, "tag": "2018 · Q35", "q": "Who is the father of genetic epistemology?", "options": ["Piaget", "Bruner", "Vygotsky", "Dewey"], "answer": 0, "rationale": "Jean Piaget is known as the father of genetic epistemology.", "diff": 2}, {"chapter": 2, "n": 22, "tag": "2018 · Q44", "q": "______ is the total number of people born and living at about the same time.", "options": ["therapy", "class", "generation", "peer group", "gang"], "answer": 2, "rationale": "A generation is a group of people born and living around the same time period.", "diff": 2}, {"chapter": 2, "n": 23, "tag": "2018 · Q45", "q": "All of the following are periods of prenatal development except:", "options": ["germinal", "embryonic", "fetal", "Postpartum"], "answer": 3, "rationale": "Postpartum is after birth, not a period of prenatal", "diff": 2}, {"chapter": 2, "n": 24, "tag": "2018 · Q47", "q": "Lack of prenatal care increases the risk of all of the following except:", "options": ["infants with low birth weight", "child abuse", "increased infant mortality", "preterm births"], "answer": 1, "rationale": "Child abuse is not directly caused by lack of prenatal care; the others are.", "diff": 1}, {"chapter": 2, "n": 25, "tag": "2018 · Q49", "q": "Erikson's psychosocial theory:", "options": ["is a behavioral theory of development", "is a stage theory of development", "is a systems theory", "is widely used in psychiatric treatments"], "answer": 1, "rationale": "Erikson's theory is a stage theory of psychosocial", "diff": 1}, {"chapter": 2, "n": 26, "tag": "2019 · Q10", "q": "What is Id?", "options": ["Part of the psyche that controls impulses", "Part of the psyche that reduces anxiety", "A description of innate instinctual needs", "Part of the psyche that controls our morals"], "answer": 2, "rationale": "The id represents innate, instinctual needs.", "diff": 4}, {"chapter": 2, "n": 27, "tag": "2019 · Q11", "q": "According to Piaget, the cognitive process that interprets new information in light of existing schemas is known as:", "options": ["Conservation", "Assimilation", "Accommodation", "object permanence"], "answer": 1, "rationale": "Fitting new information into existing schemas is assimilation.", "diff": 2}, {"chapter": 2, "n": 28, "tag": "2019 · Q14", "q": "Dr. Sigmund Freud was born in:", "options": ["1939", "1856", "1866", "1851"], "answer": 1, "rationale": "Sigmund Freud was born in 1856.", "diff": 3}, {"chapter": 2, "n": 29, "tag": "2019 · Q32", "q": "Systematic change in the mental processes that underlie all learning and performance is referred to as?", "options": ["Moral Maturation", "Cognitive Development", "Social Emotional Development", "Intellectual Development"], "answer": 1, "rationale": "Systematic change in mental processes underlying learning and performance is cognitive development.", "diff": 4}, {"chapter": 2, "n": 30, "tag": "2019 · Q37", "q": "Jenny blocks her bad memories of school bullies from her mind. This is an example of what defense mechanism?", "options": ["Denial", "Reaction Formation", "Projection", "Repression"], "answer": 3, "rationale": "Unconsciously blocking unpleasant memories from awareness is repression.", "diff": 4}, {"chapter": 2, "n": 31, "tag": "2019 · Q43", "q": "According to Piagetian theory, cognitive development is influenced by all of the following except:", "options": ["Perception", "Reasoning", "Verbal facilities", "Language"], "answer": 3, "rationale": "Piaget's factors are maturation, experience, social interaction and equilibration, and he held that language follows cognitive development rather than driving it, so language is the exception.", "diff": 1}, {"chapter": 2, "n": 32, "tag": "2019 · Q45", "q": "Piaget's principle is related to a child's?", "options": ["Psychological development", "Emotional feelings", "Cognitive development", "Physical development"], "answer": 2, "rationale": "Piaget's theory is a theory of cognitive development.", "diff": 3}, {"chapter": 2, "n": 33, "tag": "2022 · Q20", "q": "Which is the best colloquial translation of the ego and the id?", "options": ["I and it", "Self and not self", "Conscious and unconscious", "Reason and passion"], "answer": 0, "rationale": "Freud's original German terms (\"Ich\" and \"Es\") translate colloquially as \"I\" and \"it\".", "diff": 3}, {"chapter": 2, "n": 34, "tag": "2022 · Q23", "q": "The Id is the part of our personality which is made of ______ drives.", "options": ["Basics", "Instinctual", "Conscious", "Unconscious"], "answer": 1, "rationale": "The id operates on instinctual drives.", "diff": 4}, {"chapter": 2, "n": 35, "tag": "2022 · Q31", "q": "In Freud's view, development is which one of the following type process.", "options": ["Automatic", "Continuous", "Discontinuous", "Loose"], "answer": 2, "rationale": "Freud's stage theory is a discontinuous (stage-based) process.", "diff": 4}, {"chapter": 2, "n": 36, "tag": "2022 · Q32", "q": "Erik Erikson's theory states that if a person does not resolve a conflict within a stage, they will not acquire the life stage virtue, but will be able to move on to the next stage of development. Do you agree with this statement?", "options": ["Strongly agree", "Strongly disagree", "Somehow agree", "Somehow disagree"], "answer": 0, "rationale": "In Erikson's theory a person still moves on to the next stage when a conflict is unresolved, but without gaining that stage's virtue, which must be worked through later.", "diff": 1}, {"chapter": 2, "n": 37, "tag": "2022 · Q35", "q": "Which of these is NOT one of the \"life stage virtues\" of development according to Erik Erikson?", "options": ["Hope", "Honesty", "Love", "Wisdom"], "answer": 1, "rationale": "Erikson's virtues include hope, love and wisdom (among others); honesty is not one of his named stage virtues.", "diff": 4}, {"chapter": 2, "n": 38, "tag": "2022 · Q41", "q": "______ used free association to gain insight into the client's unconscious.", "options": ["Jean Piaget", "Sigmund Freud", "Erik Erikson", "Albert Bandura"], "answer": 1, "rationale": "Sigmund Freud developed free association, using a patient's uncensored thoughts to gain insight into the unconscious.", "diff": 2}, {"chapter": 2, "n": 39, "tag": "2022 · Q42", "q": "According to Sigmund Freud, \"hidden messages in the dream\" are?", "options": ["Latent content", "Manifest content", "Dream analysis", "Free association"], "answer": 0, "rationale": "In Freud's dream theory the latent content is the hidden, symbolic meaning beneath the dream's remembered surface story.", "diff": 1}, {"chapter": 2, "n": 40, "tag": "2022 · Q43", "q": "According to the structural theory of Sigmund Freud, the Id is?", "options": ["Part of the psyche that controls impulses", "Part of the psyche that reduces anxiety", "A description of innate instinctual needs", "Part of the psyche that controls our morals"], "answer": 2, "rationale": "The id represents innate, instinctual needs.", "diff": 3}, {"chapter": 2, "n": 41, "tag": "2022 · Q46", "q": "According to developmentalists, the primary cause of developmental change is.....", "options": ["Learning", "Maturation", "Experience", "Both A & B"], "answer": 3, "rationale": "Developmentalists generally attribute change to both learning and maturation together.", "diff": 3}, {"chapter": 2, "n": 42, "tag": "2022 · Q59", "q": "______ is preventing painful thoughts from entering consciousness?", "options": ["Repression", "Regression", "Rationalization", "Compensation"], "answer": 0, "rationale": "Repression keeps painful thoughts out of conscious awareness.", "diff": 2}, {"chapter": 2, "n": 43, "tag": "2023 · Q1", "q": "What is the main premise of psychoanalysis?", "options": ["Behavior is determined solely by genetics", "Behavior is determined solely by environmental factors", "Behavior is influenced by unconscious motives and conflicts", "Behavior is a result of conscious decision-making"], "answer": 2, "rationale": "Psychoanalysis holds that unconscious motives and conflicts drive behavior.", "diff": 4}, {"chapter": 2, "n": 44, "tag": "2023 · Q2", "q": "Who is considered the founder of psychoanalysis?", "options": ["B.F. Skinner", "Sigmund Freud", "Ivan Pavlov", "Carl Rogers"], "answer": 1, "rationale": "Sigmund Freud founded psychoanalysis.", "diff": 2}, {"chapter": 2, "n": 45, "tag": "2023 · Q3", "q": "According to Freud, which component of the mind operates on the pleasure principle?", "options": ["Ego", "Superego", "Id", "Ego Ideal"], "answer": 2, "rationale": "The id seeks immediate gratification under the pleasure principle.", "diff": 2}, {"chapter": 2, "n": 46, "tag": "2023 · Q4", "q": "What term did Freud use to describe the process by which thoughts or impulses are kept out of conscious awareness?", "options": ["Repression", "Regression", "Rationalization", "Sublimation"], "answer": 0, "rationale": "Repression pushes unwanted thoughts out of conscious awareness.", "diff": 3}, {"chapter": 2, "n": 47, "tag": "2023 · Q12", "q": "Sigmund Freud's theory of psychosexual development is based on the idea that:", "options": ["Children are driven by a need for social interaction", "Cognitive development is the most important factor in personality", "Sexual energy is a key motivator in human behavior", "Children are driven by a need of family interaction"], "answer": 2, "rationale": "Freud's theory centers on sexual (libidinal) energy as a key motivator.", "diff": 3}, {"chapter": 2, "n": 48, "tag": "2023 · Q16", "q": "The id is the part of our personality which is made of ______ drives.", "options": ["Basic", "unconscious", "Conscious", "Instinctual"], "answer": 3, "rationale": "The id is the primitive, instinctual part of personality, driven by basic biological urges and governed by the pleasure principle.", "diff": 4}, {"chapter": 2, "n": 49, "tag": "2023 · Q21", "q": "Which theorist emphasized \"psychosocial crises\" across development stages, including trust vs. mistrust and industry vs. inferiority?", "options": ["Erik Erikson", "Jean Piaget", "Lawrence Kohlberg", "Lev Vygotsky"], "answer": 0, "rationale": "Erik Erikson's theory is built around psychosocial crises at each life stage.", "diff": 4}, {"chapter": 2, "n": 50, "tag": "2024 · Q12", "q": "The id is the part of our personality which is made of ______ drives.", "options": ["Basic", "unconscious", "Conscious", "Instinctual"], "answer": 3, "rationale": "The id operates on instinctual drives.", "diff": 4}, {"chapter": 2, "n": 51, "tag": "2024 · Q51", "q": "Which theorist emphasized \"psychosocial crises\" across development, including trust vs. mistrust and industry vs. inferiority?", "options": ["Erik Erikson", "Jean Piaget", "Lawrence Kohlberg", "Lev Vygotsky"], "answer": 0, "rationale": "Erik Erikson's theory is built around psychosocial crises at each life stage.", "diff": 4}, {"chapter": 2, "n": 52, "tag": "2024 · Q53", "q": "What is the main premise of psychoanalysis?", "options": ["Behavior is determined solely by genetics", "Behavior is determined solely by environmental factors", "Behavior is influenced by unconscious motives and conflicts", "Behavior is a result of conscious decision-making"], "answer": 2, "rationale": "Psychoanalysis holds that unconscious motives and conflicts drive behavior.", "diff": 4}, {"chapter": 2, "n": 53, "tag": "2024 · Q54", "q": "Who is considered the founder of psychoanalysis?", "options": ["Sigmund Freud", "John Watson", "Ivan Pavlov", "Carl Rogers"], "answer": 0, "rationale": "Sigmund Freud founded psychoanalysis.", "diff": 2}, {"chapter": 2, "n": 54, "tag": "2024 · Q55", "q": "According to Freud, which component of the mind operates on the pleasure principle?", "options": ["Ego", "Superego", "Id", "Ego Ideal"], "answer": 2, "rationale": "The id seeks immediate gratification under the pleasure principle.", "diff": 2}, {"chapter": 2, "n": 55, "tag": "2024 · Q58", "q": "Sigmund Freud's theory of psychosexual development is based on the idea that:", "options": ["Children are driven by a need for social interaction", "Cognitive development is the most important factor in personality", "Sexual energy is a key motivator in human behavior", "Children are driven by a need of family interaction"], "answer": 2, "rationale": "Freud's theory centers on sexual (libidinal) energy as a key motivator.", "diff": 3}, {"chapter": 2, "n": 56, "tag": "2024 · Q65", "q": "What term did Freud use to describe the process by which thoughts or impulses are kept out of conscious awareness?", "options": ["Repression", "Regression", "Rationalization", "Sublimation"], "answer": 0, "rationale": "Repression pushes unwanted thoughts out of conscious awareness.", "diff": 3}, {"chapter": 2, "n": 57, "tag": "2025 · Q4", "q": "Erikson's theory is based on:", "options": ["Cognitive stages", "Biological stages", "Motor stages", "Psychosocial stages"], "answer": 3, "rationale": "Erikson described eight psychosocial stages, each with a crisis between the person's needs and social demands.", "diff": 1}, {"chapter": 2, "n": 58, "tag": "2025 · Q21", "q": "During therapy, a patient suddenly remembers a childhood incident that was forgotten but not repressed. According to Freud, this memory was stored in the:", "options": ["Unconscious mind", "Id", "Conscious mind", "Preconscious mind"], "answer": 3, "rationale": "The preconscious holds material that is not currently in awareness but can be recalled with effort. Repressed material stays in the unconscious.", "diff": 1}, {"chapter": 2, "n": 59, "tag": "2025 · Q33", "q": "Understanding developmental psychology improves nursing care by:", "options": ["Improving surgical skills", "Increasing medication accuracy", "Enhancing communication", "Reducing lab errors"], "answer": 2, "rationale": "Knowing what to expect at each age lets nurses communicate and care in an age-appropriate way.", "diff": 3}, {"chapter": 2, "n": 60, "tag": "2025 · Q48", "q": "When a child adjusts their existing schema to fit new information, this is called:", "options": ["Assimilation", "Conservation", "Accommodation", "Object permanence"], "answer": 2, "rationale": "Accommodation changes existing schemas to fit new information; assimilation fits new information into existing schemas.", "diff": 4}, {"chapter": 2, "n": 61, "tag": "2025 · Q53", "q": "Erikson's theory focuses on:", "options": ["Cognitive development", "Psychosocial development", "Moral development", "Physical development"], "answer": 1, "rationale": "Erikson's theory describes psychosocial development across the lifespan.", "diff": 2}, {"chapter": 2, "n": 62, "tag": "2025 · Q57", "q": "After failing to pass his doctoral examinations, Giorgio spends days in bed cuddling his favorite childhood toy. This behavior represents:", "options": ["Sublimation", "Regression", "Repression", "Displacement"], "answer": 1, "rationale": "Regression is a defense mechanism in which a person returns to an earlier, more childlike behavior under stress.", "diff": 4}, {"chapter": 2, "n": 63, "tag": "2025 · Q61", "q": "Freud's theory mainly focuses on:", "options": ["Unconscious mind", "Physical growth", "Social norms", "Learning"], "answer": 0, "rationale": "Freud's psychoanalytic theory emphasizes unconscious drives and conflicts.", "diff": 2}, {"chapter": 2, "n": 64, "tag": "2025 · Q64", "q": "Developmental psychology studies:", "options": ["Only adults", "Only children", "Lifespan changes", "Only behavior"], "answer": 2, "rationale": "Developmental psychology studies how people change physically, cognitively and socially across the whole lifespan.", "diff": 4}, {"chapter": 3, "n": 1, "tag": "2017 · Q24", "q": "According to Arnold Gesell, in \"Developmental Quotient\" (infant intelligence) we assess all the areas except?", "options": ["Motor Skills", "Eye blinking", "Adaptive Behavior (alertness & exploration)", "Personal-Social (feeding and dressing)"], "answer": 1, "rationale": "Gesell's schedule assesses motor, adaptive, language and personal-social behavior; \"eye blinking\" alone is not one of the assessed domains.", "diff": 2}, {"chapter": 3, "n": 2, "tag": "2017 · Q43", "q": "According to Jean Piaget, object permanence occurs in which stage?", "options": ["Sensorimotor", "Preoperational", "Concrete operational", "Formal operational"], "answer": 0, "rationale": "Object permanence develops during the sensorimotor stage.", "diff": 1}, {"chapter": 3, "n": 3, "tag": "2017 · Q69", "q": "All of the following are survival reflexes except?", "options": ["Breathing Reflex", "Sucking Reflex", "Papillary Reflex", "Plantar Reflex"], "answer": 3, "rationale": "Breathing, sucking and pupillary responses are survival reflexes, whereas the plantar reflex is a primitive reflex rather than a survival reflex.", "diff": 3}, {"chapter": 3, "n": 4, "tag": "2018 · Q5", "q": "In Freud's oral developmental stage, the pleasure is centered around the ______.", "options": ["Mouth", "Genitals", "Faeces", "opposite sex"], "answer": 0, "rationale": "The oral stage centers pleasure on the mouth.", "diff": 3}, {"chapter": 3, "n": 5, "tag": "2018 · Q32", "q": "The period of sensorimotor adaptation of Piaget is:", "options": ["0-2 years", "1-3 years", "3-5 years", "4-6 years"], "answer": 0, "rationale": "The sensorimotor stage spans roughly birth to age 2.", "diff": 4}, {"chapter": 3, "n": 6, "tag": "2018 · Q39", "q": "Which of these are associated with insecurely attached infants in later life?", "options": ["less competent", "has less mature friends", "less socially skilled", "b and c", "all of the above"], "answer": 4, "rationale": "Insecure attachment is linked with lower competence, less mature friendships and poorer social skills, so all apply.", "diff": 2}, {"chapter": 3, "n": 7, "tag": "2018 · Q40", "q": "According to Erikson's eight stages of psychosocial development, during which age does the psychological stage of trust vs. mistrust develop?", "options": ["early childhood", "Infancy", "adolescence", "adulthood", "old age"], "answer": 1, "rationale": "Trust vs. mistrust is Erikson's first stage, occurring in infancy.", "diff": 4}, {"chapter": 3, "n": 8, "tag": "2018 · Q53", "q": "Which is the developmental stage in Erikson's theory that represents ages 1 to 3 years?", "options": ["Autonomy vs. shame", "Initiative vs. guilt", "Trust vs. mistrust", "Identity vs. identity diffusion"], "answer": 0, "rationale": "Autonomy vs. shame and doubt occurs roughly ages 1-3.", "diff": 4}, {"chapter": 3, "n": 9, "tag": "2018 · Q56", "q": "Stages of psychosocial development: Basic trust versus mistrust occurs at:", "options": ["1 to 3 years", "birth to 1 year", "3 to 6 years", "6 to 11 years"], "answer": 1, "rationale": "Trust vs. mistrust occurs from birth to about 1 year.", "diff": 4}, {"chapter": 3, "n": 10, "tag": "2018 · Q57", "q": "The rooting reflex occurs when a:", "options": ["newborn's foot is tickled", "newborn's cheek is touched", "newborn hears a loud noise", "newborn makes eye contact with his or her caregiver"], "answer": 1, "rationale": "The rooting reflex is triggered by touching the newborn's cheek.", "diff": 2}, {"chapter": 3, "n": 11, "tag": "2019 · Q5", "q": "According to Erikson's eight stages of psychosocial development, during which age does the psychological stage of trust vs. mistrust develop?", "options": ["Early childhood", "Infancy", "Adolescence", "Adulthood"], "answer": 1, "rationale": "Trust vs. mistrust is Erikson's first stage, occurring in infancy.", "diff": 4}, {"chapter": 3, "n": 12, "tag": "2019 · Q31", "q": "According to Sigmund Freud, if a child becomes anally fixated and may not pass beyond the anal stage, which type of disorder may he/she develop in later life?", "options": ["Schizophrenic disorder", "Obsessive Compulsive disorder", "Phobia", "Delusional disorder"], "answer": 1, "rationale": "Anal fixation is classically linked to obsessive-compulsive traits/disorder in Freud's theory.", "diff": 4}, {"chapter": 3, "n": 13, "tag": "2019 · Q42", "q": "These are all primitive reflexes except?", "options": ["Moro reflex", "Babinski reflex", "Snout reflex", "Rooting"], "answer": 2, "rationale": "Moro, Babinski and rooting are the classic primitive reflexes of infancy, while the snout reflex is a frontal release reflex seen mainly in frontal lobe dysfunction, so it is the exception here.", "diff": 4}, {"chapter": 3, "n": 14, "tag": "2019 · Q44", "q": "According to Jean Piaget, object permanence occurs in which stage?", "options": ["Sensorimotor", "Preoperational", "Concrete operational", "Formal operational"], "answer": 0, "rationale": "Object permanence develops during the sensorimotor stage.", "diff": 1}, {"chapter": 3, "n": 15, "tag": "2019 · Q58", "q": "The intense, enduring, social-emotional relationship that develops between a child and a caregiver is termed?", "options": ["Imprinting", "Intimacy", "Attachment", "Familiarity"], "answer": 2, "rationale": "This describes attachment.", "diff": 3}, {"chapter": 3, "n": 16, "tag": "2022 · Q6", "q": "A temperamental profile in which the child is irregular in daily routines and adapts slowly to new experiences, often responding negatively and intensely, is known as?", "options": ["Easy temperament", "Difficult temperament", "Slow-to-warm-up temperament", "Environmental temperament"], "answer": 1, "rationale": "Irregularity, slow adaptation and intense negative reactions describe difficult temperament.", "diff": 2}, {"chapter": 3, "n": 17, "tag": "2022 · Q7", "q": "Which mostly affects the development of emotional self-regulation?", "options": ["Motivation", "Learning", "Perception", "Temperament"], "answer": 3, "rationale": "Temperament is a major influence on emotional self-regulation development.", "diff": 2}, {"chapter": 3, "n": 18, "tag": "2022 · Q47", "q": "Infants begin to display such complex emotions as embarrassment, shame, guilt, envy, and pride. These feelings are sometimes called self-conscious emotions because each involves some damage to or enhancement of our sense of self. These start at the age......", "options": ["Birth", "2-7 months", "12-24 months", "None of the above"], "answer": 2, "rationale": "Self-conscious emotions typically emerge around 12-24 months, once self-awareness develops.", "diff": 3}, {"chapter": 3, "n": 19, "tag": "2022 · Q48", "q": "When does an infant understand the differences between animate and inanimate objects?", "options": ["Birth to 3 months", "3 to 6 months", "6 to 9 months", "9 to 12 months"], "answer": 2, "rationale": "Infants begin distinguishing animate from inanimate objects around 6-9 months.", "diff": 4}, {"chapter": 3, "n": 20, "tag": "2022 · Q49", "q": "In which sub-stage of the sensorimotor stage does the child understand the environment purely through innate reflexes such as sucking and looking?", "options": ["Coordination of Reactions", "Reflexes", "Secondary Circular Reactions", "Tertiary Circular Reactions"], "answer": 1, "rationale": "The first substage of the sensorimotor stage relies on innate reflexes.", "diff": 2}, {"chapter": 3, "n": 21, "tag": "2022 · Q53", "q": "According to Jean Piaget, object permanence occurs in which stage?", "options": ["Sensorimotor", "Preoperational", "Concrete operational", "Formal operational"], "answer": 0, "rationale": "Object permanence develops during the sensorimotor stage.", "diff": 1}, {"chapter": 3, "n": 22, "tag": "2022 · Q54", "q": "Which achievement is considered an important milestone in fine motor development of a child?", "options": ["Top-level reaching", "Palmar grasp", "Finger dexterity", "Balancing"], "answer": 2, "rationale": "Finger dexterity (e.g. pincer grasp) is a key fine motor milestone.", "diff": 2}, {"chapter": 3, "n": 23, "tag": "2023 · Q13", "q": "During the anal stage of psychosexual development, what is the main source of pleasure and conflict?", "options": ["Oral gratification", "Toilet training and control", "Exploration of the genitals", "Development of strong attachments"], "answer": 1, "rationale": "The anal stage centers on toilet training and control.", "diff": 4}, {"chapter": 3, "n": 24, "tag": "2023 · Q23", "q": "Which milestone typically occurs first in fine motor development?", "options": ["Scribbling with a crayon", "Using a pincer grasp", "Grasping objects with fingers", "Tying shoelaces"], "answer": 2, "rationale": "Whole-hand grasping of objects develops before the pincer grasp, scribbling and tying laces.", "diff": 3}, {"chapter": 3, "n": 25, "tag": "2023 · Q24", "q": "Which of the following is an example of a gross motor skill?", "options": ["Grasping a small object with fingers", "Drawing intricate shapes", "Jumping with two feet off the ground", "Manipulating small objects with precision"], "answer": 2, "rationale": "Gross motor skills use large muscle groups, like jumping; the others are fine motor skills.", "diff": 4}, {"chapter": 3, "n": 26, "tag": "2023 · Q25", "q": "Which factors can influence motor development in children?", "options": ["Genetics", "Nutrition", "Environmental stimulation", "All of the above"], "answer": 3, "rationale": "Genetics, nutrition and environment all shape motor", "diff": 2}, {"chapter": 3, "n": 27, "tag": "2023 · Q36", "q": "Freud's psychosexual development theory also includes a stage focused on:", "options": ["Development of moral compass and sense of right and wrong", "Formation of a strong sense of self-identity and exploration of intimacy", "Refinement of fine motor skills and hand-eye coordination", "Establishment of trust and security in the primary caregiver relationship"], "answer": 3, "rationale": "The oral stage establishes trust and security through the caregiver relationship (feeding).", "diff": 1}, {"chapter": 3, "n": 28, "tag": "2024 · Q6", "q": "During the anal stage of psychosexual development, what is the main source of pleasure and conflict?", "options": ["Oral gratification", "Toilet training and control", "Exploration of the genitals", "Development of strong attachments"], "answer": 1, "rationale": "The anal stage centers on toilet training and control.", "diff": 4}, {"chapter": 3, "n": 29, "tag": "2024 · Q18", "q": "In addition to the stages mentioned in the passage, Freud's psychosexual development theory also includes a stage focused on:", "options": ["Development of moral compass and sense of right and wrong", "Formation of a strong sense of self-identity and exploration of intimacy", "Refinement of fine motor skills and hand-eye coordination", "Establishment of trust and security in the primary caregiver relationship"], "answer": 3, "rationale": "The oral stage establishes trust and security through the caregiver relationship.", "diff": 2}, {"chapter": 3, "n": 30, "tag": "2024 · Q43", "q": "Which milestone typically occurs first in fine motor development?", "options": ["Scribbling with a crayon", "Using a pincer grasp", "Grasping objects with fingers", "Tying shoelaces"], "answer": 2, "rationale": "Whole-hand grasping develops before the pincer grasp, scribbling and tying laces.", "diff": 3}, {"chapter": 3, "n": 31, "tag": "2024 · Q44", "q": "Which of the following is an example of a gross motor skill?", "options": ["Jumping with two feet off the ground", "Using a pincer grasp", "Manipulating small objects with precision", "Drawing intricate shapes"], "answer": 0, "rationale": "Gross motor skills use large muscle groups, like jumping.", "diff": 4}, {"chapter": 3, "n": 32, "tag": "2025 · Q1", "q": "A 4-month-old baby accidentally sucks his thumb and repeats the action because it feels pleasurable. This is an example of:", "options": ["Primary reactions", "Secondary reactions", "Tertiary reactions", "Coordinated reactions"], "answer": 0, "rationale": "Repeating a pleasurable action centered on the infant's own body (1-4 months) is a primary circular reaction in Piaget's sensorimotor stage.", "diff": 2}, {"chapter": 3, "n": 33, "tag": "2025 · Q15", "q": "A child is often left alone without caregiver interaction. This may lead to:", "options": ["Emotional insecurity", "Advanced social skills", "Improved independence", "High academic performance"], "answer": 0, "rationale": "Lack of responsive caregiving disrupts secure attachment and leads to emotional insecurity.", "diff": 4}, {"chapter": 3, "n": 34, "tag": "2025 · Q18", "q": "Object permanence develops in:", "options": ["Sensorimotor stage", "Preoperational stage", "Formal stage", "Concrete stage"], "answer": 0, "rationale": "Understanding that objects exist when out of sight develops in Piaget's sensorimotor stage (birth-2 years), mainly around 8-12 months.", "diff": 1}, {"chapter": 3, "n": 35, "tag": "2025 · Q22", "q": "A nurse educates parents on toddler tantrums using:", "options": ["Kohlberg's stages", "Bandura's theory", "Erikson's stages", "Piaget's theory"], "answer": 2, "rationale": "Toddlers are in Erikson's autonomy vs. shame and doubt stage; tantrums reflect the struggle for independence.", "diff": 1}, {"chapter": 3, "n": 36, "tag": "2025 · Q30", "q": "A 3-month-old infant can hold his head steady when held upright, but still has poor control over his legs. This pattern of development illustrates the:", "options": ["Cephalocaudal Principle", "Conservation", "Hand-Eye Coordination", "Proximodistal Principle"], "answer": 0, "rationale": "Cephalocaudal development proceeds from head to toe: head control comes before trunk and leg control.", "diff": 2}, {"chapter": 3, "n": 37, "tag": "2025 · Q37", "q": "A 12-month-old toddler carries a soft blanket everywhere and holds it when feeling tired or upset. This blanket serves as a:", "options": ["Cognitive stimulus", "Motor aid", "Language prompt", "Transitional object or \"lovey\""], "answer": 3, "rationale": "A comfort item that helps a child cope with separation and stress is a transitional object (Winnicott).", "diff": 1}, {"chapter": 3, "n": 38, "tag": "2025 · Q39", "q": "A 5-month-old infant reaches out and grasps a rattle placed in front of him. This action is an example of:", "options": ["Cephalocaudal Principle", "Proximodistal Principle", "Object permanence", "Grasping as a fine motor skill"], "answer": 3, "rationale": "Reaching for and grasping a rattle is a voluntary fine motor skill using the small muscles of the hand; the proximodistal principle describes the direction of development, not the skill itself.", "diff": 2}, {"chapter": 3, "n": 39, "tag": "2025 · Q54", "q": "A nurse assesses a 4-year-old child who continues thumb-sucking despite multiple attempts to stop it. According to Freud, this behavior may indicate:", "options": ["Behavioral conditioning", "Superego conflict", "Ego dominance", "Oral fixation"], "answer": 3, "rationale": "Persistent thumb-sucking beyond the oral stage (0-18 months) suggests oral fixation in Freud's psychosexual theory.", "diff": 3}, {"chapter": 3, "n": 40, "tag": "2025 · Q55", "q": "A 2-year-old toddler insists on dressing himself even though it takes a long time and the clothes don't match. The nurse should support this behavior because it promotes:", "options": ["Trust vs. Mistrust", "Intimacy vs. Isolation", "Identity vs. Confusion", "Autonomy vs. Shame and Doubt"], "answer": 3, "rationale": "Toddlers (1-3 years) are in Erikson's autonomy vs. shame and doubt stage; supporting self-care builds autonomy.", "diff": 2}, {"chapter": 3, "n": 41, "tag": "2025 · Q63", "q": "A 3-year-old child insists on controlling toilet training and becomes upset when parents try to help. This focus on bowel and bladder control is typical of which stage?", "options": ["Latency Stage", "Anal Stage", "Genital Stage", "Oral Stage"], "answer": 1, "rationale": "Freud's anal stage (1-3 years) centers on bowel and bladder control and toilet training.", "diff": 4}, {"chapter": 3, "n": 42, "tag": "2025 · Q65", "q": "A 9-month-old infant cries and clings to the mother when a visitor approaches, even though the visitor is smiling and gentle. This behavior is most consistent with:", "options": ["Stranger Anxiety", "Interactive Play milestone", "Favorite Things milestone", "Object Permanence"], "answer": 0, "rationale": "Stranger anxiety appears at about 6-9 months, when the infant can tell familiar from unfamiliar people.", "diff": 3}, {"chapter": 3, "n": 43, "tag": "2025 · Q69", "q": "A newborn infant automatically sucks when a nipple touches his lips. This behavior is characteristic of the:", "options": ["Reflex substage", "Secondary Circular Reactions", "Early Symbolic Thought", "Primary Circular Reactions"], "answer": 0, "rationale": "Automatic sucking is a reflex, the first substage of Piaget's sensorimotor stage (0-1 month). Circular reactions begin later, from about 1 month.", "diff": 3}, {"chapter": 4, "n": 1, "tag": "2017 · Q40", "q": "According to Sigmund Freud's psychosexual stages, boys develop the Oedipal complex during the ______ stage.", "options": ["Oral", "Anal", "Phallic", "Latency"], "answer": 2, "rationale": "The Oedipus complex occurs during the phallic stage.", "diff": 4}, {"chapter": 4, "n": 2, "tag": "2017 · Q45", "q": "In Piaget's stages of cognitive development, the pre-operational stage occurs at?", "options": ["2-7", "7-11", "12-15", "16-18"], "answer": 0, "rationale": "The preoperational stage spans roughly ages 2-7.", "diff": 1}, {"chapter": 4, "n": 3, "tag": "2017 · Q46", "q": "This is the tendency of the preschooler to attribute human-like traits or characteristics to inanimate objects.", "options": ["Transductive Reasoning", "Animism", "Constructive play", "Rationalization"], "answer": 1, "rationale": "Attributing life/feelings to objects is animism.", "diff": 3}, {"chapter": 4, "n": 4, "tag": "2017 · Q47", "q": "In ______, a child pretends to be someone else, for example the teacher or a doctor?", "options": ["Dramatic play", "Functional play", "Constructive play", "None of the above"], "answer": 0, "rationale": "Pretending to be someone else is dramatic (pretend) play.", "diff": 4}, {"chapter": 4, "n": 5, "tag": "2017 · Q48", "q": "This is the tendency of the preschooler to only see his point of view and to assume that everyone else also has his point of view?", "options": ["Egocentrism", "Centration", "Animism", "Symbolic representation"], "answer": 0, "rationale": "Egocentrism is the inability to see beyond one's own point of view.", "diff": 2}, {"chapter": 4, "n": 6, "tag": "2018 · Q12", "q": "In which of the following stages is the Oedipus complex observed?", "options": ["Oral stage", "Anal stage", "Phallic stage", "Genital stage"], "answer": 2, "rationale": "The Oedipus complex occurs in the phallic stage.", "diff": 1}, {"chapter": 4, "n": 7, "tag": "2018 · Q29", "q": "The smallest unit of meaning in a language is:", "options": ["Syntax", "Morpheme", "Pragmatics", "Phoneme"], "answer": 1, "rationale": "A morpheme is the smallest meaningful unit of language.", "diff": 1}, {"chapter": 4, "n": 8, "tag": "2018 · Q34", "q": "In which of the following stages does the child look self-centered?", "options": ["Infancy", "Early childhood", "Adolescence", "Adulthood"], "answer": 1, "rationale": "Egocentrism is characteristic of early childhood (preoperational stage).", "diff": 1}, {"chapter": 4, "n": 9, "tag": "2018 · Q58", "q": "Jean Piaget defined egocentrism as:", "options": ["The belief that young adults don't listen to their parents", "The idea that preschool children cannot see things from another's point of view", "The understanding that young children cannot learn outside of a structured classroom", "The idea that young children are selfish and grow out of it over time"], "answer": 1, "rationale": "Egocentrism is the inability of preschool children to see another's point of view.", "diff": 1}, {"chapter": 4, "n": 10, "tag": "2019 · Q1", "q": "The period of development during which school readiness skills are developed and most free time is spent playing with friends is called:", "options": ["Infancy", "Early childhood", "Middle childhood", "Late childhood"], "answer": 1, "rationale": "In early childhood, the preschool years, children develop school readiness skills and spend much of their free time playing with peers.", "diff": 2}, {"chapter": 4, "n": 11, "tag": "2019 · Q19", "q": "An ability to use words, images, and symbols to represent the world is?", "options": ["Symbolic thought", "Centration", "Irreversibility", "Animism"], "answer": 0, "rationale": "Using symbols to represent the world is symbolic thought.", "diff": 1}, {"chapter": 4, "n": 12, "tag": "2019 · Q21", "q": "In the preoperational stage, a child cannot mentally reverse a sequence of events or logical operations back to the starting point. This is called?", "options": ["Symbolic thought", "Centration", "Irreversibility", "Animism"], "answer": 2, "rationale": "Inability to mentally reverse a sequence is irreversibility.", "diff": 4}, {"chapter": 4, "n": 13, "tag": "2019 · Q23", "q": "The child's inability to take another person's point of view?", "options": ["Symbolic thought", "Centration", "Egocentrism", "Animism"], "answer": 2, "rationale": "Inability to take another's viewpoint is egocentrism.", "diff": 2}, {"chapter": 4, "n": 14, "tag": "2019 · Q25", "q": "The term used for the study of sentence construction is:", "options": ["Pragmatics", "Syntax", "Fast mapping", "Phonology"], "answer": 1, "rationale": "Syntax is the study of sentence structure/construction.", "diff": 1}, {"chapter": 4, "n": 15, "tag": "2019 · Q26", "q": "The term used for the study of conversation or social uses of language is:", "options": ["Pragmatics", "Fast mapping", "Semantics", "Phonology"], "answer": 0, "rationale": "Pragmatics studies the social/contextual use of language.", "diff": 2}, {"chapter": 4, "n": 16, "tag": "2019 · Q27", "q": "A process by which children absorb the meaning of a new word after hearing it once or twice in conversation is called?", "options": ["Pragmatics", "Fast mapping", "Semantics", "Phonology"], "answer": 1, "rationale": "Quickly learning a word's meaning from limited exposure is fast mapping.", "diff": 4}, {"chapter": 4, "n": 17, "tag": "2019 · Q28", "q": "The type of play that is a sensorimotor approach in which a child learns the nature of his or her surroundings, e.g. dumping, filling, stacking, is called?", "options": ["Functional play", "Constructive play", "Dramatic play", "Games with rules"], "answer": 0, "rationale": "Repetitive sensorimotor actions like dumping and stacking are functional play.", "diff": 3}, {"chapter": 4, "n": 18, "tag": "2019 · Q29", "q": "Resolution of the oedipal complex occurs in which stage of Sigmund Freud's psychosexual stages of", "options": ["Anal", "Phallic", "Latency", "Genital"], "answer": 1, "rationale": "The Oedipus complex arises in the phallic stage and is resolved there by identification with the same-sex parent, after which the child enters latency.", "diff": 3}, {"chapter": 4, "n": 19, "tag": "2019 · Q30", "q": "In Sigmund Freud's psychosexual stages of development, the phallic stage occurs at age?", "options": ["18-36 months", "3-5 years", "5-11 years", "11-13 years"], "answer": 1, "rationale": "The phallic stage occurs roughly at ages 3-5 (or 3-6).", "diff": 2}, {"chapter": 4, "n": 20, "tag": "2019 · Q34", "q": "ADHD, autism spectrum disorder, and bladder control problems are the disorders of ______.", "options": ["Infancy", "Pre-school child", "School child"], "answer": 1, "rationale": "Autism appears in early childhood, and ADHD and bladder-control problems are commonly first noticed in the preschool years.", "diff": 1}, {"chapter": 4, "n": 21, "tag": "2019 · Q49", "q": "Piaget held that egocentrism is characteristic of the:", "options": ["sensorimotor stage", "Preoperational stage", "Concrete operational stage", "Formal operational stage"], "answer": 1, "rationale": "Egocentrism is characteristic of the preoperational stage.", "diff": 2}, {"chapter": 4, "n": 22, "tag": "2022 · Q50", "q": "According to Sigmund Freud, the Oedipal complex is resolved in?", "options": ["Anal stage", "Phallic stage", "Latency stage", "Genital stage"], "answer": 1, "rationale": "The Oedipus complex arises and is resolved in the phallic stage, through identification with the same-sex parent, after which the child enters latency.", "diff": 2}, {"chapter": 4, "n": 23, "tag": "2022 · Q51", "q": "A process by which children absorb the meaning of a new word after hearing it once or twice in conversation is called?", "options": ["Pragmatics", "Fast mapping", "Semantics", "Phonology"], "answer": 1, "rationale": "Quickly learning a word's meaning from limited exposure is fast mapping.", "diff": 4}, {"chapter": 4, "n": 24, "tag": "2022 · Q52", "q": "The type of play that is a sensorimotor approach in which a child learns the nature of his or her surroundings, e.g. dumping, filling, stacking, is called?", "options": ["Functional play", "Constructive play", "Dramatic play", "Games with rules"], "answer": 0, "rationale": "Repetitive sensorimotor actions like dumping and stacking are functional play.", "diff": 3}, {"chapter": 4, "n": 25, "tag": "2022 · Q55", "q": "A child who does not have the ability to classify things into categories is known as?", "options": ["Symbolic functioning", "Animism", "Seriation", "Transitivity"], "answer": 2, "rationale": "The preoperational child cannot yet group or order objects systematically, a limitation described under seriation in this stage's account.", "diff": 1}, {"chapter": 4, "n": 26, "tag": "2023 · Q5", "q": "According to Freud, during which stage of psychosexual development does the Oedipus or Electra complex occur?", "options": ["Oral stage", "Anal stage", "Latency stage", "Phallic stage"], "answer": 3, "rationale": "The Oedipus/Electra complex occurs during the phallic stage.", "diff": 4}, {"chapter": 4, "n": 27, "tag": "2023 · Q7", "q": "Erikson's initiative vs. guilt stage focuses on children developing a sense of:", "options": ["Trust", "Independence and control", "intimacy", "Identity"], "answer": 1, "rationale": "In the initiative versus guilt stage preschool children begin to plan activities and assert control over their world, so independence and control captures this drive to act on their own ideas.", "diff": 2}, {"chapter": 4, "n": 28, "tag": "2023 · Q8", "q": "According to Piaget, the preoperational stage is characterized by:", "options": ["Symbolic thought", "Logical thinking", "Ability to perform complex calculations", "Understanding of abstract concepts"], "answer": 0, "rationale": "The preoperational stage (ages 2-7) is marked by symbolic thought.", "diff": 3}, {"chapter": 4, "n": 29, "tag": "2023 · Q9", "q": "A child who believes their stuffed animal feels sad when they are sad is exhibiting:", "options": ["Animism", "Conservation", "Irreversibility", "Centration"], "answer": 0, "rationale": "Animism is attributing feelings/life to inanimate objects, typical of preoperational thought.", "diff": 4}, {"chapter": 4, "n": 30, "tag": "2023 · Q10", "q": "In which type of play does a child use blocks or Legos to build a structure?", "options": ["Dramatic", "Functional play", "Constructive play", "Games with rules"], "answer": 2, "rationale": "Building with blocks is constructive play.", "diff": 3}, {"chapter": 4, "n": 31, "tag": "2023 · Q11", "q": "Which is a positive consequence of successful initiative in the preschool years?", "options": ["Increased dependence on other
