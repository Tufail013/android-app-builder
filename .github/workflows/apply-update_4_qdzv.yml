name: Apply update.zip
# Upload update.zip to the main folder of the repository. This workflow checks it, applies it, deletes it and
# (if the update asks for it) starts a build. The checking code lives in THIS file on purpose, so an update
# cannot change the rules that check it. Updates may not touch .github/, .git/, config.json or hidden files.
on:
  push:
    branches: [main]
    paths: ['update.zip']
  workflow_dispatch:
concurrency: apply-update
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for update.zip
        id: chk
        run: |
          if [ -f update.zip ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "No update.zip, nothing to do."; echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.found == 'true'
        with:
          python-version: '3.12'
      - name: Validate and apply update.zip
        id: apply
        if: steps.chk.outputs.found == 'true'
        run: |
          cat > "$RUNNER_TEMP/apply_update.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Safely applies update.zip to the repository. Nothing is written unless the WHOLE archive passes every check."""
          import argparse, json, os, posixpath, re, shutil, stat, sys, tempfile, zipfile

          ALLOW_DIRS = ('src/', 'engine/', 'features/', 'android-template/', 'tools/', 'tests/', 'docs/')
          ALLOW_FILES = {'generate.py', 'platform.json', 'README.md'}
          DENY_FILES = {'config.json', 'update.zip', 'update.json'}
          LIM = dict(entries=3000, file=20 * 2 ** 20, total=100 * 2 ** 20, ratio=300, depth=12, name=180)


          class Bad(Exception):
              pass


          def check_path(n):
              if not isinstance(n, str) or not n:
                  raise Bad('empty or non-text path')
              if '\x00' in n or '\\' in n or ':' in n:
                  raise Bad('illegal character in path: %r' % n)
              if n.startswith('/'):
                  raise Bad('absolute path: ' + n)
              parts = n.split('/')
              if any(p in ('', '.', '..') for p in parts):
                  raise Bad('path traversal or empty segment: ' + n)
              if any(p.startswith('.') for p in parts):
                  raise Bad('hidden or dot path not allowed (this blocks .github and .git): ' + n)
              if len(n) > LIM['name'] or len(parts) > LIM['depth']:
                  raise Bad('path too long or too deep: ' + n)
              if posixpath.normpath(n) != n:
                  raise Bad('path is not normalised: ' + n)
              if n in DENY_FILES:
                  raise Bad('file may not be replaced by an update: ' + n)
              if not (n in ALLOW_FILES or n.startswith(ALLOW_DIRS)):
                  raise Bad('outside the folders an update may change: ' + n)
              return n


          def safe_name(s):
              return re.sub(r'[^A-Za-z0-9 ._-]', '', str(s or 'update'))[:60].strip() or 'update'


          def apply(zip_path, root, dry=False):
              root = os.path.realpath(root)
              with zipfile.ZipFile(zip_path) as z:
                  infos = z.infolist()
                  if len(infos) > LIM['entries']:
                      raise Bad('too many entries')
                  manifest = {}
                  for i in infos:
                      if i.filename == 'update.json':
                          if i.file_size > 65536:
                              raise Bad('update.json too large')
                          try:
                              manifest = json.loads(z.read(i).decode('utf-8'))
                          except Exception:
                              raise Bad('update.json is not valid JSON')
                          if not isinstance(manifest, dict):
                              raise Bad('update.json must be an object')
                  total, seen, plan = 0, set(), []
                  for i in infos:
                      if i.is_dir() or i.filename == 'update.json':
                          continue
                      mode = i.external_attr >> 16
                      if stat.S_IFMT(mode) not in (0, stat.S_IFREG):
                          raise Bad('links or special files are not allowed: ' + i.filename)
                      if i.flag_bits & 1:
                          raise Bad('encrypted entries are not allowed')
                      check_path(i.filename)
                      low = i.filename.lower()
                      if low in seen:
                          raise Bad('duplicate path: ' + i.filename)
                      seen.add(low)
                      if i.file_size > LIM['file']:
                          raise Bad('file too large: ' + i.filename)
                      total += i.file_size
                      if total > LIM['total']:
                          raise Bad('update is too large')
                      if i.file_size > 2 ** 20 and i.file_size / max(1, i.compress_size) > LIM['ratio']:
                          raise Bad('suspicious compression ratio: ' + i.filename)
                      plan.append(i)
                  dels = manifest.get('delete', [])
                  if not isinstance(dels, list) or len(dels) > 200:
                      raise Bad('"delete" must be a list of at most 200 paths')
                  dels = [check_path(x) for x in dels]
                  if not plan and not dels:
                      raise Bad('the update contains no files')
                  tmp = tempfile.mkdtemp()
                  try:
                      for i in plan:  # extract with real byte counting, never trusting the header
                          dest = os.path.join(tmp, *i.filename.split('/'))
                          os.makedirs(os.path.dirname(dest), exist_ok=True)
                          n = 0
                          with z.open(i) as src, open(dest, 'wb') as out:
                              while True:
                                  b = src.read(65536)
                                  if not b:
                                      break
                                  n += len(b)
                                  if n > LIM['file']:
                                      raise Bad('file larger than declared: ' + i.filename)
                                  out.write(b)
                      targets = []
                      for name in [i.filename for i in plan] + dels:
                          p = os.path.join(root, *name.split('/'))
                          if not os.path.realpath(p).startswith(root + os.sep):
                              raise Bad('resolves outside the repository: ' + name)
                          cur = root
                          for part in name.split('/')[:-1]:
                              cur = os.path.join(cur, part)
                              if os.path.islink(cur):
                                  raise Bad('a folder in the repository is a link: ' + name)
                          if os.path.islink(p):
                              raise Bad('target is a link: ' + name)
                          targets.append(p)
                      added, updated, deleted, skipped = [], [], [], []
                      if not dry:
                          for i in plan:
                              p = os.path.join(root, *i.filename.split('/'))
                              (updated if os.path.exists(p) else added).append(i.filename)
                              os.makedirs(os.path.dirname(p), exist_ok=True)
                              shutil.copyfile(os.path.join(tmp, *i.filename.split('/')), p)
                          for name in dels:
                              p = os.path.join(root, *name.split('/'))
                              if os.path.isfile(p):
                                  os.remove(p)
                                  deleted.append(name)
                              else:
                                  skipped.append(name)
                      else:
                          added = [i.filename for i in plan]
                  finally:
                      shutil.rmtree(tmp, ignore_errors=True)
              return {'name': safe_name(manifest.get('name')), 'build': manifest.get('build') is True, 'added': added, 'updated': updated, 'deleted': deleted, 'skipped': skipped, 'notes': str(manifest.get('notes', ''))[:500]}


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--zip', default='update.zip')
              ap.add_argument('--root', default='.')
              ap.add_argument('--dry-run', action='store_true')
              a = ap.parse_args()
              try:
                  r = apply(a.zip, a.root, a.dry_run)
              except (Bad, zipfile.BadZipFile) as e:
                  msg = 'UPDATE REJECTED, nothing was changed: %s' % e
                  print(msg)
                  if os.environ.get('GITHUB_STEP_SUMMARY'):
                      open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('### ' + msg + '\n')
                  sys.exit(1)
              lines = ['Update "%s" applied.' % r['name'], 'Added %d, updated %d, deleted %d files.' % (len(r['added']), len(r['updated']), len(r['deleted']))]
              for k in ('added', 'updated', 'deleted'):
                  lines += ['  %s: %s' % (k, x) for x in r[k]]
              lines += ['  skipped (not found): %s' % x for x in r['skipped']]
              print('\n'.join(lines))
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('### ' + lines[0] + '\n```\n' + '\n'.join(lines[1:]) + '\n```\n')
              if os.environ.get('GITHUB_OUTPUT'):
                  open(os.environ['GITHUB_OUTPUT'], 'a').write('name=%s\nbuild=%s\n' % (r['name'], 'true' if r['build'] else 'false'))


          if __name__ == '__main__':
              main()
          PYEOF
          python3 "$RUNNER_TEMP/apply_update.py" --zip update.zip --root .
      - name: Commit the result
        if: steps.chk.outputs.found == 'true'
        env:
          UPDATE_NAME: ${{ steps.apply.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f update.zip
          git add -A
          git commit -m "Apply update.zip: $UPDATE_NAME" || echo "Nothing to commit"
          git push
      - name: Start a build if the update asks for one
        if: steps.chk.outputs.found == 'true' && steps.apply.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
