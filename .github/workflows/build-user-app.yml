name: Build User App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [user-app-config.json]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python generate.py --config user-app-config.json --out build_app --report build-report/build-report.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle assembleDebug --stacktrace
        working-directory: build_app
      - uses: actions/upload-artifact@v4
        with:
          name: user-app-apk
          path: build_app/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-build-report
          path: build-report/
